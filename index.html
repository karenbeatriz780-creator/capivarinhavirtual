/* ================= JOGOS ================= */
.game-card{background:linear-gradient(165deg,#2A1620,#160B12);border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-xl);padding:1.5rem 1.2rem 1.7rem;}

/* --- ROLETA CASSINO --- */
.roleta-stage{position:relative;display:flex;flex-direction:column;align-items:center;}
.wheel-box{position:relative;width:min(320px,86vw);aspect-ratio:1;margin:.5rem auto 1.4rem;flex-shrink:0;}
.wheel-rim{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#F6D57A,#B8860B,#FFE9A8,#B8860B,#F6D57A,#8C6209,#FFE9A8,#B8860B,#F6D57A);
  box-shadow:0 0 0 3px #7A5307,0 16px 44px rgba(0,0,0,.6),inset 0 0 22px rgba(0,0,0,.4);}
.bulbs{position:absolute;inset:0;pointer-events:none;}
.bulb{position:absolute;width:9px;height:9px;border-radius:50%;background:#FFF3C4;left:50%;top:50%;
  box-shadow:0 0 7px 2px rgba(255,225,140,.85);animation:bulbBlink 1.1s ease-in-out infinite;}
@keyframes bulbBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
.wheel-svg{position:absolute;top:3%;right:5.6%;bottom:8.2%;left:5.6%;border-radius:50%;overflow:visible;
  transition:transform 5.4s cubic-bezier(.14,.85,.16,1);filter:drop-shadow(0 6px 16px rgba(0,0,0,.45));}
.wheel-svg text{font-family:'Inter',sans-serif;font-weight:800;fill:#fff;
  paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:2.6px;stroke-linejoin:round;}
.wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:19%;height:19%;
  border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFF6DA,#E8B44A 62%,#B8860B);
  display:flex;align-items:center;justify-content:center;z-index:5;
  box-shadow:0 5px 16px rgba(0,0,0,.5),inset 0 -2px 6px rgba(0,0,0,.25);}
.wheel-hub svg{width:46%;height:46%;fill:var(--rose-deep);display:block;transform:translateY(6%);}
.wheel-ptr{position:absolute;top:-3.5%;left:50%;transform:translateX(-50%);z-index:6;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.65));width:11%;}
.wheel-ptr svg{width:100%;display:block;}
.wheel-box.spinning .bulb{animation-duration:.24s;}
.spin-btn{background:linear-gradient(135deg,#F6D57A,#E8B44A 40%,#B8860B);color:#3A2405;font-weight:900;
  font-size:1rem;letter-spacing:.04em;padding:1.05rem 2.2rem;border-radius:100px;text-transform:uppercase;
  box-shadow:0 10px 26px rgba(184,134,11,.45),inset 0 -3px 0 rgba(0,0,0,.16);}
.spin-btn:disabled{filter:grayscale(.7);opacity:.6;}
.prize{margin-top:1.3rem;width:100%;background:linear-gradient(160deg,#3A2405,#241603);
  border:1.5px solid var(--gold);border-radius:var(--r-lg);padding:1.4rem 1.2rem;text-align:center;
  animation:prizeIn .65s var(--ease);position:relative;overflow:hidden;}
@keyframes prizeIn{0%{opacity:0;transform:scale(.82) translateY(14px);}70%{transform:scale(1.03);}100%{opacity:1;transform:none;}}
.prize .k{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;}
.prize .v{font-family:'Fraunces';font-size:clamp(1.5rem,7vw,2.1rem);font-weight:600;color:#FFF3C4;margin:.55rem 0 .3rem;line-height:1.2;}
.prize .d{font-size:.83rem;color:#D9BE86;line-height:1.55;}
.prize .code{display:inline-block;font-family:ui-monospace,monospace;font-size:.82rem;letter-spacing:.18em;
  background:rgba(255,255,255,.09);padding:.45rem .9rem;border-radius:8px;margin-top:.9rem;color:#FFF3C4;}
.prize-acts{display:flex;gap:.55rem;margin-top:1.1rem;flex-wrap:wrap;justify-content:center;}
.prize-acts button{font-size:.82rem;font-weight:800;padding:.72rem 1.15rem;border-radius:100px;}
.claim{background:var(--gold);color:#3A2405;}
.claim.done{background:rgba(255,255,255,.12);color:#D9BE86;}
.shareb{background:#25D366;color:#06301A;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:170;overflow:hidden;}
.cf{position:absolute;width:9px;height:14px;opacity:0;animation:cfall linear forwards;}
@keyframes cfall{0%{opacity:1;transform:translateY(-6vh) rotate(0);}100%{opacity:0;transform:translateY(104vh) rotate(720deg);}}

/* --- CAÇA-PALAVRAS --- */
.ws-wrap{display:flex;flex-direction:column;gap:1rem;}
.ws-grid{display:grid;gap:2px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;
  touch-action:none;user-select:none;-webkit-user-select:none;aspect-ratio:1;}
.ws-c{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);
  border-radius:5px;font-weight:800;color:#E6D6DD;font-size:clamp(.62rem,3vw,.92rem);
  transition:background .12s,color .12s,transform .12s;text-transform:uppercase;}
.ws-c.sel{background:var(--rose);color:#fff;transform:scale(1.07);}
.ws-c.found{background:rgba(232,180,74,.28);color:var(--gold);}
.ws-words{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;}
.ws-w{font-size:.78rem;font-weight:800;padding:.42rem .8rem;border-radius:100px;
  background:rgba(255,255,255,.08);color:#D9C7CE;letter-spacing:.04em;transition:all .25s;}
.ws-w.ok{background:rgba(232,180,74,.2);color:var(--gold);text-decoration:line-through;}
.ws-status{text-align:center;font-size:.85rem;color:#B99BA8;}

/* --- QUEBRA-CABEÇA --- */
.pz-wrap{display:flex;flex-direction:column;gap:.9rem;}
.pz-board{display:grid;gap:3px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;
  position:relative;touch-action:none;}
.pz-cell{position:relative;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden;
  transition:background .15s;}
.pz-cell.hot{background:rgba(227,43,109,.34);box-shadow:inset 0 0 0 2px var(--rose);}
.pz-cell .ghost{position:absolute;inset:0;opacity:.11;background-size:cover;}
.pz-tray{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;background:rgba(255,255,255,.05);
  border:1px dashed rgba(255,255,255,.14);border-radius:14px;padding:.7rem;min-height:5.4rem;touch-action:none;}
.pz-p{border-radius:5px;background-size:cover;cursor:grab;touch-action:none;
  box-shadow:0 3px 9px rgba(0,0,0,.4);transition:transform .16s var(--ease),box-shadow .16s;}
.pz-p:active{cursor:grabbing;}
.pz-p.drag{position:fixed;z-index:180;pointer-events:none;transform:scale(1.13) rotate(2deg);
  box-shadow:0 14px 34px rgba(0,0,0,.6);}
.pz-p.placed{box-shadow:none;border-radius:0;}
.pz-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(11,5,8,.78);backdrop-filter:blur(3px);border-radius:14px;gap:.6rem;animation:fadeUp .6s var(--ease);}
.pz-done b{font-family:'Fraunces';font-size:1.4rem;}
.pz-meta{display:flex;justify-content:space-between;font-size:.8rem;color:#B99BA8;font-weight:700;}

/* --- QUIZ / PERGUNTAS --- */
.qz{display:flex;flex-direction:column;gap:1rem;}
.qz-q{font-family:'Fraunces';font-size:1.15rem;font-weight:600;line-height:1.4;text-align:center;}
.qz-opts{display:flex;flex-direction:column;gap:.55rem;}
.qz-o{border:1.5px solid rgba(255,255,255,.14);border-radius:13px;padding:.85rem 1rem;font-size:.9rem;
  font-weight:600;text-align:left;background:rgba(255,255,255,.04);transition:all .18s;color:#E6D6DD;}
.qz-o:hover{border-color:var(--rose);}
.qz-o.right{border-color:#2BB673;background:rgba(43,182,115,.15);color:#7FE0B0;}
.qz-o.wrong{border-color:#D9534F;background:rgba(217,83,79,.13);color:#F0A6A4;}
.qz-prog{display:flex;gap:4px;justify-content:center;margin-bottom:.3rem;}
.qz-prog i{width:26px;height:4px;border-radius:4px;background:rgba(255,255,255,.16);}
.qz-prog i.on{background:var(--rose);}
.qz-prog i.ok{background:#2BB673;}
.qz-res{text-align:center;padding:1rem 0;}
.qz-res .sc{font-family:'Fraunces';font-size:3rem;font-weight:600;color:var(--rose-1);line-height:1;}

/* --- PALAVRA SECRETA --- */
.sw{text-align:center;}
.sw-boxes{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:1.2rem 0;}
.sw-b{width:2.35rem;height:2.85rem;border-radius:9px;background:rgba(255,255,255,.06);
  border-bottom:2.5px solid var(--rose);display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces';font-size:1.35rem;font-weight:600;text-transform:uppercase;}
.sw-b.rev{background:var(--rose);animation:pop .4s var(--ease);}
.sw-gap{width:1rem;}
.sw-inp{width:100%;max-width:17rem;margin:0 auto;text-align:center;border:1.5px solid rgba(255,255,255,.16);
  border-radius:12px;padding:.85rem;background:rgba(255,255,255,.05);color:#fff;font-weight:700;
  letter-spacing:.06em;outline:none;}
.sw-inp:focus{border-color:var(--rose);}
.sw-inp::placeholder{color:#7A6570;}
.sw-msg{font-size:.87rem;margin-top:.9rem;min-height:1.3em;font-weight:700;}
.sw-msg.ok{color:#7FE0B0;} .sw-msg.no{color:#F0A6A4;}
.sw-hint{font-size:.78rem;color:#8E7280;margin-top:.6rem;}

/* ================= KIT DE IMPRESSÃO (extras) ================= */
.ex-hero{background:linear-gradient(160deg,#FFF3F8,#fff);border:1.5px solid var(--rose-soft);
  border-radius:var(--r-lg);padding:1.3rem 1.2rem;margin-top:1.5rem;}
.ex-hero .tg{display:inline-flex;align-items:center;gap:.35rem;font-size:.66rem;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--rose-deep);background:#fff;
  border:1px solid var(--rose-soft);padding:.3rem .7rem;border-radius:100px;margin-bottom:.7rem;}
.ex-hero h3{font-size:1.1rem;font-weight:600;margin-bottom:.4rem;}
.ex-hero p{font-size:.87rem;color:var(--muted);line-height:1.55;}

.kit-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem;}
.kit-c{border:1.5px solid var(--line);border-radius:var(--r-md);padding:.9rem .8rem;background:#fff;
  text-align:left;transition:all .18s var(--ease);}
.kit-c:hover{border-color:var(--rose-1);}
.kit-c.on{border-color:var(--rose);background:var(--rose-soft);}
.kit-c .ic{font-size:1.5rem;margin-bottom:.35rem;}
.kit-c h4{font-size:.87rem;font-weight:800;color:var(--plum);}
.kit-c p{font-size:.74rem;color:var(--muted);margin-top:.15rem;line-height:1.35;}
.kit-c .pr{font-family:'Fraunces';font-size:1.05rem;font-weight:600;color:var(--rose-deep);margin-top:.4rem;}
.kit-c .lk{font-size:.7rem;font-weight:800;color:#0D7A44;margin-top:.4rem;}

.mold-tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;margin:1rem 0 .8rem;scrollbar-width:none;}
.mold-tabs::-webkit-scrollbar{display:none;}
.mold-t{flex-shrink:0;padding:.55rem .95rem;border-radius:100px;border:1.5px solid var(--line);
  background:#fff;font-size:.78rem;font-weight:700;white-space:nowrap;transition:all .18s;}
.mold-t.on{border-color:var(--rose);background:var(--rose);color:#fff;}
.mold-prev{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
  padding:.9rem;display:flex;justify-content:center;}
.mold-prev canvas{max-width:100%;height:auto;border-radius:6px;box-shadow:0 10px 26px rgba(22,17,19,.16);}
.mold-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem;margin-top:.9rem;}
.mold-slot{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  color:var(--muted-2);overflow:hidden;position:relative;}
.mold-slot.full{border-style:solid;border-color:var(--rose-soft);}
.mold-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.mold-slot .n{position:absolute;top:.25rem;left:.25rem;width:18px;height:18px;border-radius:50%;
  background:rgba(22,17,19,.6);color:#fff;font-size:.6rem;font-weight:800;display:flex;
  align-items:center;justify-content:center;z-index:2;}
.mold-slot svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;}
.mold-slot .lb{font-size:.62rem;font-weight:700;}
.locked{position:relative;}
.locked::after{content:"";position:absolute;inset:0;backdrop-filter:blur(7px);
  background:rgba(255,247,249,.45);border-radius:6px;}
.lock-tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
  background:var(--plum);color:#fff;font-size:.75rem;font-weight:800;padding:.6rem 1.1rem;
  border-radius:100px;display:flex;align-items:center;gap:.4rem;white-space:nowrap;}
.lock-tag svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;}

/* ---------- PRÉVIA NO WIZARD ---------- */
.wz-acoes{display:flex;gap:.6rem;}
.wz-acoes .btn{flex:1;}
.wz-prev{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;flex:0 0 auto!important;
  padding-left:1.1rem;padding-right:1.1rem;}
.wz-prev svg{width:16px;height:16px;}
.prev-bar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;align-items:center;
  justify-content:space-between;gap:.8rem;padding:.85rem 1.1rem;background:rgba(13,2,6,.94);
  backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12);}
.prev-bar span{display:inline-flex;align-items:center;gap:.45rem;color:#fff;font-size:.8rem;font-weight:600;}
.prev-bar svg{width:15px;height:15px;stroke:var(--rose-1);}
.prev-bar button{border:none;cursor:pointer;background:var(--rose);color:#fff;font-weight:700;
  padding:.65rem 1.2rem;border-radius:100px;font-size:.82rem;white-space:nowrap;}
.pk-dur .pp{font-size:1.5rem;font-weight:800;color:var(--rose);margin:.4rem 0 .3rem;}
.prev-vazio{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:2rem;color:#B99BA8;font-size:.95rem;line-height:1.6;max-width:20rem;margin:0 auto;}
.prev-etapa{padding-top:2.5rem;}
.prev-full{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;
  background:var(--rose-soft);color:var(--rose-deep);border:1px dashed var(--rose);border-radius:100px;
  padding:.8rem 1rem;font-size:.84rem;font-weight:700;margin:1.1rem 0 1.5rem;cursor:pointer;}
.prev-full svg{width:15px;height:15px;stroke:var(--rose-deep);flex:none;}

/* ---------- VITRINE "tudo que já vai no seu presente" ---------- */
.vt-grid{display:flex;flex-direction:column;gap:.8rem;margin-top:.4rem;}
.vt-anim{animation:vtIn .55s var(--ease) both;animation-delay:var(--vd,0s);}
@keyframes vtIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.vt-card{display:flex;align-items:center;gap:.9rem;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:.85rem;box-shadow:var(--shadow-sm);}
.vt-tx{flex:1;min-width:0;}
.vt-ic{font-size:1.05rem;}
.vt-tx h4{font-size:.95rem;font-weight:800;color:var(--plum);margin:.1rem 0 .18rem;}
.vt-tx p{font-size:.78rem;color:var(--muted);line-height:1.5;}
.vt-mini{flex:none;width:74px;height:74px;border-radius:14px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#2A1620,#160B12);display:flex;align-items:center;justify-content:center;}
.vtm-ctr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:80%;}
.vtm-ctr i{height:14px;border-radius:3px;background:linear-gradient(135deg,var(--rose-deep),var(--rose));}
.vtm-fotos{display:flex;gap:3px;}
.vtm-fotos span{width:17px;height:22px;background:#fff;padding:1.5px;box-shadow:0 2px 5px rgba(0,0,0,.3);}
.vtm-fotos span:nth-child(1){transform:rotate(-7deg);}
.vtm-fotos span:nth-child(3){transform:rotate(7deg);}
.vtm-fotos span::after{content:"";display:block;width:100%;height:100%;background:linear-gradient(150deg,#5A2740,#2C3E50);}
.vtm-tl{display:flex;flex-direction:column;gap:4px;width:72%;}
.vtm-tl b{height:10px;width:60%;border-radius:2px;background:#fff;}
.vtm-tl span{height:5px;width:80%;border-radius:3px;background:rgba(255,158,194,.55);align-self:flex-end;}
.vtm-st{display:flex;gap:4px;}
.vtm-st i{width:13px;height:34px;border-radius:4px;background:linear-gradient(180deg,#E32B6D,#6E1030);}
.vtm-st i:nth-child(2){transform:scale(1.16);background:linear-gradient(180deg,#FF9EC2,#B5124E);}
.vtm-carta{background:linear-gradient(170deg,#FFFCF8,#F0E2D0);width:74%;height:80%;border-radius:3px;padding:6px;position:relative;}
.vtm-carta b{display:block;width:52%;height:4px;background:#B5124E;border-radius:2px;margin-bottom:4px;}
.vtm-carta i{display:block;height:2.5px;background:#cbb8ab;border-radius:2px;margin-bottom:3px;}
.vtm-carta i:nth-child(3){width:88%;} .vtm-carta i:nth-child(4){width:70%;}
.vtm-carta u{position:absolute;bottom:5px;right:5px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#C0392B,#8B1A12);}
.vtm-env{display:flex;gap:3px;}
.vtm-env span{width:19px;height:14px;background:linear-gradient(160deg,#FBF3E4,#E6D6BC);border-radius:2px;position:relative;}
.vtm-env span::after{content:"";position:absolute;top:0;left:0;right:0;height:56%;
  background:#F0E2C8;clip-path:polygon(0 0,100% 0,50% 100%);}
.vtm-env span:nth-child(2){transform:translateY(3px);}
.vtm-rol i{display:block;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px #E8B44A;
  background:conic-gradient(#E32B6D 0 60deg,#6E1030 60deg 120deg,#E32B6D 120deg 180deg,#6E1030 180deg 240deg,#E32B6D 240deg 300deg,#6E1030 300deg 360deg);}
.vtm-qr{width:38px;height:38px;background:
  repeating-linear-gradient(90deg,#fff 0 4px,#160B12 4px 8px),
  repeating-linear-gradient(0deg,#fff 0 4px,#160B12 4px 8px);
  background-blend-mode:difference;border:3px solid #fff;border-radius:3px;}
.vtm-md{display:flex;align-items:flex-end;justify-content:center;gap:3px;}
.vtm-md img{display:block;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));}
.vtm-md img:nth-child(1){height:15px;}
.vtm-md img:nth-child(2){height:26px;}
.vtm-md img:nth-child(3){height:38px;filter:drop-shadow(0 0 9px rgba(255,127,171,.8));}

/* destaque do plano vitalício */
.pk-dur-vit{position:relative;border-color:var(--rose)!important;
  box-shadow:0 10px 30px rgba(227,43,109,.18);}
.pk-benef{display:flex;align-items:flex-start;gap:.4rem;margin-top:.7rem;padding-top:.7rem;
  border-top:1px dashed var(--line);font-size:.75rem;color:var(--rose-deep);font-weight:600;text-align:left;}
.pk-benef svg{width:13px;height:13px;flex:none;margin-top:.15rem;stroke:var(--rose);}
.up-nota{display:flex;gap:.7rem;align-items:flex-start;margin-top:1rem;padding:.9rem 1rem;
  background:var(--rose-soft);border-radius:16px;font-size:.8rem;line-height:1.55;color:var(--rose-deep);}
.up-nota svg{width:16px;height:16px;flex:none;fill:var(--rose);margin-top:.15rem;}

/* ---------- CARTAS DOS SENTIMENTOS (cartão de capa + tela cheia) ---------- */
.aq-anim{animation:aqIn .65s var(--ease) both;animation-delay:var(--aqd,0s);}
@keyframes aqIn{from{opacity:0;transform:translateY(18px) rotate(-1deg);}to{opacity:1;transform:none;}}

/* cartão de capa, na página normal */
.aq-capa{position:relative;display:flex;align-items:center;gap:1rem;width:100%;border:none;cursor:pointer;
  text-align:left;overflow:hidden;border-radius:20px;padding:1.3rem 1.2rem;
  background:linear-gradient(120deg,#4A0E22,#7A1830 55%,#4A0E22);
  box-shadow:0 16px 34px rgba(74,14,34,.4);}
.aq-capa-selo{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#F6D57A,#C79A26);box-shadow:0 4px 10px rgba(0,0,0,.35);}
.aq-capa-selo svg{width:22px;height:22px;fill:#fff;}
.aq-capa-tx{flex:1;display:flex;flex-direction:column;gap:.15rem;}
.aq-capa-k{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#E8B44A;font-weight:800;}
.aq-capa-t{font-family:'Fraunces';font-weight:700;font-size:1.18rem;color:#fff;}
.aq-capa-s{font-size:.74rem;color:#D9AFC0;}
.aq-capa-seta{flex:none;font-size:1.6rem;color:#E8B44A;opacity:.85;}
.aq-capa::after{content:"";position:absolute;top:-50%;left:-70%;width:45%;height:220%;pointer-events:none;
  background:linear-gradient(75deg,transparent 42%,rgba(255,255,255,.28) 50%,transparent 58%);
  animation:aqShine 5.5s ease-in-out infinite;}

/* tela cheia */
.aq-tela{position:fixed;inset:0;z-index:180;background:#3A0A18;
  background-image:radial-gradient(ellipse at 50% 0%,#6E1230,transparent 62%);
  opacity:0;pointer-events:none;transition:opacity .38s ease;overflow-y:auto;}
.aq-tela.on{opacity:1;pointer-events:auto;}
.aq-tela-in{position:relative;max-width:34rem;margin:0 auto;padding:3.4rem 1.3rem 3rem;min-height:100%;}
.aq-fechar-tela{position:absolute;top:1.1rem;right:1.1rem;background:rgba(255,255,255,.1);border:none;
  width:36px;height:36px;border-radius:50%;color:#fff;font-size:1.4rem;line-height:1;cursor:pointer;z-index:5;}
.aq-view{display:none;}
.aq-view.on{display:block;}
.aq-tela-h{text-align:center;}
.aq-tela-h .k{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-1);font-weight:800;}
.aq-tela-h p{color:#D9AFC0;font-size:.86rem;margin-top:.5rem;}
.aq-titulo{font-family:'Fraunces';font-weight:800;letter-spacing:.02em;font-size:clamp(1.8rem,8vw,2.4rem);margin-top:.3rem;
  background:linear-gradient(90deg,#F6E3B8,#E8B44A,#FFF3D0,#E8B44A,#F6E3B8);background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:aqGlow 4.5s linear infinite;text-transform:uppercase;}
@keyframes aqGlow{0%{background-position:0% 50%;}100%{background-position:280% 50%;}}
.aq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-top:1.7rem;}
.aq-env{position:relative;display:block;width:100%;aspect-ratio:1.5;border:none;cursor:pointer;overflow:hidden;
  background:linear-gradient(160deg,#FBF3E4,#EFE2CC);border-radius:6px;padding:0;
  box-shadow:0 12px 26px rgba(0,0,0,.42);transition:transform .3s var(--ease),box-shadow .3s var(--ease);}
.aq-env:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 18px 34px rgba(0,0,0,.5);}
.aq-env::before,.aq-env::after{content:"";position:absolute;top:0;width:52%;height:74%;
  border-top:1px solid rgba(180,120,90,.42);pointer-events:none;}
.aq-env::before{left:0;transform-origin:top left;transform:skewY(31deg);}
.aq-env::after{right:0;transform-origin:top right;transform:skewY(-31deg);}
.aq-flap{position:absolute;top:0;left:0;right:0;height:56%;
  background:linear-gradient(170deg,#F7EEDC,#E6D6BC);
  clip-path:polygon(0 0,100% 0,50% 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.14);transform-origin:top center;
  transition:transform .55s var(--ease);z-index:2;}
.aq-env.aberta .aq-flap{transform:rotateX(-172deg);}
.aq-selo{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 -2px 4px rgba(0,0,0,.25);
  transition:opacity .4s ease,transform .4s ease;}
.aq-selo svg{width:15px;height:15px;fill:rgba(255,255,255,.9);}
.aq-selo-ouro{background:radial-gradient(circle at 35% 30%,#F6D57A,#C79A26);}
.aq-selo-cobre{background:radial-gradient(circle at 35% 30%,#E8935A,#B05A22);}
.aq-selo-vinho{background:radial-gradient(circle at 35% 30%,#A82D45,#6E1230);}
.aq-env.aberta .aq-selo{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(20deg);}
.aq-num{position:absolute;left:8px;bottom:7px;font-size:.55rem;letter-spacing:.14em;color:#A8917A;z-index:4;}
.aq-tit{position:absolute;left:0;right:0;bottom:12px;padding:0 .7rem;z-index:4;
  font-family:'Grand Hotel',cursive;font-size:.95rem;color:#4A2A18;line-height:1.15;text-align:center;}
.aq-brilho{position:absolute;top:-40%;left:-70%;width:55%;height:190%;pointer-events:none;z-index:5;
  background:linear-gradient(75deg,transparent 42%,rgba(255,255,255,.72) 50%,transparent 58%);
  animation:aqShine 5.2s ease-in-out infinite;}
.aq-env:nth-child(even) .aq-brilho{animation-delay:1.3s;}
.aq-env:nth-child(3n) .aq-brilho{animation-delay:2.6s;}
@keyframes aqShine{0%,66%{transform:translateX(-10%);opacity:0;}74%{opacity:1;}100%{transform:translateX(250%);opacity:0;}}
.aq-prog{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-top:1.8rem;
  font-family:'Fraunces';font-style:italic;font-size:.82rem;color:#E8C89A;}
.aq-dots{display:flex;gap:.28rem;}
.aq-dots i{width:6px;height:6px;border-radius:50%;background:rgba(232,180,74,.28);transition:background .35s;}
.aq-dots i.on{background:#E8B44A;}

.aq-voltar{background:none;border:none;color:#E8C89A;font-size:.82rem;font-weight:700;cursor:pointer;
  padding:0;margin-bottom:1.3rem;}
.aq-carta{background:linear-gradient(170deg,#FFFCF8,#F6EAD8);border-radius:16px;padding:2rem 1.5rem 1.6rem;
  max-width:23rem;width:100%;margin:0 auto;position:relative;color:#3B2C31;
  box-shadow:0 26px 60px rgba(0,0,0,.5);}
.aq-c-eb{font-family:'Fraunces';font-weight:700;font-size:.72rem;letter-spacing:.13em;
  text-transform:uppercase;color:#B5124E;margin-bottom:1rem;}
.aq-c-para{font-family:'Grand Hotel',cursive;font-size:1.6rem;color:var(--rose-deep);margin-bottom:.7rem;}
.aq-c-tx{font-family:'Fraunces';font-size:.94rem;line-height:1.85;white-space:pre-wrap;}
.aq-c-sig{margin-top:1.4rem;text-align:right;}
.aq-c-sig span{display:block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#9A8A90;font-weight:700;}
.aq-c-sig b{font-family:'Grand Hotel',cursive;font-size:1.4rem;color:var(--rose-deep);font-weight:400;}

/* ---------- CONVITE CRIATIVO ---------- */
.cv-scope{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;z-index:5;}
.cv-body{max-width:32rem;margin:0 auto;padding:2.4rem 1.3rem 3rem;}
.cv-anim{animation:cvIn .7s var(--ease) both;animation-delay:var(--cvd,0s);}
@keyframes cvIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.cv-hero{text-align:center;}
.cv-ilus{width:150px;margin:0 auto 1.1rem;filter:drop-shadow(0 14px 26px rgba(0,0,0,.35));}
.cv-nome{font-family:'Fraunces';font-weight:800;font-size:clamp(2rem,10vw,2.8rem);line-height:1;}
.cv-idade{font-family:'Fraunces';font-style:italic;font-size:1.2rem;margin-top:.4rem;opacity:.92;}
.cv-conv{font-size:.9rem;line-height:1.6;max-width:22rem;margin:1rem auto 0;opacity:.92;}
.cv-quando{display:flex;gap:.7rem;justify-content:center;margin-top:1.6rem;flex-wrap:wrap;}
.cv-qi{background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:16px;padding:.8rem 1.3rem;text-align:center;min-width:8rem;}
.cv-ql{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;}
.cv-qd{font-family:'Fraunces';font-weight:700;font-size:1.02rem;margin-top:.2rem;}
.cv-btns{display:flex;flex-direction:column;gap:.7rem;margin-top:1.8rem;}
.cv-btn{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.1rem;border-radius:100px;
  font-weight:700;font-size:.88rem;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.22);}
.cv-bic{width:20px;height:20px;flex:none;display:inline-flex;}
.cv-bic svg{width:100%;height:100%;}
.cv-presentes{margin-top:2.2rem;background:rgba(255,255,255,.94);border-radius:22px;padding:1.5rem 1.3rem;}
.cv-presentes h2{font-family:'Fraunces';font-size:1.15rem;color:#2A1620;text-align:center;margin-bottom:1rem;}
.cv-pres-i{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-bottom:1px solid #F1E4E8;color:#3B2C31;font-size:.88rem;}
.cv-pres-i:last-child{border-bottom:none;}
.cv-pres-ic{font-size:1.2rem;flex:none;}

.cv-aranha{background:radial-gradient(ellipse at 50% 0%,#1E3A8A,#050A1A 75%);color:#fff;}
.cv-aranha .cv-btn{background:#E32B6D;color:#fff;}
.cv-aranha .cv-bic svg{fill:#fff;stroke:#fff;}

.cv-savana{background:linear-gradient(180deg,#FBAE4B,#7A3B12 85%);color:#fff;}
.cv-savana .cv-btn{background:#8B4A1E;color:#fff;}
.cv-savana .cv-bic svg{fill:#fff;stroke:#fff;}

.cv-fashion{background:radial-gradient(ellipse at 50% 0%,#FF9FCB,#7A1F52 85%);color:#fff;}
.cv-fashion .cv-btn{background:#fff;color:#B5124E;}
.cv-fashion .cv-bic svg{fill:#B5124E;stroke:#B5124E;}

.pk-tema{overflow:hidden;position:relative;}
.tema-ic{font-size:1.8rem;display:block;margin-bottom:.4rem;}
.tema-aranha.on{border-color:#2C4EA0;background:#EEF2FF;}
.tema-savana.on{border-color:#C97A2E;background:#FFF4E6;}
.tema-fashion.on{border-color:#E85CA0;background:#FFEEF6;}

.pres-i{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;}
.pres-ic{font-size:1.3rem;flex:none;}
.pres-txt{flex:1;}
.pres-emojis{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
.pres-emo{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:1.2rem;cursor:pointer;}

.cv-pdf-btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.3rem;padding:.55rem 1.1rem;
  border-radius:100px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);
  color:inherit;font-size:.76rem;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);}
.cv-pdf-btn svg{width:14px;height:14px;}

@media print{
  .no-print, .prev-bar, .wz-scope, header, .hsparks, .sparks{display:none!important;}
  body, .cv-scope{background:#fff!important;overflow:visible!important;position:static!important;height:auto!important;}
  .cv-scope, .cv-scope *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
  .cv-scope .rv{opacity:1!important;transform:none!important;}
  .cv-body{max-width:100%;padding:.6cm;}
  .cv-btn{box-shadow:none!important;}
  @page{margin:0.6cm;}
}

/* mockups desenhados */
.mk-ph{width:96px;background:#111;border-radius:14px;padding:5px;box-shadow:0 14px 30px rgba(0,0,0,.35);}
.mk-ph.mk-a{transform:rotate(-4deg) translateY(6px);}
.mk-ph.mk-b{transform:rotate(5deg);}
.mk-ph.mk-solo{width:118px;transform:rotate(-2deg);}
.mk-scr{background:#FFF7F9;border-radius:10px;height:150px;overflow:hidden;padding:8px;position:relative;}
.mk-ph.mk-dark .mk-scr{background:#160B12;}
.mk-hero{display:flex;flex-direction:column;align-items:center;gap:5px;}
.mk-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(45deg,#FA7E1E,#E32B6D,#833AB4);}
.mk-nm{font-family:'Grand Hotel',cursive;font-size:.85rem;color:var(--rose-1);white-space:nowrap;}
.mk-ct{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;margin-top:3px;}

.mk-grid{grid-template-columns:1fr 1fr;}
.mk-pol{background:#fff;padding:3px 3px 8px;transform:rotate(var(--r,0deg));box-shadow:0 3px 8px rgba(0,0,0,.16);}
.mk-pol i{display:block;height:38px;background:linear-gradient(150deg,#5A2740,#2C3E50);}
.mk-pol b{display:block;height:4px;width:70%;margin:4px auto 0;border-radius:3px;background:#e5d8dd;}
.mk-carta{background:linear-gradient(170deg,#FFFCF8,#FDF2E9);border-radius:6px;height:100%;padding:9px;position:relative;}
.mk-foto{position:absolute;top:7px;right:7px;width:26px;height:30px;background:#fff;padding:2px;

.mk-l{height:4px;border-radius:3px;background:#d8c8bd;margin-bottom:5px;}
.mk-l.l1{width:44%;background:#B5124E;height:6px;margin-top:24px;}
.mk-l.l2{width:80%;} .mk-l.l3{width:72%;} .mk-l.l4{width:60%;}
.mk-sig{width:38px;height:7px;border-radius:3px;background:#B5124E;margin:14px 0 0 auto;}
.mk-lacre{position:absolute;bottom:8px;right:9px;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#C0392B,#8B1A12);}
.mk-livro{display:flex;position:relative;width:150px;border-radius:5px;overflow:hidden;
  box-shadow:0 16px 34px rgba(0,0,0,.4);transform:rotate(-2deg);}
.mk-lp{width:50%;height:140px;padding:10px;}
.mk-lp-e{background:#F3E9D6;} .mk-lp-d{background:#FBF4E8;}
.mk-lomb{position:absolute;left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.06),rgba(0,0,0,.28));}

/* --- NÚMEROS GIGANTES EM FAIXAS (apresentação) --- */

.marq-cap b{color:#FF9EC2;}

/* --- NOSSA JORNADA --- */
.jorn{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1.6rem .9rem;padding-top:1.2rem;}
.jorn-i{position:relative;padding-top:14px;opacity:0;transform:translateY(16px) rotate(var(--r,-2deg));
  transition:opacity .6s var(--ease) var(--d,0s), transform .6s var(--ease) var(--d,0s);}
.jorn-i:nth-child(even){--r:2deg;}
.jorn-i.in{opacity:1;transform:translateY(0) rotate(var(--r,-2deg));}
.jorn-clip{position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:16px;
  background:linear-gradient(180deg,#F6E3C0,#D8BE92);border-radius:3px;z-index:2;
  box-shadow:0 2px 5px rgba(0,0,0,.35);}
.jorn-pol{background:#fff;padding:8px 8px 12px;box-shadow:0 12px 26px rgba(0,0,0,.4);}
.jorn-pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.jorn-dt{text-align:center;font-weight:700;color:#2A0715;font-size:.78rem;margin-top:.5rem;}
.jorn-cap{text-align:center;font-family:'Fraunces';font-style:italic;color:#8a5468;font-size:.68rem;margin-top:.1rem;}
.jorn-fim{text-align:center;color:var(--rose-1);font-family:'Fraunces';font-style:italic;
  font-size:.9rem;margin-top:1.8rem;display:flex;align-items:center;justify-content:center;gap:.5rem;}
.jorn-fim svg{width:13px;height:13px;fill:var(--rose);}

/* --- CABINE DE FOTOS --- */
.cab-wrap{display:flex;justify-content:center;padding-top:.6rem;}
.cab-tira{background:#FBF4E8;padding:12px 12px 6px;box-shadow:0 18px 40px rgba(0,0,0,.5);
  transform:rotate(-2deg);width:min(210px,62vw);opacity:0;transition:opacity .7s var(--ease);}
.cab-tira.in{opacity:1;}
.cab-f{margin-bottom:8px;}
.cab-f img{width:100%;aspect-ratio:1.15;object-fit:cover;display:block;}
.cab-lb{text-align:center;font-size:.62rem;letter-spacing:.3em;color:#8a5468;padding:.3rem 0 .5rem;}

/* --- CARTA (melhorias) --- */
.letter-foto{position:absolute;top:14px;right:14px;width:74px;background:#fff;padding:5px 5px 14px;
  transform:rotate(5deg);box-shadow:0 8px 18px rgba(0,0,0,.22);z-index:3;}
.letter-foto img{width:100%;aspect-ratio:.85;object-fit:cover;display:block;}
.letter-foto .tp{position:absolute;width:34px;height:13px;background:rgba(226,214,190,.85);
  box-shadow:0 1px 3px rgba(0,0,0,.12);}
.letter-foto .tp1{top:-6px;left:-8px;transform:rotate(-38deg);}
.letter-foto .tp2{bottom:2px;right:-10px;transform:rotate(-38deg);}
.letter-local{font-family:'Fraunces';font-style:italic;color:#8a7a6a;font-size:.78rem;
  line-height:1.5;margin-bottom:1.3rem;padding-right:92px;}
.letter-risco{width:120px;height:1px;background:#b9a894;margin:.5rem 0 0 auto;}
.letter-lacre{position:absolute;bottom:16px;right:18px;width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#C0392B,#8B1A12);display:flex;align-items:center;
  justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.3);}
.letter-lacre svg{width:16px;height:16px;fill:rgba(255,255,255,.85);}

/* ---------- LIVRO INTERATIVO ---------- */
.lv-scope{position:fixed;inset:0;background:#1a1114;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:5;padding:1rem;}
.lv-hint{position:absolute;top:1.2rem;left:0;right:0;text-align:center;color:var(--gold);
  font-size:.72rem;letter-spacing:.08em;opacity:.85;transition:opacity .6s ease;pointer-events:none;}
.lv-livro{position:relative;width:min(420px,92vw);height:min(560px,72vh);display:flex;
  border-radius:6px;box-shadow:0 40px 90px rgba(0,0,0,.65);background:#2a1a14;perspective:2400px;}
.lv-lombada{position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;z-index:60;
  pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(0,0,0,.08) 30%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.4));}
.lv-col-esq{width:50%;height:100%;background:#F3E9D6;position:relative;overflow:hidden;border-radius:6px 0 0 6px;}
.lv-col-dir{width:50%;height:100%;position:relative;}
.lv-pag{position:absolute;inset:0;overflow:hidden;}
.lv-esq{position:relative;}
.lv-dir{background:#FBF4E8;border-radius:0 6px 6px 0;transform-origin:left center;
  transform-style:preserve-3d;backface-visibility:hidden;cursor:pointer;}
.lv-tex{position:absolute;inset:0;opacity:.05;background-image:
  repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;pointer-events:none;}
.lv-brilho{position:absolute;top:-40%;left:-60%;width:60%;height:180%;pointer-events:none;
  background:linear-gradient(75deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);
  animation:lvBrilho 6s ease-in-out infinite;}
@keyframes lvBrilho{0%,70%{transform:translateX(-20%);opacity:0;}78%{opacity:1;}100%{transform:translateX(260%);opacity:0;}}
.lv-amb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:1.6rem;font-family:'Fraunces';font-style:italic;color:#7A2340;
  font-size:.92rem;line-height:1.7;opacity:.85;}
.lv-conteudo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:1.2rem;}
.lv-k{color:var(--rose);font-size:.66rem;letter-spacing:.16em;font-weight:800;}
.lv-cap-cover{width:64%;aspect-ratio:1;border-radius:50%;overflow:hidden;margin-bottom:.9rem;
  border:3px solid #fff;box-shadow:0 10px 24px rgba(227,43,109,.35);display:flex;align-items:center;justify-content:center;
  background:var(--rose-soft);}
.lv-cap-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.lv-cap-cover svg{width:38%;height:38%;fill:var(--rose);}
.lv-cap-nomes{font-family:'Fraunces';font-style:italic;color:var(--rose-deep);font-size:clamp(1.15rem,5vw,1.5rem);line-height:1.2;}
.lv-cap-titulo{color:#7A2340;font-family:'Fraunces';font-style:italic;font-size:.8rem;margin-top:.5rem;opacity:.85;}
.lv-cap-dica{color:#B99BA8;font-size:.62rem;letter-spacing:.06em;margin-top:1.4rem;}
.lv-ctr{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;width:100%;margin-top:.7rem;}
.lv-cc{background:linear-gradient(135deg,var(--rose-deep),var(--rose));border-radius:8px;padding:.55rem .2rem;}
.lv-cc .n{color:#fff;font-size:1.05rem;font-weight:800;font-family:'Fraunces';}
.lv-cc .l{color:rgba(255,255,255,.85);font-size:.55rem;letter-spacing:.05em;margin-top:.1rem;}
.lv-foto-card{background:#fff;padding:.5rem .5rem 1.2rem;box-shadow:0 8px 20px rgba(0,0,0,.2);
  width:76%;transform:rotate(-1.5deg);}
.lv-foto-card img{width:100%;height:auto;aspect-ratio:.95;object-fit:cover;display:block;}
.lv-foto-card .cap{font-family:'Fraunces';font-style:italic;font-size:.72rem;text-align:center;
  margin-top:.45rem;color:#3A1424;}
.lv-foto-card .dt{font-size:.6rem;text-align:center;color:#B99BA8;margin-top:.15rem;}
.lv-rasp{position:relative;width:100%;max-width:150px;aspect-ratio:1;border-radius:12px;
  overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3);margin-top:.6rem;}
.lv-rasp-msg{position:absolute;inset:0;background:var(--rose-soft);display:flex;align-items:center;
  justify-content:center;padding:.7rem;text-align:center;font-family:'Fraunces';font-style:italic;
  color:var(--rose-deep);font-size:.72rem;line-height:1.4;}
.lv-rasp-cv{position:absolute;inset:0;width:100%;height:100%;}
.lv-final-de{color:#7A2340;font-size:.82rem;opacity:.85;}
.lv-final-nome{font-family:'Fraunces';font-style:italic;color:var(--rose-deep);font-size:1.6rem;margin-top:.4rem;}
.lv-final-cor{margin-top:1.1rem;color:var(--rose);}
.lv-final-cor svg{width:22px;height:22px;fill:var(--rose);}
.lv-dots{display:flex;gap:.35rem;margin-top:1.1rem;}
.lv-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .3s;}
.lv-dots i.on{background:var(--rose);}
.lv-nav{display:flex;gap:.6rem;margin-top:.9rem;}
.lv-nav button{width:40px;height:40px;border-radius:50%;border:none;font-size:1.1rem;cursor:pointer;
  background:rgba(255,255,255,.1);color:#fff;}
.lv-nav button:last-child{background:var(--rose);}

</style>

var MEM = {};
var Store = {
  ok:(function(){ try{ var k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })(),
  get:function(k){ try{ return this.ok ? localStorage.getItem(k) : (MEM[k]||null); }catch(e){ return MEM[k]||null; } },
  set:function(k,v){ try{ if(this.ok) localStorage.setItem(k,v); else MEM[k]=v; return true; }
                     catch(e){ MEM[k]=v; return false; } },
  del:function(k){ try{ if(this.ok) localStorage.removeItem(k); }catch(e){} delete MEM[k]; }
};
function jget(k,d){ try{ var v=Store.get(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function jset(k,v){ return Store.set(k,JSON.stringify(v)); }

function presentes(){ return jget('cl_presentes',{}); }
function salvarPresente(p){
  var all=presentes(); all[p.id]=p;
  var ok=jset('cl_presentes',all);
  if(!ok){
    var idsAntigoPrimeiro=Object.keys(all).sort(function(a,b){ return (all[a].criadoEm||0)-(all[b].criadoEm||0); });
    while(!ok && idsAntigoPrimeiro.length>1){
      var maisAntigo=idsAntigoPrimeiro.shift();
      delete all[maisAntigo];
      ok=jset('cl_presentes',all);
    }
  }
  if(!ok) toast("Espaço cheio no navegador. Apague um presente antigo em “Meus presentes”.");
  return ok;
}

function copiar(txt,msg){
  var done=function(){ toast(msg||"Copiado!"); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=txt;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast("Copie manualmente."); }
    document.body.removeChild(ta);
  }
}

var MESES_C=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function nnum(n){ return Number(n).toLocaleString('pt-BR'); }
function soDigitos(s){ return String(s||'').replace(/\D/g,''); }
function fmtCpf(v){
  var d=soDigitos(v).slice(0,11);
  if(d.length>9) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  if(d.length>6) return d.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  if(d.length>3) return d.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  return d;
}
function cpfValido(cpf){
  cpf=soDigitos(cpf);
  if(cpf.length!==11 || /^(\d)\1{10}$/.test(cpf)) return false;
  var soma=0,resto,i;
  for(i=1;i<=9;i++) soma+=parseInt(cpf.charAt(i-1),10)*(11-i);
  resto=(soma*10)%11; if(resto===10||resto===11) resto=0;

/* ---------- compressão de imagem (essencial pro navegador aguentar) ---------- */
function comprimir(file, maxLado, q){
  maxLado = maxLado||1280; q = q||0.78;
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('leitura')); };
    fr.onload=function(e){
      var img=new Image();
      img.onerror=function(){ rej(new Error('imagem')); };
      img.onload=function(){
        var w=img.width,h=img.height,r=Math.min(1,maxLado/Math.max(w,h));
        var cw=Math.round(w*r), ch=Math.round(h*r);
        var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
        var cx=cv.getContext('2d');
        cx.fillStyle='#fff'; cx.fillRect(0,0,cw,ch);
        cx.drawImage(img,0,0,cw,ch);
        res(cv.toDataURL('image/jpeg',q));
      };
      img.src=e.target.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- lê a data em que a foto foi tirada (metadado EXIF) ---------- */
function dataExif(file){
  return new Promise(function(res){
    if(file.type!=='image/jpeg'){ res(null); return; }
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var view=new DataView(e.target.result);
        if(view.getUint16(0,false)!==0xFFD8){ res(null); return; }
        var offset=2, length=view.byteLength;
        while(offset<length-4){
          if(view.getUint16(offset,false)===0xFFE1){
            var tiffOffset=offset+10;
            var little=view.getUint16(tiffOffset,false)===0x4949;
            var dirOffset=tiffOffset+view.getUint32(tiffOffset+4,little);
            var entries=view.getUint16(dirOffset,little);
            for(var i=0;i<entries;i++){
              var entryOffset=dirOffset+2+i*12;
              if(view.getUint16(entryOffset,little)===0x8769){
                var exifIFD=tiffOffset+view.getUint32(entryOffset+8,little);
                var subEntries=view.getUint16(exifIFD,little);
                for(var j=0;j<subEntries;j++){
                  var subOffset=exifIFD+2+j*12;
                  var subTag=view.getUint16(subOffset,little);
                  if(subTag===0x9003||subTag===0x9004){
                    var strOffset=tiffOffset+view.getUint32(subOffset+8,little);
                    var str='';
                    for(var k=0;k<19;k++){ var c=view.getUint8(strOffset+k); if(!c) break; str+=String.fromCharCode(c); }
                    var m=/^(\d{4}):(\d{2}):(\d{2})/.exec(str);
                    res(m?(m[1]+'-'+m[2]+'-'+m[3]):null); return;
                  }
                }
              }
            }
            res(null); return;
          } else {
            offset += 2 + view.getUint16(offset+2,false);
          }
        }
        res(null);
      }catch(err){ res(null); }
    };
    fr.onerror=function(){ res(null); };
    fr.readAsArrayBuffer(file.slice(0,131072));
  });
}

      return s;
    }

    var best=null, bestScore=Infinity, bestMask=0;
    for(var mk=0; mk<8; mk++){
      var cand=[];
      for(i=0;i<size;i++) cand.push(m[i].slice());
      for(i=0;i<size;i++) for(j=0;j<size;j++){
        if(!res[i][j] && maskFn(mk,i,j)) cand[i][j] ^= 1;
      }
      applyFormat(cand, ec, mk);
      var sc = penalty(cand);
      if(sc<bestScore){ bestScore=sc; best=cand; bestMask=mk; }
    }
    return {matrix:best, size:size, version:ver, ec:ec, mask:bestMask};
  }

  function toSVG(text, opts){
    opts = opts || {};
    var q = build(text, opts.ec||'M');
    var quiet = opts.quiet===undefined?2:opts.quiet;
    var n = q.size + quiet*2;
    var dark = opts.dark||'#161113', light = opts.light||'#ffffff';
    var path = '';
    for(var r=0;r<q.size;r++){
      var c=0;
      while(c<q.size){
        if(q.matrix[r][c]){
          var st=c; while(c<q.size && q.matrix[r][c]) c++;
          path += 'M'+(st+quiet)+' '+(r+quiet)+'h'+(c-st)+'v1h'+(-(c-st))+'z';
        } else c++;
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges">'+
      '<rect width="'+n+'" height="'+n+'" fill="'+light+'"/><path d="'+path+'" fill="'+dark+'"/></svg>';
  }
  return {build:build, toSVG:toSVG};
})();

/* ---------- payload Pix (BR Code EMV) ---------- */
function pixPayload(valor, txid){
  function f(id,v){ var s=String(v); return id + ('00'+s.length).slice(-2) + s; }
  var gui=f('00','BR.GOV.BCB.PIX'), key=f('01',CONFIG.pixChave);
  var mai=f('26', gui+key);
  var nome=CONFIG.pixNome.substring(0,25), cid=CONFIG.pixCidade.substring(0,15);
  var body = f('00','01') + mai + f('52','0000') + f('53','986') +
             f('54', valor.toFixed(2)) + f('58','BR') + f('59',nome) + f('60',cid) +
             f('62', f('05',(txid||'***').substring(0,25)));
  var s = body + '6304';
  var crc=0xFFFF;
  for(var i=0;i<s.length;i++){
    crc ^= (s.charCodeAt(i)<<8);
    for(var j=0;j<8;j++) crc = (crc & 0x8000) ? ((crc<<1)^0x1021)&0xFFFF : (crc<<1)&0xFFFF;
  }
  return s + ('000'+crc.toString(16).toUpperCase()).slice(-4);
}

/* ---------- revelar ao rolar ---------- */
var _io;
function observarReveal(root){
  if(!('IntersectionObserver' in window)){
    (root||document).querySelectorAll('.rv,.tl-i').forEach(function(e){ e.classList.add('in'); });
    return;
  }
  if(_io) _io.disconnect();
  _io=new IntersectionObserver(function(en){
    en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add('in'); _io.unobserve(x.target); } });
  },{threshold:.14, rootMargin:'0px 0px -8% 0px'});
  (root||document).querySelectorAll('.rv,.tl-i').forEach(function(e){ _io.observe(e); });
}

function abrirPreviaEtapa(tipo){
  limpar();
  var g=JSON.parse(JSON.stringify(W));
  g.meuNome=g.meuNome||'Você'; g.parceiroNome=g.parceiroNome||'quem você ama';
  var fotos=(g.fotos||[]).filter(Boolean);
  var corpo='';
  var titulo='';

  if(tipo==='tudo'){
    titulo='Prévia completa';
    var r=RECURSOS[g.produto]||RECURSOS.completo;
    corpo=htmlSecaoCarta(g, fotos) + (g.carta?htmlSecaoAbraQuando(g):'') + htmlSecoesFotos(g, fotos);
    if(r.jogos && g.jogos && Object.keys(g.jogos).some(function(x){ return g.jogos[x]; })){
      corpo+='<div class="prev-jogos-nota">'+IC.gift+' Os jogos escolhidos ('+
        Object.keys(g.jogos).filter(function(x){ return g.jogos[x]; }).map(function(x){
          return {roleta:'Roleta',palavra:'Caça-palavras',caca:'Caça ao tesouro',quebra:'Quebra-cabeça',quiz:'Quiz'}[x]||x;
        }).join(', ')+') aparecem no presente de verdade, com a animação de girar/jogar — aqui na prévia eles ficam só listados.</div>';
    }
    if(!corpo) corpo='<div class="prev-vazio">Ainda não tem conteúdo suficiente pra mostrar. Volta e preenche fotos ou a carta.</div>';
  } else if(tipo==='carta'){
    titulo='Prévia da carta';
    if(!g.carta || !g.carta.trim()){
      corpo='<div class="prev-vazio">Escreve a carta primeiro — assim que tiver algum texto, a prévia aparece aqui.</div>';
    } else {
      corpo=htmlSecaoCarta(g, fotos) + htmlSecaoAbraQuando(g);
    }
  } else if(tipo==='fotos'){
    titulo='Prévia das fotos';
    if(fotos.length<2){
      corpo='<div class="prev-vazio">Adiciona pelo menos 2 fotos pra ver a linha do tempo e a cabine de fotos aqui.</div>';
    } else {
      corpo=htmlSecoesFotos(g, fotos);
    }
  }

  var sc=el('gScope');
  if(!sc){
    sc=document.createElement('div');
    sc.id='gScope'; sc.className='g-scope';
    document.body.appendChild(sc);
  }
  sc.style.display='';
  document.body.style.overflow='hidden';
  sc.innerHTML='<div class="g-body prev-etapa">'+corpo+'</div>';

  if(tipo==='carta' && g.carta && g.carta.trim()){
    for(var pk=0;pk<14;pk++){
      var pt=document.createElement('span'); pt.className='petal';
      pt.style.cssText='left:'+(Math.random()*100)+'%;width:'+(9+Math.random()*9)+'px;'+
        'animation-duration:'+(7+Math.random()*7)+'s;animation-delay:'+(Math.random()*8)+'s;';
      pt.innerHTML=IC.heart; var petBox=el('petals'); if(petBox) petBox.appendChild(pt);
    }
    var ltx=el('letterTx'); if(ltx) ltx.textContent=g.carta;
    ligarAbraQuando(g);
  }
  if(tipo==='completa' && g.carta && g.carta.trim()) ligarAbraQuando(g);
  observarReveal(sc);

  var barra=document.createElement('div');
  barra.className='prev-bar';
  barra.innerHTML='<span>'+IC.eye+titulo+'</span>'+
    '<button id="prevFechar">Voltar a editar</button>';
  sc.appendChild(barra);
  el('prevFechar').onclick=function(){
    limpar();
    sc.innerHTML=''; sc.style.display='none';
    document.body.style.overflow='';
  };
}

function desenharPasso(opts){
  opts=opts||{};
  var preservarScroll=!!opts.preservarScroll;
  var repetirGuia=opts.repetirGuia!==false;
  var scrollAntes=preservarScroll ? window.scrollY : 0;
  var ps=passos();
  if(wStep>=ps.length) wStep=ps.length-1;
  var k=ps[wStep];
  el('wzCount').textContent=(wStep+1)+'/'+ps.length;
  el('wzFill').style.width=((wStep+1)/ps.length*100)+'%';
  el('wzBody').innerHTML=htmlPasso(k);
  el('wzNext').textContent = (k==='checkout') ? 'Pagar e gerar o link' : 'Continuar';
  var sk=el('wzSkip'); sk.style.display='none';
  if(k==='jogos'){ sk.style.display=''; sk.textContent='Pular os jogos'; sk.onclick=function(){ proximoPasso(true); }; }
  if(k==='musica'){ sk.style.display=''; sk.textContent='Seguir sem música'; sk.onclick=function(){ proximoPasso(true); }; }
  ligarPasso(k);
  var pv=el('wzPrev');
  var mostraFotos = k==='fotos' && W.produto!=='carta';
  var passosConvitePrevia=['aniversariante','quando','local','whatsapp','presentes'];
  var mostraConvite = W.produto==='convite' && passosConvitePrevia.indexOf(k)!==-1;
  if(mostraFotos || k==='carta' || mostraConvite){
    pv.style.display='';
    pv.innerHTML=IC.eye+(k==='carta' ? 'Ver prévia da carta' : (mostraConvite ? 'Ver prévia do convite' : 'Ver prévia das fotos'));
    pv.onclick=function(){ mostraConvite ? abrirPreviaCompleta() : abrirPreviaEtapa(k); };
  } else {
    pv.style.display='none';
  }
  if(repetirGuia){
    digitarGuia();
  } else {
    clearInterval(_guiaT);
    var gb=el('guideB'); if(gb) gb.textContent=_guia;
  }
  if(preservarScroll){
    requestAnimationFrame(function(){ window.scrollTo(0,scrollAntes); });
  } else {
    window.scrollTo(0,0);
  }
}

function redesenharSemPular(){
  desenharPasso({preservarScroll:true,repetirGuia:false});
}

var _guia='', _guiaT;
function guia(t){
  _guia=t;
  return '<div class="guide"><div class="guide-m"><img src="'+MASCOTE+'" alt=""></div>'+
         '<div class="guide-b" id="guideB"><span class="cur"></span></div></div>';
}
function digitarGuia(){
  clearInterval(_guiaT);
  var e=el('guideB'); if(!e) return;
  var t=_guia,i=0; e.innerHTML='<span class="cur"></span>';
  _guiaT=setInterval(function(){
    i++; e.innerHTML=esc(t.slice(0,i))+'<span class="cur"></span>';
    if(i>=t.length) clearInterval(_guiaT);
  },16);
}

  case 'checkout': {
    var p=PACOTES[W.produto];
    var linhas='<div class="sum-r"><span>Presente</span><span>'+p.nome+'</span></div>'+
      '<div class="sum-r"><span>Duração do link</span><span>'+DURACOES[W.duracao||'vitalicio'].nome+'</span></div>';
    var nf=W.fotos.filter(Boolean).length;

      linhas+='<div class="sum-r"><span>Trilha sonora</span><span>Incluída</span></div>';
    linhas+='<div class="sum-r tot"><span>Total</span><span>R$ '+fmtPreco(precoDe(W.produto,W.duracao))+'</span></div>';
    return guia("Última etapa! O código Pix aparece aqui mesmo, sem sair da página.")+
      '<div class="wz-t">Finalizar</div>'+
      '<div class="sum">'+linhas+'</div>'+
      '<div id="checkoutForm">'+
      '<div class="demo-note info">'+IC.shield+
        '<div><b>Pix gerado na hora, aqui mesmo.</b> Assim que cair o pagamento, seu link é liberado sozinho.</div></div>'+
      '<button type="button" class="cupom-toggle" id="cupomToggle">Tem um cupom?</button>'+
      '<div class="cupom-box" id="cupomBox" style="display:none">'+
        '<input class="inp" id="cupomInp" placeholder="Código do cupom" maxlength="14" autocapitalize="characters">'+
        '<button class="cupom-ap" id="cupomAp">Aplicar</button>'+

      '<div id="pagErro" style="display:none" class="demo-note"></div>'+
      '</div>'+

function cfgJogo(k){

        return '<div class="row-inp"><input class="inp" data-rol="'+i+'" value="'+esc(o)+'" placeholder="Opção '+(i+1)+'" maxlength="26">'+
          (W.roletaOpcoes.length>2?'<button class="row-x" data-rolx="'+i+'">×</button>':'')+'</div>';

    return '<div class="cfg"><div class="lb">A pergunta</div>'+

      '<div class="lb">A palavra secreta</div>'+
      '<input class="inp" id="pwA" value="'+esc(W.palavraSecreta)+'" placeholder="Ex: sorriso" maxlength="18">'+
      '<div class="hint" style="margin-top:.5rem">Uma palavra só, sem acento se puder. Ela aparece em quadradinhos pra adivinhar.</div></div>';
  }
  if(k==='caca'){
    return '<div class="cfg"><div class="lb">Palavras escondidas</div>'+
      W.cacaPalavras.map(function(o,i){
        return '<div class="row-inp"><input class="inp" data-cc="'+i+'" value="'+esc(o)+'" placeholder="Palavra '+(i+1)+'" maxlength="10">'+
          (W.cacaPalavras.length>2?'<button class="row-x" data-ccx="'+i+'">×</button>':'')+'</div>';
      }).join('')+
      (W.cacaPalavras.length<8?'<button class="add-row" id="ccAdd">'+IC.plus+'Adicionar palavra</button>':'')+
      '<div class="hint" style="margin-top:.5rem">Até 8 palavras, no máximo 10 letras cada. Sem espaço e sem acento.</div></div>';

  if(k==='quebra'){
    var fs=W.fotos.filter(Boolean);

    return '<div class="cfg"><div class="lb">Qual foto vira quebra-cabeça</div>'+
      '<div style="display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem">'+
      fs.map(function(f,i){
        return '<button data-qf="'+i+'" style="width:60px;height:60px;border-radius:10px;overflow:hidden;flex-shrink:0;border:2.5px solid '+(W.quebraFoto===i?'var(--rose)':'transparent')+'"><img src="'+f.src+'" style="width:100%;height:100%;object-fit:cover"></button>';
      }).join('')+'</div>'+
      '<div class="lb">Dificuldade</div>'+
      '<div style="display:flex;gap:.5rem">'+
      [[9,'Fácil · 9 peças'],[12,'Médio · 12 peças'],[20,'Difícil · 20 peças']].map(function(o){
        return '<button data-qp="'+o[0]+'" style="flex:1;padding:.6rem .3rem;border-radius:10px;font-size:.75rem;font-weight:700;border:1.5px solid '+(W.quebraPecas===o[0]?'var(--rose)':'var(--line)')+';background:'+(W.quebraPecas===o[0]?'var(--rose-soft)':'#fff')+'">'+o[1]+'</button>';
      }).join('')+'</div></div>';
  }
  if(k==='quiz'){
    return '<div class="cfg">'+
      W.quiz.map(function(q,i){
        return '<div style="'+(i?'margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--rose-soft)':'')+'">'+
        '<div class="lb" style="margin-top:0">Pergunta '+(i+1)+
        (W.quiz.length>1?' <button class="row-x" data-qzx="'+i+'" style="float:right;margin-top:-.3rem">×</button>':'')+'</div>'+
        '<input class="inp" data-qq="'+i+'" value="'+esc(q.q)+'" placeholder="Ex: Onde foi o nosso primeiro encontro?" maxlength="90" style="margin-bottom:.45rem">'+
        '<input class="inp" data-qa="'+i+'" value="'+esc(q.a)+'" placeholder="✅ Resposta certa" maxlength="40" style="margin-bottom:.45rem">'+
        '<input class="inp" data-qb="'+i+'" value="'+esc(q.b)+'" placeholder="Alternativa errada 1" maxlength="40" style="margin-bottom:.45rem">'+
        '<input class="inp" data-qc="'+i+'" value="'+esc(q.c)+'" placeholder="Alternativa errada 2" maxlength="40">'+
        '</div>';
      }).join('')+
      (W.quiz.length<5?'<button class="add-row" id="qzAdd" style="margin-top:.8rem">'+IC.plus+'Adicionar pergunta</button>':'')+
      '</div>';
  }
  return '';
}

/* ---------- handlers do wizard ---------- */
function ligarPasso(k){
  var b=el('wzBody');
  function on(sel,ev,fn){ b.querySelectorAll(sel).forEach(function(e){ e[ev]=fn.bind(null,e); }); }

  if(k==='produto'){
    on('[data-pcta]','onclick',function(e){
      W.produto=e.dataset.pcta;
      gaEvento('selecionar_produto',{produto:W.produto});
      fbEvento('ViewContent',{content_name:W.produto, content_type:'product'});
      proximoPasso();
    });
  }
  if(k==='tema'){
    on('[data-tema]','onclick',function(e){ W.tema=e.dataset.tema; redesenharSemPular(); });
  }
  if(k==='aniversariante'){
    el('fAnivNome').oninput=function(e){ W.aniversarianteNome=e.target.value; };
    el('fAnivIdade').oninput=function(e){ W.idade=e.target.value; };
  }
  if(k==='quando'){
    el('fDataFesta').onchange=function(e){ W.dataFesta=e.target.value; };
    el('fHoraFesta').onchange=function(e){ W.horaFesta=e.target.value; };
  }
  if(k==='local'){
    el('fLocal').oninput=function(e){ W.local=e.target.value; };
  }
  if(k==='whatsapp'){
    el('fWpp').oninput=function(e){ W.whatsappHost=e.target.value; };
  }
  if(k==='presentes'){
    on('[data-pe]','onclick',function(e){
      W.presentes.push({icone:e.dataset.pe, texto:''});
      redesenharSemPular();
    });
    on('[data-pi]','oninput',function(e){ W.presentes[parseInt(e.dataset.pi,10)].texto=e.value; });
    on('[data-prx]','onclick',function(e){
      W.presentes.splice(parseInt(e.dataset.prx,10),1);
      redesenharSemPular();
    });
  }
  if(k==='duracao'){
    on('[data-dur]','onclick',function(e){ W.duracao=e.dataset.dur; redesenharSemPular(); });
    var vt=el('verTudo'); if(vt) vt.onclick=abrirPreviaCompleta;
  }
  if(k==='perfil'){ on('[data-v]','onclick',function(e){ W.perfil=e.dataset.v; redesenharSemPular(); }); }
  if(k==='nomes'){
    var fn=el('fNome');
    if(fn) fn.oninput=function(e){ W.meuNome=e.target.value; };
    el('fPar').oninput=function(e){ W.parceiroNome=e.target.value; };
    var fa=el('fAnon');
    if(fa) fa.onclick=function(){ W.anonimo=!W.anonimo; if(W.anonimo) W.meuNome=''; redesenharSemPular(); };
  }
  if(k==='data'){
    el('fData').oninput=function(e){ W.dataEspecial=e.target.value; };
    el('fHora').oninput=function(e){ W.horaEspecial=e.target.value; };
    el('fCidade').oninput=function(e){ W.cidade=e.target.value; };
  }
  if(k==='titulo'){
    el('fTit').oninput=function(e){ W.titulo=e.target.value; };
    el('genTit').onclick=gerarTitulos; gerarTitulos();
  }
  if(k==='carta'){
    var ta=el('fCarta');
    ta.oninput=function(e){ W.carta=e.target.value; el('cCount').textContent=e.target.value.length; };
    el('genCarta').onclick=gerarCartas; gerarCartas();
  }
  if(k==='fotos'){
    var alvo=null, multi=false;
    on('.ph','onclick',function(e,ev){
      var rm=ev.target.closest('[data-rm]');
      if(rm){ ev.stopPropagation(); W.fotos[parseInt(rm.dataset.rm,10)]=null; redesenharSemPular(); return; }
      alvo=parseInt(e.dataset.i,10); multi=!W.fotos[alvo]; el('fileIn').click();
    });
    el('addMulti').onclick=function(){ alvo=null; multi=true; el('fileIn').click(); };
    el('fileIn').onchange=function(ev){
      var files=Array.prototype.slice.call(ev.target.files); ev.target.value='';
      if(!files.length) return;
      var max=(RECURSOS[W.produto]||RECURSOS.completo).fotos;
      toast('Preparando as fotos...');
      if(multi){
        var livres=[];
        for(var i=0;i<max;i++) if(!W.fotos[i]) livres.push(i);
        if(alvo!=null && livres.indexOf(alvo)>=0){ livres.splice(livres.indexOf(alvo),1); livres.unshift(alvo); }
        var usar=files.slice(0,livres.length);
        if(files.length>livres.length) toast('Cabem só '+livres.length+' foto(s) agora.');
        Promise.all(usar.map(function(f){
          return Promise.all([comprimir(f).catch(function(){ return null; }), dataExif(f)]);
        }))
          .then(function(res){
            res.forEach(function(par,i){ var src=par[0], dt=par[1]; if(src) W.fotos[livres[i]]={src:src,legenda:'',data:dt||''}; });
            redesenharSemPular();
          });
      } else {
        var ant=W.fotos[alvo];
        Promise.all([comprimir(files[0]), dataExif(files[0])]).then(function(res){
          var src=res[0], dt=res[1];
          W.fotos[alvo]={src:src, legenda:(ant&&ant.legenda)||'', data:(ant&&ant.data)||dt||''};
          redesenharSemPular();
        }).catch(function(){ toast('Não consegui ler essa imagem. Tente outra.'); });
      }
    };
    on('[data-cap]','oninput',function(e){ W.fotos[parseInt(e.dataset.cap,10)].legenda=e.value; });
    on('[data-cdt]','onchange',function(e){ W.fotos[parseInt(e.dataset.cdt,10)].data=e.value; redesenharSemPular(); });
  }
  if(k==='musica'){
    var inp=el('fMus'), t;
    inp.oninput=function(e){ W.musicaBusca=e.target.value; clearTimeout(t); t=setTimeout(function(){ buscarMusica(e.target.value); },420); };
    if(W.musicaBusca) buscarMusica(W.musicaBusca);
    var mx=el('musX'); if(mx) mx.onclick=function(){ W.musica=null; redesenharSemPular(); };
  }
  if(k==='trilha'){
    var tglBtn=el('trilhaTgl');
    if(tglBtn) tglBtn.onclick=function(){ W.trilhaOn=!W.trilhaOn; tglBtn.classList.toggle('on',W.trilhaOn); };
    var pb=el('musPrevBtn'), pau=el('musAudioPrev'), pTocando=false;
    if(pb) pb.onclick=function(){
      pTocando=!pTocando;
      if(pTocando){
        pb.innerHTML=IC.pause;
        pau.play().catch(function(){ pTocando=false; pb.innerHTML=IC.play; toast('Não consegui tocar a prévia agora.'); });
      } else{ pau.pause(); pb.innerHTML=IC.play; }
    };
    if(pau) pau.onended=function(){ pTocando=false; if(pb) pb.innerHTML=IC.play; };
  }
  if(k==='jogos'){
    on('[data-j]','onclick',function(e,ev){
      if(ev.target.closest('.cfg')) return;
      var key=e.dataset.j; W.jogos[key]=!W.jogos[key]; redesenharSemPular();
    });
    on('[data-rol]','oninput',function(e){ W.roletaOpcoes[parseInt(e.dataset.rol,10)]=e.value; });
    on('[data-rolx]','onclick',function(e){ W.roletaOpcoes.splice(parseInt(e.dataset.rolx,10),1); redesenharSemPular(); });
    var ra=el('rolAdd'); if(ra) ra.onclick=function(){ W.roletaOpcoes.push(''); redesenharSemPular(); };
    var pq=el('pwQ'); if(pq) pq.oninput=function(e){ W.palavraPergunta=e.target.value; };
    var pa=el('pwA'); if(pa) pa.oninput=function(e){ W.palavraSecreta=e.target.value; };
    on('[data-cc]','oninput',function(e){ W.cacaPalavras[parseInt(e.dataset.cc,10)]=e.value.toUpperCase(); });
    on('[data-ccx]','onclick',function(e){ W.cacaPalavras.splice(parseInt(e.dataset.ccx,10),1); redesenharSemPular(); });
    var ca=el('ccAdd'); if(ca) ca.onclick=function(){ W.cacaPalavras.push(''); redesenharSemPular(); };
    on('[data-qf]','onclick',function(e){ W.quebraFoto=parseInt(e.dataset.qf,10); redesenharSemPular(); });
    on('[data-qp]','onclick',function(e){ W.quebraPecas=parseInt(e.dataset.qp,10); redesenharSemPular(); });
    ['qq','qa','qb','qc'].forEach(function(f){
      on('[data-'+f+']','oninput',function(e){ W.quiz[parseInt(e.dataset[f],10)][f.charAt(1)]=e.value; });
    });
    on('[data-qzx]','onclick',function(e){ W.quiz.splice(parseInt(e.dataset.qzx,10),1); redesenharSemPular(); });
    var qa2=el('qzAdd'); if(qa2) qa2.onclick=function(){ W.quiz.push({q:'',a:'',b:'',c:''}); redesenharSemPular(); };
  }
}

function gerarTitulos(){
  var l=TITULOS.slice().sort(function(){ return Math.random()-0.5; }).slice(0,4);
  var nome=W.parceiroNome ? ('Tudo por você, '+W.parceiroNome) : null;
  if(nome && Math.random()>0.4) l[0]=nome;
  el('sugTit').innerHTML=l.map(function(s,i){
    return '<button class="sug '+(W.titulo===s?'on':'')+'" data-t="'+esc(s)+'" style="animation-delay:'+(i*0.06)+'s">'+IC.heart+'<span>'+esc(s)+'</span></button>';
  }).join('');
  el('sugTit').querySelectorAll('[data-t]').forEach(function(e){
    e.onclick=function(){ W.titulo=e.dataset.t; el('fTit').value=e.dataset.t;
      el('sugTit').querySelectorAll('.sug').forEach(function(x){ x.classList.remove('on'); });
      e.classList.add('on'); };
  });
}
function gerarCartas(){
  var base=CARTAS[W.perfil]||CARTAS.namorado;
  var l=base.slice().sort(function(){ return Math.random()-0.5; }).slice(0,3);
  el('sugCarta').innerHTML=l.map(function(s,i){
    return '<button class="sug" data-c="'+esc(s)+'" style="animation-delay:'+(i*0.07)+'s">'+IC.heart+'<span>'+esc(s)+'</span></button>';
  }).join('');
  el('sugCarta').querySelectorAll('[data-c]').forEach(function(e){
    e.onclick=function(){
      W.carta=e.dataset.c; el('fCarta').value=W.carta; el('cCount').textContent=W.carta.length;
      el('sugCarta').querySelectorAll('.sug').forEach(function(x){ x.classList.remove('on'); });
      e.classList.add('on'); toast('Carta aplicada — agora é só ajustar do seu jeito.');
    };
  });
}
var _musRes=[];
function buscarMusica(termo){
  var box=el('musRes'); if(!box) return;
  if(!termo || termo.trim().length<2){ box.innerHTML=''; return; }
  box.innerHTML='<div style="font-size:.82rem;color:var(--muted);padding:.6rem 0">Buscando...</div>';
  fetch('https://itunes.apple.com/search?media=music&limit=8&term='+encodeURIComponent(termo))

/* ---------- navegação e validação ---------- */
function limparErro(id){
  var e=el(id); if(!e) return;
  e.classList.remove('erro');
  var m=e.parentNode && e.parentNode.querySelector('.msg-erro');
  if(m) m.remove();
}
function marcarErro(id, msg){
  var e=el(id);
  if(!e){ toast(msg); return; }
  limparErro(id);
  e.classList.add('erro');
  var d=document.createElement('div');
  d.className='msg-erro';
  d.innerHTML='<span class="ic">!</span><span class="tx">'+esc(msg)+'</span>';
  (e.parentNode||e).appendChild(d);
  try{ e.focus({preventScroll:true}); }catch(err){ }
  e.scrollIntoView({block:'center', behavior:'smooth'});
  e.oninput_erro_limpar = true;
  e.addEventListener('input', function limpa(){ limparErro(id); e.removeEventListener('input', limpa); });
}
function erro(msg, campo){ return {msg:msg, campo:campo||null}; }
function validar(k){
  if(k==='produto' && !W.produto) return erro('Escolha um pacote pra continuar.');
  if(k==='perfil' && !W.perfil) return erro('Escolha pra quem é o presente.');
  if(k==='nomes'){
    if(!W.anonimo && !W.meuNome.trim()) return erro('Campo obrigatório', 'fNome');
    if(!W.parceiroNome.trim()) return erro('Campo obrigatório', 'fPar');
  }
  if(k==='data' && !W.dataEspecial) return erro('Campo obrigatório', 'fData');
  if(k==='fotos' && !W.fotos.filter(Boolean).length) return erro('Envie pelo menos uma foto.');
  if(k==='carta' && W.carta.trim().length<10) return erro('Campo obrigatório — escreva a carta ou toque em “Gerar cartas”.', 'fCarta');
  if(k==='jogos'){
    if(W.jogos.palavra && !W.palavraSecreta.trim()) return erro('Defina a palavra secreta.','pwA');
    if(W.jogos.roleta && W.roletaOpcoes.filter(function(o){return o.trim();}).length<2) return erro('A roleta precisa de pelo menos 2 opções.');
    if(W.jogos.caca && W.cacaPalavras.filter(function(o){return o.trim().length>1;}).length<2) return erro('O caça-palavras precisa de pelo menos 2 palavras.');
    if(W.jogos.quiz){
      var bad=W.quiz.some(function(q){ return !q.q.trim()||!q.a.trim()||!q.b.trim()||!q.c.trim(); });
      if(bad) return erro('Complete todas as perguntas do quiz (ou desligue o quiz).');
    }
    if(W.produto==='jogo' && !Object.keys(W.jogos).some(function(x){return W.jogos[x];}))
      return erro('Ative pelo menos um jogo.');
  }
  if(k==='aniversariante' && !W.aniversarianteNome.trim()) return erro('Campo obrigatório','fAnivNome');
  if(k==='quando' && !W.dataFesta) return erro('Campo obrigatório','fDataFesta');
  if(k==='local' && !W.local.trim()) return erro('Campo obrigatório','fLocal');
  if(k==='whatsapp' && (W.whatsappHost||'').replace(/\D/g,'').length<10) return erro('Digite um WhatsApp válido, com DDD.','fWpp');
  return null;
}
function proximoPasso(pular){
  var ps=passos(), k=ps[wStep];
  if(!pular){
    var err=validar(k);
    if(err){
      var m = (typeof err==='string') ? err : err.msg;
      var campo = (typeof err==='string') ? null : err.campo;
      if(campo) marcarErro(campo, m); else toast(m);
      return;
    }
  }
  if(k==='checkout'){ finalizar(); return; }
  wStep++; desenharPasso();
  gaPasso();
}
function voltarPasso(){
  if(wStep<=0){ ir(''); return; }
  wStep--; desenharPasso();
  gaPasso();
}

/* ---------- finalizar: gera uma cobrança Pix dinâmica na Efí ---------- */
function finalizar(){
  gaEvento('begin_checkout',{produto:W.produto, duracao:W.duracao, valor:precoDe(W.produto,W.duracao)});
  fbEvento('InitiateCheckout',{value:precoDe(W.produto,W.duracao), currency:'BRL', content_name:W.produto, content_type:'product'});
  var btn=el('wzNext');
  if(btn){ btn.disabled=true; btn.textContent='Gerando o Pix...'; }
  var boxErro=el('pagErro');
  if(boxErro){ boxErro.style.display='none'; }
  fetch('/.netlify/functions/criar-pagamento', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({presente:W})
  })
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
  .then(function(res){
    if(!res.ok || !res.d || !res.d.payload){
      var msg=(res.d && res.d.erro) || 'Não consegui gerar o Pix. Tenta de novo em instantes.';
      toast(msg);
      if(boxErro){ boxErro.style.display='flex'; boxErro.className='demo-note error'; boxErro.innerHTML=IC.x+'<div><b>Não deu pra continuar.</b> '+esc(msg)+'</div>'; }
      if(btn){ btn.disabled=false; btn.textContent='Pagar e gerar o link'; }
      return;
    }
    W.pago=false; W.criadoEm=Date.now();
    salvarPresente(W);
    mostrarPix(res.d.payload, W.id, res.d.teste, precoDe(W.produto,W.duracao));
  })
  .catch(function(){
    toast('Sem conexão com o servidor de pagamento. Confira sua internet e tente de novo.');
    if(btn){ btn.disabled=false; btn.textContent='Pagar e gerar o link'; }
  });
}

  el('pixCopy').onclick=function(){ copiar(payload,'Código Pix copiado!'); };
  if(teste){
    el('simularBtn').onclick=function(){
      var sb=el('simularBtn'); sb.disabled=true; sb.textContent='Simulando...';
      fetch('/.netlify/functions/simular-pagamento',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id:id})
      })
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(res){
        if(!res.ok){
          toast((res.d&&res.d.erro)||'Não consegui simular o pagamento.');
          sb.disabled=false; sb.textContent='🧪 Simular pagamento (só teste)';
          return;
        }
        toast('Pagamento simulado! Liberando o presente...');
        sb.textContent='✓ Simulado — aguardando confirmação';
      })
      .catch(function(){ toast('Sem conexão.'); sb.disabled=false; sb.textContent='🧪 Simular pagamento (só teste)'; });
    };
  }

  var tentativas=0, iv=null;
  aoSair(function(){ clearInterval(iv); });
  function checar(){
    tentativas++;
    fetch('/.netlify/functions/presente?id='+encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.pago && d.presente){
          clearInterval(iv);
          salvarPresente(d.presente);
          telaSucesso(id);

          clearInterval(iv);
          var st=el('pixStatus');
          if(st) st.innerHTML='Ainda não caiu. Pode fechar essa tela — assim que confirmar, o presente aparece sozinho em <a href="#/meus">Meus presentes</a>.';
        }
      })
      .catch(function(){ /* tenta de novo no próximo tick */ });
  }
  iv=setInterval(checar,3000);
  checar();
}

  var app=el('app');

function carregarPainel(chave, cb){
  var hdr={ headers:{'x-admin-key':chave} };
  Promise.all([
    fetch('/.netlify/functions/admin-pedidos', hdr).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); }),
    fetch('/.netlify/functions/admin-funil', hdr).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
  ]).then(function(res){
    var pRes=res[0], fRes=res[1];
    if(!pRes.ok){ if(cb) cb(true); return; }
    if(cb) cb(false);
    desenharPainel(pRes.d.pedidos||[], (fRes.ok && fRes.d.visitas) || []);
  }).catch(function(){ if(cb) cb(true); });
}
var PASSO_NOME={
  produto:'Escolhendo o produto', perfil:'Perfil', nomes:'Nomes', data:'Data especial', titulo:'Título',
  fotos:'Fotos', carta:'Carta', jogos:'Jogos', trilha:'Trilha sonora', vitrine:'Revisão final',
  duracao:'Duração', checkout:'Finalizando (checkout)'
};
function desenharPainel(pedidos, visitas){
  var body=el('pnlBody'); if(!body) return;
  var agora=new Date();
  var inicioDia=new Date(agora.getFullYear(),agora.getMonth(),agora.getDate()).getTime();
  var inicioMes=new Date(agora.getFullYear(),agora.getMonth(),1).getTime();
  var pagos=pedidos.filter(function(p){ return p.pago; });
  var hoje=pagos.filter(function(p){ return (p.criadoEm||0)>=inicioDia; });
  var mes=pagos.filter(function(p){ return (p.criadoEm||0)>=inicioMes; });
  function soma(l){ return l.reduce(function(s,p){ return s+(Number(p.valor)||0); },0); }

  var cards=
    '<div class="pnl-card"><b>'+pagos.length+'</b><span>pedidos pagos (total)</span></div>'+
    '<div class="pnl-card"><b>'+pedidos.length+'</b><span>links gerados (com pendentes)</span></div>'+
    '<div class="pnl-card"><b>R$ '+fmtPreco(soma(hoje))+'</b><span>receita hoje ('+hoje.length+' pedidos)</span></div>'+
    '<div class="pnl-card"><b>R$ '+fmtPreco(soma(mes))+'</b><span>receita no mês ('+mes.length+' pedidos)</span></div>'+
    '<div class="pnl-card"><b>R$ '+fmtPreco(soma(pagos))+'</b><span>receita total</span></div>'+
    '<div class="pnl-card"><b>'+(pagos.length?fmtPreco(soma(pagos)/pagos.length):'—')+'</b><span>ticket médio (R$)</span></div>';

  /* por dia */
  var porDia={};
  pagos.forEach(function(p){
    if(!p.criadoEm) return;
    var d=new Date(p.criadoEm), k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!porDia[k]) porDia[k]={ct:0,vl:0,ts:new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
    porDia[k].ct++; porDia[k].vl+=Number(p.valor)||0;
  });
  var diasOrd=Object.keys(porDia).sort(function(a,b){ return porDia[b].ts-porDia[a].ts; }).slice(0,20);
  var diasHtml=diasOrd.map(function(k){
    var d=porDia[k];
    return '<div class="pnl-dia"><span class="dt">'+fmtData(k)+'</span>'+
      '<span class="ct">'+d.ct+' pedido'+(d.ct===1?'':'s')+'</span>'+
      '<span class="vl">R$ '+fmtPreco(d.vl)+'</span></div>';
  }).join('') || '<div class="pnl-nota">Nenhuma venda registrada ainda.</div>';

  /* por produto */
  var porProd={};
  pagos.forEach(function(p){
    var k=p.produto||'—';
    if(!porProd[k]) porProd[k]={ct:0,vl:0};
    porProd[k].ct++; porProd[k].vl+=Number(p.valor)||0;
  });
  var nomeProd={completo:'Retrospectiva Completa', carta:'Carta Virtual', convite:'Convite Criativo'};
  var maxVl=Math.max.apply(null,Object.keys(porProd).map(function(k){ return porProd[k].vl; }).concat([1]));
  var prodOrd=Object.keys(porProd).sort(function(a,b){ return porProd[b].vl-porProd[a].vl; });
  var prodHtml=prodOrd.map(function(k){
    var d=porProd[k];
    return '<div class="pnl-prod"><span class="nm">'+esc(nomeProd[k]||k)+'</span>'+
      '<span class="barra"><i style="width:'+Math.round(100*d.vl/maxVl)+'%"></i></span>'+
      '<span class="vl">R$ '+fmtPreco(d.vl)+' · '+d.ct+'x</span></div>';
  }).join('') || '<div class="pnl-nota">Nenhuma venda registrada ainda.</div>';

  /* funil — até onde cada visitante chegou */
  var idsPagos={}; pagos.forEach(function(p){ idsPagos[p.id]=true; });
  var visitasHtml=visitas.slice(0,60).map(function(v){
    var passoNome=PASSO_NOME[v.passo]||v.passo;
    var quando=v.ultimaVez?new Date(v.ultimaVez).toLocaleString('pt-BR'):'—';
    var converteu=idsPagos[v.id];
    return '<div class="pnl-visita"><div><div class="id">'+esc(v.id)+'</div>'+
      '<div class="ps">'+esc(passoNome)+(v.indice?' · etapa '+v.indice:'')+'</div>'+

function telaPresente(id){
  var g=pegarPresente(id);
  if(g && g.pago){ return abrirPresenteChecado(g); }

  el('app').innerHTML='<div class="g-scope"><div class="expired">'+
    '<img src="'+MASCOTE+'" alt="" style="animation:float 2.4s ease-in-out infinite">'+
    '<h2 style="font-family:Fraunces;font-size:1.5rem">Abrindo seu presente...</h2>'+
    '<p style="color:#B99BA8;font-size:.9rem">Só um instante.</p></div></div>';

  fetch('/.netlify/functions/presente?id='+encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.encontrado && d.pago && d.presente){
        salvarPresente(d.presente);
        abrirPresenteChecado(d.presente);
      } else if(d && d.encontrado && !d.pago){
        telaPresenteAguardando(id);
      } else {
        telaPresenteNaoEncontrado();
      }
    })
    .catch(function(){ telaPresenteNaoEncontrado(); });
}

  if(g.expiraEm && Date.now()>g.expiraEm){ telaPresenteExpirado(); return; }
  document.body.style.overflow='hidden';
  aoSair(function(){ document.body.style.overflow=''; pararAudio(); });
  if(g.produto==='convite'){ montarConvite(g); return; }
  montarPortao(g);
}

/* ---------- 2. INTRO CINEMÁTICA ---------- */
function tempoJuntos(g){
  if(!g.dataEspecial) return null;
  var ini=new Date(g.dataEspecial+'T'+(g.horaEspecial||'00:00'));
  var ms=Date.now()-ini.getTime(); if(ms<0) ms=0;
  var seg=Math.floor(ms/1000);
  var dias=Math.floor(seg/86400);
  var anos=Math.floor(dias/365.25);
  var meses=Math.floor((dias-anos*365.25)/30.44);
  return {ini:ini, seg:seg, dias:dias, anos:anos, meses:meses,
          mesesTotal:Math.floor(dias/30.44),
          horas:Math.floor(seg/3600), min:Math.floor(seg/60),
          semanas:Math.floor(dias/7), abracos:Math.round(dias*2.4),
          risadas:Math.round(dias*11), cafes:Math.round(dias*1.6)};
}
/* Número grande em linguagem de gente: 1.240.000 -> "1,2" + "milhões".
   Devolve {n:'texto do número', esc:'mil/milhões/bilhões ou vazio'} */
/* "mil" não pede "de" (21 mil risadas), mas milhão/bilhão pede (2,6 milhões de risadas) */
function escalaCom(v, substantivo){
  var e = numExtenso(v).esc;
  if(!e) return substantivo;
  return e + (e === 'mil' ? ' ' : ' de ') + substantivo;
}
function numExtenso(v){
  v = Math.max(0, Math.round(v));
  function corta(x){
    var s = (Math.round(x*10)/10).toString().replace('.', ',');
    return s.replace(/,0$/, '');
  }
  if(v >= 1e9) return {n:corta(v/1e9),  esc:(v>=2e9?'bilhões':'bilhão')};
  if(v >= 1e6) return {n:corta(v/1e6),  esc:(v>=2e6?'milhões':'milhão')};
  if(v >= 1000) return {n:corta(v/1000), esc:'mil'};
  return {n:nnum(v), esc:''};
}
function ondaTexto(txt,delay){
  return txt.split('').map(function(c,i){
    return '<span style="animation-delay:'+((delay||0)+i*0.035)+'s">'+(c===' '?'&nbsp;':esc(c))+'</span>';
  }).join('');
}
