<style>
:root{
  --white:#FFFFFF; --paper:#FFF7F9; --tint:#FFF1F6; --line:#F1E4E8;
  --plum:#161113; --ink:#1E1418; --muted:#857D80; --muted-2:#A9A0A4;
  --rose:#E32B6D; --rose-deep:#B5124E; --rose-soft:#FCE4ED; --rose-1:#FF7FAB;
  --gold:#E8B44A; --gold-deep:#B8860B;
  --pad: clamp(1.15rem, 5vw, 2.5rem);
  --maxw: 74rem;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --shadow-sm:0 2px 10px rgba(22,17,19,.05);
  --shadow-md:0 10px 30px rgba(181,18,78,.10);
  --shadow-lg:0 24px 60px rgba(181,18,78,.16);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--white); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4,.display{font-family:'Fraunces',Georgia,serif;letter-spacing:-.02em;color:var(--plum);line-height:1.1;}
.script{font-family:'Grand Hotel',cursive;font-weight:400;letter-spacing:0;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:4px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.shell{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);}

/* ============ BOTÕES ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
  font-weight:700;font-size:.95rem;border-radius:100px;padding:1rem 1.6rem;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s;
  line-height:1;white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#F0417E,#D01A5C);color:#fff;box-shadow:0 10px 26px rgba(227,43,109,.32);}
.btn-primary:hover{box-shadow:0 14px 34px rgba(227,43,109,.42);transform:translateY(-2px);}
.btn-primary:disabled{background:var(--line);color:var(--muted-2);box-shadow:none;cursor:not-allowed;transform:none;}
.btn-ghost{background:#fff;color:var(--rose-deep);box-shadow:0 2px 12px rgba(22,17,19,.07);border:1.5px solid var(--rose-soft);}
.btn-ghost:hover{border-color:var(--rose);}
.btn-dark{background:var(--plum);color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:1.15rem 1.9rem;font-size:1rem;}
.btn svg{width:18px;height:18px;flex-shrink:0;}

/* ============ ANNOUNCEMENT + HEADER ============ */
header.site{
  position:sticky;top:0;z-index:60;background:#FFFCFD;
  border-bottom:1px solid var(--line);
  transform:translateZ(0);will-change:transform;
}
.hd{display:flex;align-items:center;justify-content:space-between;padding-top:.85rem;padding-bottom:.85rem;}
.logo{display:flex;align-items:center;gap:.6rem;}
.logo img{width:44px;height:44px;object-fit:contain;}
.logo .wm{font-family:'Fraunces';font-weight:700;font-size:1.42rem;letter-spacing:-.03em;color:var(--plum);display:flex;align-items:center;gap:.1rem;}
.logo .wm i{font-style:normal;color:var(--rose);}
.logo .wm svg{width:14px;height:14px;fill:var(--rose);margin-left:.15rem;margin-top:-.5rem;}
.nav{display:flex;align-items:center;gap:1.6rem;}
.nav a{font-size:.9rem;font-weight:600;color:var(--ink);transition:color .15s;}
.nav a:hover{color:var(--rose);}
.burger{width:40px;height:40px;display:none;align-items:center;justify-content:center;color:var(--rose);}
.burger svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;}
@media(max-width:860px){
  .nav{position:absolute;top:calc(100% + .6rem);right:var(--pad);
    background:#fff;flex-direction:column;align-items:stretch;gap:0;
    padding:.5rem 1.05rem;border-radius:var(--r-lg);border:1px solid var(--line);
    box-shadow:var(--shadow-lg);width:max-content;min-width:12rem;
    max-width:min(17rem,calc(100vw - 2*var(--pad)));
    opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transform-origin:top right;
    transition:opacity .2s var(--ease),transform .2s var(--ease),visibility 0s linear .2s;z-index:59;}
  .nav.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);
    transition:opacity .2s var(--ease),transform .2s var(--ease);}
  .nav a{padding:.85rem .15rem;border-bottom:1px solid var(--line);font-size:.96rem;white-space:nowrap;}
  .nav a:last-child{border-bottom:none;}
  .burger{display:flex;position:relative;z-index:61;}
}

/* ============ HERO ============ */
.hero{position:relative;background:linear-gradient(180deg,#FFF6F9 0%,#FFFFFF 78%);overflow:hidden;}
.hero-blob{position:absolute;top:-10%;right:-16%;width:min(58vw,640px);aspect-ratio:1;
  background:radial-gradient(circle at 40% 40%,#FDD9E6,#FCE9F0 60%,transparent 72%);
  border-radius:48% 52% 44% 56%/56% 44% 56% 44%;animation:blob 18s ease-in-out infinite;pointer-events:none;}
@keyframes blob{0%,100%{border-radius:48% 52% 44% 56%/56% 44% 56% 44%;transform:rotate(0);}50%{border-radius:56% 44% 58% 42%/42% 58% 42% 58%;transform:rotate(8deg);}}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:2.5rem;align-items:center;padding-top:3.2rem;padding-bottom:2.6rem;position:relative;z-index:2;}
@media(max-width:860px){.hero-in{grid-template-columns:1fr;gap:1.4rem;padding-top:2rem;padding-bottom:1.6rem;}}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5rem;background:#fff;border:1.5px solid var(--rose-soft);
  color:var(--rose-deep);font-size:.79rem;font-weight:700;padding:.6rem 1.05rem;border-radius:100px;
  box-shadow:var(--shadow-sm);margin-bottom:1.4rem;
}
.eyebrow svg{width:15px;height:15px;stroke:var(--rose);fill:none;stroke-width:2;}
h1.hero-t{font-size:clamp(2.05rem,7.6vw,3.55rem);font-weight:700;line-height:1.12;padding-right:.12em;}
h1.hero-t .l2{display:block;position:relative;width:fit-content;max-width:96%;margin-top:.18em;}
h1.hero-t .script{color:var(--rose);font-size:1.02em;line-height:1.25;padding-right:.1em;}
.underline-sw{display:block;width:78%;height:12px;margin-top:-.3em;margin-left:8%;}
.underline-sw path{fill:none;stroke:var(--rose-1);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.1s var(--ease) .55s forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.heart-pop{display:inline-flex;vertical-align:.08em;width:26px;margin-left:.4rem;
  animation:hb 2.4s ease-in-out infinite;}
.heart-pop svg{width:100%;fill:none;stroke:var(--rose);stroke-width:2.2;}
@keyframes hb{0%,100%{transform:scale(1) rotate(-6deg);}50%{transform:scale(1.16) rotate(6deg);}}
@media(max-width:520px){.heart-pop{width:20px;margin-left:.3rem;}}
@media(max-width:600px){:root{--pad:1.65rem;} .hero-in{padding-top:1.7rem;}}
.hero-sub{font-size:clamp(.98rem,2.4vw,1.14rem);color:#5C5457;line-height:1.72;margin:1.7rem 4% 2.1rem 0;max-width:29rem;}
.hero-cta{display:flex;flex-wrap:wrap;gap:.9rem;}
.hero-cta .btn{flex:1 1 15rem;}
.hero-art{position:relative;display:flex;justify-content:center;}
.hero-art>img{width:min(100%,420px);filter:drop-shadow(0 26px 44px rgba(181,18,78,.22));animation:float 6s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-16px) rotate(1deg);}}
.hart{position:absolute;pointer-events:none;opacity:.85;}
.hart svg{fill:var(--rose-1);}
.hart.h1{top:6%;right:4%;width:30px;animation:float 5s ease-in-out infinite .3s;}
.hart.h2{bottom:16%;left:2%;width:22px;animation:float 6.5s ease-in-out infinite .9s;}
.hart.h3{top:44%;right:-1%;width:16px;animation:float 4.4s ease-in-out infinite 1.4s;}
@media(max-width:860px){.hero-art{order:-1;}.hero-art>img{width:min(52%,200px);}}
@media(max-width:600px){
  .hero-sub{margin:1rem 0 1.2rem;font-size:.95rem;line-height:1.55;}
  .hero-cta{gap:.6rem;}
  .hero-cta .btn{flex:1 1 100%;}
}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;}

/* cards em 2 colunas — usados nas etapas da música */
.cards2{display:grid;grid-template-columns:repeat(2,1fr);gap:.65rem;}
.card2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;

/* cards de "tipo de voz" na etapa final da música */
.voz-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;}
.voz-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;

.mh-label .opc{font-weight:600;color:var(--muted);}
.mp-topo{text-align:center;font-size:1.8rem;margin-bottom:1rem;}
.mp-topo b{display:block;font-family:'Fraunces';font-size:1.15rem;color:var(--plum);
  font-weight:600;margin-top:.2rem;}
.mp-topo span{display:block;font-size:.82rem;color:var(--muted);margin-top:.2rem;line-height:1.5;}
.mp-oferta{display:flex;align-items:center;gap:.8rem;margin-top:.9rem;
  background:linear-gradient(160deg,#2A1620,#140A11);border-radius:14px;padding:.95rem 1.05rem;
  box-shadow:0 10px 26px rgba(20,10,17,.26);}
.mp-of-tx{flex:1;min-width:0;}
.mp-of-tx b{display:block;font-size:.9rem;color:#fff;}
.mp-of-tx span{display:block;font-size:.76rem;color:#C6A9B6;line-height:1.45;margin-top:.15rem;}
.mp-of-pr{flex-shrink:0;font-family:'Fraunces';font-size:1.3rem;color:var(--gold);}
.mv-aviso{font-size:.78rem;color:var(--muted);background:#fff;border:1px dashed var(--rose-soft);
  border-radius:10px;padding:.6rem .75rem;margin-bottom:.7rem;line-height:1.5;}
.mv-letra{margin-top:.5rem;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:.75rem .9rem;}
.mv-letra summary{font-size:.82rem;font-weight:800;color:var(--rose-deep);cursor:pointer;}
.mv-letra pre{white-space:pre-wrap;font-family:'Fraunces',serif;font-size:.86rem;line-height:1.8;
  color:var(--ink);margin:.7rem 0 0;}

/* etapa de prévia/aprovação da letra (antes de compor a música) */
.letra-wrap{display:flex;flex-direction:column;}
.letra-rotulo{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-bottom:.5rem;}
.letra-rotulo span{font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);opacity:.85;}
.letra-area{font-family:'Fraunces',serif;font-size:.95rem;line-height:1.85;white-space:pre-wrap;
  min-height:16rem;resize:vertical;}
.letra-ajuste{margin-top:1rem;background:var(--tint);border:1px solid var(--rose-soft);
  border-radius:var(--r-md);padding:.9rem 1rem;}
.letra-ajuste-lbl{display:block;font-size:.78rem;color:var(--rose-deep);font-weight:800;margin-bottom:.5rem;}
.letra-ajuste-inp{min-height:3.4rem;font-size:.86rem;resize:vertical;}
.letra-erro{font-size:.86rem;color:#B8233F;background:#FFF1F4;border:1px solid var(--rose-soft);
  border-radius:var(--r-md);padding:.8rem .9rem;line-height:1.5;}
.letra-carregando{background:linear-gradient(165deg,#2A1620,#140A11);border-radius:var(--r-lg);
  padding:1.8rem 1.3rem;text-align:center;color:#fff;box-shadow:0 16px 40px rgba(20,10,17,.35);}
.lc-pena{font-size:2.1rem;animation:lcBalanca 1.4s ease-in-out infinite;}
@keyframes lcBalanca{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
.lc-tit{font-family:'Fraunces';font-size:1.05rem;font-weight:600;margin-top:.6rem;}
.lc-sub{font-size:.8rem;color:#C6A9B6;margin-top:.3rem;}

/* tela de sucesso da música avulsa */
.ms-hero{background:linear-gradient(165deg,#2A1620,#140A11);border-radius:var(--r-lg);
  padding:2rem 1.3rem 1.6rem;text-align:center;color:#fff;box-shadow:0 16px 40px rgba(20,10,17,.35);}
.ms-capa{display:flex;align-items:center;justify-content:center;margin-bottom:1.1rem;}
.ms-disco{width:110px;height:110px;border-radius:50%;font-size:2.4rem;
  background:radial-gradient(circle at 35% 30%,#5a2f44,#170b12 72%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px rgba(232,180,74,.4),0 0 60px rgba(232,180,74,.25);
  animation:msFlut 5s ease-in-out infinite;}
@keyframes msFlut{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.ms-tit{font-family:'Fraunces';font-size:1.35rem;font-weight:600;line-height:1.25;}
.ms-sub{font-size:.83rem;color:#C6A9B6;margin-top:.3rem;margin-bottom:1.2rem;}
.ms-audio{width:100%;}

.cross-sell{display:flex;gap:.7rem;align-items:flex-start;margin:1rem 0;
  background:var(--tint);border:1px solid var(--rose-soft);border-radius:var(--r-lg);padding:1rem 1.1rem;
  font-size:1.3rem;}
.cross-sell b{display:block;font-size:.92rem;color:var(--plum);}
.cross-sell span{display:block;font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:.2rem;}

/* entrega dedicada da música avulsa */
.musica-entrega{position:relative;min-height:100vh;
  background:radial-gradient(120% 90% at 50% 0%,#2A1620,#0A0508 72%);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2.5rem 1.5rem 3rem;text-align:center;overflow:hidden;}
.capa-drop,.field .capa-drop{display:flex;flex-direction:row;align-items:center;gap:.9rem;
  border:2px dashed #F0A6C2;border-radius:18px;padding:1rem;
  background:#FFF5F9;text-align:left;cursor:pointer;}
.capa-mock{display:block;position:relative;width:84px;height:84px;flex-shrink:0;}
.capa-mock-disco{position:absolute;top:0;bottom:0;right:0;left:18px;border-radius:50%;background:radial-gradient(circle,#3a1a26 0 14%,#111 15% 100%);box-shadow:inset 0 0 0 6px #222;}
.capa-mock-foto{position:absolute;left:0;top:6px;width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,#FFD3E1,#F0407C);display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 6px 14px rgba(196,24,87,.3);}
.capa-drop-tx{display:flex;flex-direction:column;gap:.2rem;min-width:0;}
.capa-btn{margin-top:.45rem;align-self:flex-start;font-size:.8rem;font-weight:800;color:#fff;background:linear-gradient(180deg,#F0407C,#C41857);padding:.5rem .85rem;border-radius:100px;}
.capa-ic{font-size:1.6rem;}
.capa-drop b{font-size:.88rem;color:var(--plum);}
.capa-sub{font-size:.75rem;color:var(--muted);line-height:1.4;}
.capa-previa{display:flex;align-items:center;gap:.8rem;background:#fff;
  border:1.5px solid var(--rose-soft);border-radius:14px;padding:.7rem;}
.capa-previa img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;}
.capa-tx{flex:1;min-width:0;}
.capa-tx b{display:block;font-size:.85rem;color:var(--plum);}
.capa-tx span{display:block;font-size:.73rem;color:var(--muted);line-height:1.4;}
.capa-x{flex-shrink:0;font-size:.74rem;font-weight:800;color:var(--rose-deep);
  text-decoration:underline;}
.mv-capa{display:flex;justify-content:center;margin:.5rem 0;}
.mv-capa img{width:110px;height:110px;border-radius:12px;object-fit:cover;
  box-shadow:0 8px 22px rgba(0,0,0,.18);}
.me-brilho{position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:130%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(232,180,74,.13),transparent 62%);
  animation:meBrilho 7s ease-in-out infinite;}
@keyframes meBrilho{0%,100%{opacity:.55;transform:translateX(-50%) scale(1);}
  50%{opacity:1;transform:translateX(-50%) scale(1.09);}}
.me-selo{position:relative;font-size:.72rem;font-weight:800;letter-spacing:.06em;
  background:rgba(232,180,74,.15);border:1px solid rgba(232,180,74,.35);color:var(--gold);
  padding:.4rem .9rem;border-radius:100px;margin-bottom:1.8rem;}
/* capa do álbum — quadrada, com play por cima */
.me-album{position:relative;width:min(272px,72vw);aspect-ratio:1;border-radius:20px;
  overflow:hidden;margin-bottom:1.8rem;
  box-shadow:0 0 0 1px rgba(232,180,74,.28),0 26px 60px rgba(0,0,0,.6),
    0 0 90px rgba(232,180,74,.16);
  transition:transform .5s var(--ease), box-shadow .5s var(--ease);}
.me-album.tocando{transform:scale(1.03);
  box-shadow:0 0 0 1px rgba(232,180,74,.5),0 30px 70px rgba(0,0,0,.65),
    0 0 120px rgba(232,180,74,.3);}
.me-capa-img{width:100%;height:100%;object-fit:cover;display:block;}
.me-capa-vazia{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 28%,#4a2a3c,#150a11 72%);}
.me-capa-vazia span{font-size:3.6rem;opacity:.85;}
/* véu escuro embaixo pro play ter contraste em qualquer foto */
.me-vidro{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 100%);}
.me-play{position:absolute;left:50%;bottom:1.1rem;transform:translateX(-50%);
  width:62px;height:62px;border-radius:50%;background:var(--rose);border:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 28px rgba(227,43,109,.55);
  animation:mePulso 2.6s ease-in-out infinite;}
.me-play.tocando{animation:none;background:rgba(255,255,255,.18);
  backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.4);}
@keyframes mePulso{0%,100%{box-shadow:0 8px 28px rgba(227,43,109,.55),0 0 0 0 rgba(227,43,109,.5);}
  60%{box-shadow:0 8px 28px rgba(227,43,109,.55),0 0 0 20px rgba(227,43,109,0);}}
.me-play svg{width:23px;height:23px;fill:#fff;margin-left:3px;}
.me-play.tocando svg{margin-left:0;}
/* equalizador */
.me-eq{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:22px;
  margin:1.4rem 0 1rem;opacity:.25;transition:opacity .3s;}
.me-eq.on{opacity:1;}
.me-eq i{display:block;width:3.5px;border-radius:3px;background:var(--gold);height:7px;}
.me-eq.on i{animation:meEq 1s ease-in-out infinite;}
.me-eq i:nth-child(1){animation-delay:0s;} .me-eq i:nth-child(2){animation-delay:.1s;}
.me-eq i:nth-child(3){animation-delay:.2s;} .me-eq i:nth-child(4){animation-delay:.3s;}
.me-eq i:nth-child(5){animation-delay:.4s;} .me-eq i:nth-child(6){animation-delay:.5s;}
.me-eq i:nth-child(7){animation-delay:.6s;}
@keyframes meEq{0%,100%{height:5px;}50%{height:20px;}}
.me-tit{position:relative;font-family:'Fraunces';font-size:1.55rem;font-weight:600;
  line-height:1.25;margin-top:.6rem;}
.me-assina{font-size:.88rem;color:var(--gold);font-style:italic;margin-top:.3rem;}
.me-play{width:78px;height:78px;border-radius:50%;background:var(--rose);border:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 34px rgba(227,43,109,.45);margin:1.8rem 0 1.2rem;
  animation:mePulso 2.6s ease-in-out infinite;}
.me-play.tocando{animation:none;}
@keyframes mePulso{0%,100%{box-shadow:0 10px 34px rgba(227,43,109,.45),0 0 0 0 rgba(227,43,109,.45);}
  60%{box-shadow:0 10px 34px rgba(227,43,109,.45),0 0 0 22px rgba(227,43,109,0);}}
.me-play svg{width:28px;height:28px;fill:#fff;margin-left:3px;}
.me-play.tocando svg{margin-left:0;}
/* progresso */
.me-barra{width:min(272px,72vw);height:5px;border-radius:5px;background:rgba(255,255,255,.14);
  overflow:hidden;cursor:pointer;}
.me-barra i{display:block;height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .2s linear;}
.me-tempo{display:flex;justify-content:space-between;width:min(272px,72vw);
  font-size:.7rem;color:#9C8590;margin-top:.4rem;}
/* letra */
.me-letra{width:min(320px,86vw);margin-top:1.4rem;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:.8rem 1rem;text-align:left;}
.me-letra summary{font-size:.82rem;font-weight:800;color:var(--gold);cursor:pointer;}
.me-letra pre{white-space:pre-wrap;font-family:'Fraunces',serif;font-size:.86rem;
  line-height:1.85;color:#EADCE2;margin:.8rem 0 0;}
/* botões — antes estavam brancos invisíveis */
/* ===== página da música (premium) ===== */
.mx{position:relative;min-height:100vh;overflow:hidden;background:#12040B;color:#F7EDF1;font-family:Inter,system-ui,sans-serif;}
.mx-bg{position:absolute;top:-40px;left:-40px;right:-40px;height:620px;background-size:cover;background-position:center;filter:blur(30px) brightness(.45);z-index:0;pointer-events:none;}
.mx-bg-sem{filter:none;top:0;left:0;right:0;bottom:0;height:auto;background:radial-gradient(70% 40% at 20% 0%,rgba(227,43,109,.45),transparent 70%),radial-gradient(60% 40% at 100% 60%,rgba(140,20,70,.5),transparent 70%),radial-gradient(80% 30% at 50% 110%,rgba(233,185,79,.25),transparent 70%),linear-gradient(180deg,#2A0614,#12040B 55%,#1C0510);}
.mx:before{content:"";position:absolute;top:0;left:0;right:0;height:640px;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,4,11,.25),rgba(18,4,11,.8) 70%,#12040B);}
.mx-in{position:relative;z-index:1;max-width:30rem;margin:0 auto;padding:1.6rem 1.2rem 2.5rem;text-align:center;}
.mx-saud{display:inline-block;font-size:.8rem;font-weight:800;letter-spacing:.03em;color:#FFE3A3;background:rgba(233,185,79,.12);border:1px solid rgba(233,185,79,.45);padding:.4rem .95rem;border-radius:100px;}
.mx-hero{position:relative;width:250px;height:250px;margin:1.6rem auto 1.3rem;}
.mx-capa{position:absolute;inset:0;border-radius:22px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.6),0 0 0 1.5px rgba(255,227,163,.45);z-index:2;}
.mx-capa img{width:100%;height:100%;object-fit:cover;display:block;}
.mx-disco{border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#151015 0 2px,#0b080b 2px 4px);box-shadow:0 20px 50px rgba(0,0,0,.65),inset 0 0 0 2px rgba(255,255,255,.04);}
.mx-disco i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 40deg,rgba(255,255,255,.14) 55deg,transparent 75deg 220deg,rgba(255,255,255,.1) 235deg,transparent 255deg);}
.mx-disco-atras{position:absolute;width:230px;height:230px;top:10px;left:60px;z-index:1;transition:left .6s cubic-bezier(.2,.8,.2,1);}
.mx-hero.tocando .mx-disco-atras{left:95px;animation:mxgira 3.2s linear infinite;}
.mx-disco-solo{position:absolute;inset:0;}
.mx-hero.tocando .mx-disco-solo{animation:mxgira 3.2s linear infinite;}
.mx-selo{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:radial-gradient(circle,#FF7FAB,#C41857 70%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #0b080b,0 0 0 6px rgba(233,185,79,.6);}
.mx-selo img{width:64px;height:64px;object-fit:contain;}
@keyframes mxgira{to{transform:rotate(360deg)}}
.mx-play{position:absolute;z-index:3;right:-8px;bottom:-8px;width:68px;height:68px;border-radius:50%;border:0;background:linear-gradient(180deg,#FF6BA3,#E32B6D);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(227,43,109,.55),0 0 0 4px rgba(18,4,11,.85);cursor:pointer;}
.mx-disco-solo~.mx-play{right:50%;bottom:50%;margin:0 -34px -34px 0;background:rgba(227,43,109,.92);}
.mx-hero.tocando .mx-disco-solo~.mx-play{opacity:.85;}
.mx-play svg{width:28px;height:28px;fill:#fff;}
.mx-atual{display:inline-block;font-size:.72rem;font-weight:800;color:#3A0A1E;background:linear-gradient(180deg,#FFF0C2,#E9B94F);padding:.25rem .7rem;border-radius:100px;margin-bottom:.5rem;}
.mx-tit{font-family:Fraunces,Georgia,serif;font-size:1.75rem;line-height:1.15;color:#fff;margin:.2rem 0 .4rem;letter-spacing:-.01em;}
.mx-sub{font-size:.9rem;color:#E3C6D2;line-height:1.5;max-width:22rem;margin:0 auto;}
.mx-player{margin:1.3rem 0 .4rem;}
.mx-agora{font-size:.8rem;color:#E3C6D2;margin-bottom:.5rem;}
.mx-agora b{color:#FFE3A3;}
.mx-barra{height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;cursor:pointer;}
.mx-barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF6BA3,#FFD36B);border-radius:6px;}
.mx-tempo{display:flex;justify-content:space-between;font-size:.72rem;color:#B99BA8;margin-top:.35rem;font-variant-numeric:tabular-nums;}
.mx-lista{margin-top:.8rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:.35rem;text-align:left;}
.mx-fx{display:flex;align-items:center;gap:.35rem;padding:.35rem;border-radius:13px;}
.mx-fx.on{background:rgba(227,43,109,.18);}
.mx-fx-play{width:38px;height:38px;flex:none;border-radius:11px;border:0;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font:800 .9rem Inter,sans-serif;}
.mx-fx.on .mx-fx-play{background:#E32B6D;}
.mx-eq{display:none;align-items:flex-end;gap:2px;height:14px;}
.mx-eq i{width:3px;background:#fff;border-radius:1px;animation:mxeq .8s ease-in-out infinite;}
.mx-eq i:nth-child(2){animation-delay:-.3s}.mx-eq i:nth-child(3){animation-delay:-.55s}
@keyframes mxeq{0%,100%{height:4px}50%{height:14px}}
.mx-fx.tocando .mx-n{display:none}.mx-fx.tocando .mx-eq{display:flex}
.mx-fx-tx{flex:1;min-width:0;border:0;background:none;color:inherit;text-align:left;padding:.2rem .3rem;cursor:pointer;font-family:inherit;}
.mx-fx-tx b{display:block;font-size:.88rem;color:#fff;}
.mx-fx-tx span{display:block;font-size:.74rem;color:#B99BA8;}
.mx-fx-dl{width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#FFE3A3;background:rgba(233,185,79,.12);border:1px solid rgba(233,185,79,.35);}
.mx-fx-dl svg{width:17px;height:17px;fill:currentColor;}
.mx-acoes{display:flex;gap:.5rem;margin-top:1rem;}
.mx-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.85rem 1rem;border-radius:100px;font:800 .88rem Inter,sans-serif;color:#fff;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);cursor:pointer;}
.mx-btn svg{width:17px;height:17px;fill:currentColor;}
.mx-btn-ouro{background:linear-gradient(180deg,#FFE3A3,#E9B94F 60%,#C99530);color:#3A0A1E;border:0;box-shadow:0 10px 24px rgba(233,185,79,.3);}
.mx-btn-zap{background:#1FAF5F;border:0;}
.mx-btn-rosa{background:linear-gradient(180deg,#FF6BA3,#E32B6D);border:0;box-shadow:0 10px 24px rgba(227,43,109,.45);}
.mx-dica{font-size:.72rem;color:#B99BA8;margin-top:.7rem;line-height:1.5;}
.mx-letra{margin-top:.8rem;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:.7rem .9rem;}
.mx-letra summary{cursor:pointer;font-weight:800;font-size:.85rem;color:#FFE3A3;}
.mx-letra pre{white-space:pre-wrap;font-family:Fraunces,Georgia,serif;font-size:.92rem;line-height:1.75;color:#F3E2EA;margin:.6rem 0 0;}
.mx-share,.mx-ind,.mx-devolva{margin-top:1.3rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:1rem;}
.mx-share>b,.mx-ind>b,.mx-devolva>b{display:block;font-size:1rem;color:#fff;}
.mx-share>span,.mx-ind>span,.mx-devolva>span{display:block;font-size:.8rem;color:#D8BFCB;margin:.3rem 0 .75rem;line-height:1.5;}
.mx-share-row{display:flex;gap:.5rem;}
.mx-ind{border-color:rgba(31,175,95,.4);background:linear-gradient(160deg,rgba(31,175,95,.12),rgba(255,255,255,.04));}
.mx-ind-top{display:inline-block;font-size:.7rem;font-weight:800;color:#0E3B22;background:#6BE8AB;padding:.2rem .65rem;border-radius:100px;margin-bottom:.5rem;}
.mx-ind-ganhou{font-size:.9rem;color:#6BE8AB;margin-bottom:.6rem;}
.mx-ind-num{font-size:.8rem;color:#6BE8AB;margin-bottom:.6rem;}
.mx-ind-st .mx-btn{width:100%;margin-bottom:.6rem;}
.mx-devolva{border-color:rgba(227,43,109,.45);background:linear-gradient(160deg,rgba(227,43,109,.18),rgba(255,255,255,.04));}
.mx-dv-ic{font-size:2rem;}
.mx-devolva .mx-btn{width:100%;}
.mx-devolva small{display:block;font-size:.72rem;color:#B99BA8;margin-top:.55rem;}
.mx-rodape{display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:.74rem;color:#9C7F8B;margin-top:1.6rem;}
.mx-rodape img{width:22px;height:22px;object-fit:contain;}
.mx-rodape b{color:#E3C6D2;}

  padding:.8rem 1.3rem;border-radius:100px;font-size:.85rem;font-weight:600;z-index:200;opacity:0;
  pointer-events:none;transition:all .3s var(--ease);box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;}

/* ================= APRESENTAÇÃO (O PRESENTE) ================= */
#gift{--gbg:#120A0F;}
.g-scope{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--gbg);
  color:#fff;z-index:100;-webkit-overflow-scrolling:touch;}
.g-scope h1,.g-scope h2,.g-scope h3{color:#fff;}

/* --- PORTÃO / ENVELOPE --- */
.gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.4rem;text-align:center;z-index:120;overflow:hidden;
  background:radial-gradient(ellipse at 50% 22%,#3A1424 0%,#170A11 62%,#0B0508 100%);}
.gate.hide{animation:gateOut .85s var(--ease) forwards;}
@keyframes gateOut{to{opacity:0;transform:scale(1.14);visibility:hidden;}}
.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.sp{position:absolute;border-radius:50%;background:#FFD9E6;opacity:0;animation:spk linear infinite;}
@keyframes spk{0%{opacity:0;transform:translateY(0) scale(.4);}18%{opacity:.9;}100%{opacity:0;transform:translateY(-115vh) scale(1.1);}}
.hflt{position:absolute;bottom:-8%;opacity:0;animation:hfloat linear infinite;pointer-events:none;}
.hflt svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 0 6px currentColor);}
@keyframes hfloat{0%{opacity:0;transform:translateY(0) translateX(0) rotate(-8deg) scale(.6);}
  12%{opacity:.85;}50%{transform:translateY(-58vh) translateX(14px) rotate(8deg) scale(1);}
  88%{opacity:.7;}100%{opacity:0;transform:translateY(-108vh) translateX(-10px) rotate(-6deg) scale(.8);}}
.gate-m{width:64px;margin-bottom:1rem;opacity:0;animation:fadeUp .7s var(--ease) .1s forwards;}
.gate-eb{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#FF9EC2;font-weight:800;
  margin-bottom:.9rem;opacity:0;animation:fadeUp .7s var(--ease) .25s forwards;}
.gate-t{font-family:'Fraunces';font-style:italic;font-weight:600;font-size:clamp(1.6rem,7.4vw,2.5rem);
  line-height:1.2;max-width:20rem;margin-bottom:.7rem;opacity:0;animation:fadeUp .8s var(--ease) .4s forwards;}
.gate-t b{font-style:normal;color:#FF9EC2;font-weight:600;}
.gate-s{font-size:.9rem;color:#C6A9B6;margin-bottom:2rem;opacity:0;animation:fadeUp .8s var(--ease) .55s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

.env{width:min(240px,66vw);aspect-ratio:1.5;position:relative;margin-bottom:2.1rem;cursor:pointer;
  opacity:0;animation:fadeUp .8s var(--ease) .7s forwards, envFloat 3.4s ease-in-out 1.6s infinite;
  transform-style:preserve-3d;}
@keyframes envFloat{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-11px) rotate(1.5deg);}}
.env-body{position:absolute;inset:0;background:linear-gradient(160deg,#FFF3F7,#FBDCE7);border-radius:9px;
  box-shadow:0 22px 48px rgba(0,0,0,.5),inset 0 -2px 0 rgba(181,18,78,.12);overflow:hidden;}
.env-body::after{content:"";position:absolute;bottom:0;left:0;right:0;height:64%;
  background:linear-gradient(180deg,#FCE4ED,#F6C8DA);clip-path:polygon(0 34%,50% 0,100% 34%,100% 100%,0 100%);}
.env-flap{position:absolute;top:0;left:0;right:0;height:62%;background:linear-gradient(180deg,#FBD4E3,#F3B9CF);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .95s var(--ease);
  z-index:4;box-shadow:0 3px 9px rgba(181,18,78,.13);}
.env.open .env-flap{transform:rotateX(178deg);}
.env-seal{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#F5548C,#B5124E);display:flex;align-items:center;justify-content:center;
  z-index:6;box-shadow:0 5px 14px rgba(0,0,0,.36);transition:all .5s var(--ease);}
.env-seal svg{width:24px;height:24px;fill:#fff;}
.env.open .env-seal{opacity:0;transform:translate(-50%,-50%) scale(.4);}
.env-letter{position:absolute;left:7%;right:7%;top:12%;height:78%;background:#FFFDFB;border-radius:5px;
  z-index:3;transform:translateY(14%);transition:transform 1s var(--ease) .35s;
  box-shadow:0 5px 16px rgba(0,0,0,.2);padding:1rem;}
.env.open .env-letter{transform:translateY(-64%) scale(1.04);}
.env-letter i{display:block;height:5px;background:var(--rose-soft);border-radius:4px;margin-bottom:.5rem;}
.env-letter i:nth-child(1){width:64%;} .env-letter i:nth-child(2){width:92%;}
.env-letter i:nth-child(3){width:80%;} .env-letter i:nth-child(4){width:44%;background:#F8D0DF;}

.gate-btn{background:linear-gradient(135deg,#F0417E,#D01A5C);color:#fff;font-weight:800;font-size:1rem;
  padding:1.1rem 2.4rem;border-radius:100px;box-shadow:0 14px 34px rgba(227,43,109,.45);
  opacity:0;animation:fadeUp .8s var(--ease) .85s forwards;position:relative;overflow:hidden;}
.gate-btn::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);animation:shine 2.8s ease-in-out 1.5s infinite;}
@keyframes shine{0%{left:-60%;}55%,100%{left:130%;}}

/* --- INTRO CINEMÁTICA --- */
.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem;text-align:center;z-index:118;
  background:radial-gradient(ellipse at 50% 42%,#3A1424 0%,#150912 66%,#0A0508 100%);}
.intro-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem;opacity:0;pointer-events:none;transition:opacity .6s var(--ease);}
.intro-slide.on{opacity:1;pointer-events:auto;}
.is-eb{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#FF9EC2;font-weight:800;margin-bottom:1.1rem;}
.is-big{font-family:'Fraunces';font-weight:600;font-size:clamp(3.6rem,22vw,8rem);line-height:.94;
  background:linear-gradient(90deg,#FF7FAB,#FFD9E6,#E32B6D,#FFB3CF,#FF7FAB);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:isBigGlow 3.2s linear infinite, isBigPop .7s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(0 0 18px rgba(255,127,171,.45));}
@keyframes isBigGlow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
@keyframes isBigPop{0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
.is-lbl{font-size:1rem;color:#D9BEC9;margin-top:.7rem;font-weight:600;}
.is-txt{font-family:'Fraunces';font-style:italic;font-size:clamp(1.5rem,6.4vw,2.3rem);line-height:1.3;
  max-width:20rem;font-weight:500;}
.is-names{font-family:'Grand Hotel',cursive;font-size:clamp(2.6rem,12vw,4.4rem);color:#FF9EC2;line-height:1.15;}
.is-sub{font-size:.92rem;color:#C6A9B6;margin-top:1.1rem;line-height:1.6;max-width:22rem;}
.is-foto-wrap{width:min(230px,60vw);aspect-ratio:.8;background:#fff;padding:9px 9px 26px;
  box-shadow:0 22px 54px rgba(0,0,0,.55);transform:scale(.85) rotate(-3deg);opacity:0;
  animation:isFotoIn .85s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes isFotoIn{to{transform:scale(1) rotate(-2deg);opacity:1;}}
.is-foto-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.is-foto-cap{font-family:'Fraunces';font-style:italic;text-align:center;margin-top:.9rem;color:#fff;font-size:1rem;}
.is-foto-dt{font-size:.74rem;text-align:center;color:#C6A9B6;margin-top:.2rem;}
.is-medidor-heart{position:relative;width:min(170px,44vw);aspect-ratio:1;margin:0 auto;}
.is-medidor-heart img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 40px rgba(255,60,120,.65)) drop-shadow(0 18px 34px rgba(0,0,0,.6));
  animation:mdbeat 1.6s ease-in-out infinite;}
.wordwave span{display:inline-block;opacity:0;animation:wwIn .6s var(--ease) forwards;}
@keyframes wwIn{from{opacity:0;transform:translateY(22px) rotate(5deg);}to{opacity:1;transform:none;}}
.intro-dots{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);display:flex;gap:.4rem;}
.intro-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.24);transition:all .3s;}
.intro-dots i.on{background:var(--rose);width:20px;border-radius:100px;}
.tap-hint{position:absolute;bottom:4.2rem;left:50%;transform:translateX(-50%);font-size:.76rem;color:#8E7280;
  letter-spacing:.08em;animation:pulseo 2s ease-in-out infinite;white-space:nowrap;}
@keyframes pulseo{0%,100%{opacity:.45;}50%{opacity:1;}}
.skip-intro{position:absolute;top:1.2rem;right:1.2rem;font-size:.76rem;font-weight:700;color:#8E7280;
  padding:.5rem .9rem;border-radius:100px;border:1px solid rgba(255,255,255,.14);z-index:5;}

/* --- CORPO DO PRESENTE --- */
.g-body{padding-bottom:4rem;}
.g-hero{position:relative;padding:3.4rem 1.4rem 2.6rem;text-align:center;overflow:hidden;
  background-color:#0D0206;background-image:radial-gradient(ellipse at 50% 0%,#3A1424,transparent 70%);}
.g-hero-poster{padding:1.1rem 1.1rem 2rem;text-align:left;}

.g-poster-foto img{width:100%;height:100%;object-fit:cover;display:block;}
.g-poster-foto.tocavel{cursor:pointer;}
.g-poster-info{padding:1.4rem .3rem 0;animation:gpIn .8s var(--ease) .12s both;}
.g-poster-info .g-names{font-family:'Grand Hotel',cursive;font-size:clamp(2.1rem,10vw,3rem);

.g-poster-info .g-title{font-family:'Fraunces';font-style:italic;color:#fff;font-size:1.02rem;
  margin-top:.35rem;text-align:left;opacity:.94;}
.g-poster-desde{margin-top:1rem;}
.g-poster-desde span{display:block;font-size:.6rem;letter-spacing:.19em;text-transform:uppercase;
  color:#9C8590;font-weight:800;}
.g-poster-desde b{display:block;font-size:1.05rem;color:#fff;font-weight:700;margin-top:.16rem;}
.g-hero-poster .g-place{justify-content:flex-start;margin-top:.7rem;}
.g-hero-poster .g-hero-dica{text-align:left;margin-top:.9rem;}
.g-poster-foto .g-hero-ping{bottom:10px;right:10px;}
.g-hero-cover{width:min(190px,52vw);aspect-ratio:1;border-radius:50%;margin:0 auto 1.5rem;overflow:hidden;

.g-hero-cover img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #1A0810;display:block;}
.g-hero-cover.tocavel{position:relative;cursor:pointer;}
.g-hero-ping{position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:50%;

  animation:pfPing 2.2s ease-out infinite;}
@keyframes pfPing{0%{box-shadow:0 0 0 0 rgba(227,43,109,.55);}70%{box-shadow:0 0 0 12px rgba(227,43,109,0);}100%{box-shadow:0 0 0 0 rgba(227,43,109,0);}}
.g-hero-dica{font-size:.68rem;color:#C6A9B6;margin-top:.7rem;opacity:.8;}

/* tela ao vivo: corpo responsivo (celular em pé / notebook deitado) */
.av-tela{width:100vw !important;}
.av-corpo{flex:1;display:flex;flex-direction:column;gap:1.6vh;min-height:0;position:relative;z-index:1;}
.av-lado{display:flex;flex-direction:column;gap:1.4vh;min-width:0;}
.av-fila-box{display:flex;flex-direction:column;gap:1vh;}
.av-ag{display:flex;flex-direction:column;align-items:center;width:100%;}
.av-info{display:flex;flex-direction:column;align-items:center;width:100%;}
.av-topo{position:relative;z-index:2;}
.av-notas{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.av-notas i{position:absolute;bottom:-8vh;font-style:normal;color:rgba(240,201,135,.18);font-size:5vh;animation:avSobe 14s linear infinite;}
.av-notas i:nth-child(1){left:6%;animation-delay:0s}.av-notas i:nth-child(2){left:22%;animation-delay:3s;font-size:3.6vh}
.av-notas i:nth-child(3){left:41%;animation-delay:7s;color:rgba(227,43,109,.22)}.av-notas i:nth-child(4){left:63%;animation-delay:1.5s;font-size:4vh}
.av-notas i:nth-child(5){left:80%;animation-delay:5s}.av-notas i:nth-child(6){left:93%;animation-delay:9s;color:rgba(227,43,109,.22);font-size:3.4vh}
@keyframes avSobe{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media (max-aspect-ratio:1/1){
  .av-tela{padding:max(2.4vh,env(safe-area-inset-top)) 4vw 2.4vh;}
  .av-tela{gap:1.2vh;}
  .av-corpo{gap:1.2vh;}
  .av-tocando{margin-bottom:1vh;}
  .av-capa{width:min(26vh,62vw);height:min(26vh,62vw);}
  .av-dedic{margin-top:1.4vh;}
  .av-para{font-size:min(4.4vh,9vw);}
  .av-barra{margin-top:1.4vh;}
  .av-fila .av-item:nth-child(n+3){display:none;}
  .av-item{padding:.8vh 1.2vh;}
}
@media (min-aspect-ratio:1/1){
  .av-tela{padding:3.4vh 3.4vw;gap:3vh;background:radial-gradient(70% 90% at 30% 10%,#5A1438 0%,#2A0D1F 55%,#170812 100%);}
  .av-topo img{width:7vh;height:7vh;}
  .av-topo b{font-size:3.2vh;}
  .av-topo span{font-size:1.8vh;}
  .av-live{font-size:2vh;padding:.8vh 1.8vh;}
  .av-corpo{flex-direction:row;gap:2.6vw;}
  .av-agora{flex:1.6;min-width:0;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:3.4vh;padding:4vh 3vw;align-items:stretch;}
  .av-tocando{font-size:2vh;text-align:left;margin-bottom:3vh;}
  .av-ag{flex-direction:row;align-items:center;gap:3.4vw;flex:1;min-height:0;}
  .av-capa{width:min(52vh,24vw);height:min(52vh,24vw);flex-shrink:0;border-radius:3vh;}
  .av-info{align-items:flex-start;text-align:left;min-width:0;}
  .av-dedic{margin-top:0;font-size:2.4vh;}
  .av-para{font-size:min(9vh,5vw);margin:.8vh 0 1.4vh;word-break:break-word;}
  .av-quem{font-size:2.6vh;}
  .av-chips{justify-content:flex-start;gap:1vh;margin-top:2vh;}
  .av-chips span{font-size:1.8vh;padding:.7vh 1.5vh;}
  .av-barra{width:100%;height:1vh;margin-top:3.4vh;}
  .av-tempo{width:100%;font-size:1.8vh;margin-top:.8vh;}
  .av-lado{flex:1;justify-content:space-between;gap:2.4vh;}
  .av-fila-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:3vh;padding:2.6vh 1.6vw;flex:1;min-height:0;overflow:hidden;gap:1.4vh;}
  .av-fila-t{font-size:2vh;}
  .av-fila{gap:1.2vh;}
  .av-item{padding:1.3vh 1.2vw;border-radius:1.8vh;gap:1.2vw;}
  .av-i-ic{font-size:2.6vh;}
  .av-i-tx b{font-size:2.2vh;}
  .av-i-tx small{font-size:1.7vh;}
  .av-item em{font-size:1.5vh;padding:.4vh 1vh;}
  .av-fila-vazia{font-size:2.2vh;padding:3vh 1vh;}
  .av-cta{padding:2.4vh 1.6vw;border-radius:2.6vh;}
  .av-cta b{font-size:3vh;}
  .av-cta span{font-size:1.8vh;}
  .av-cta em{font-size:2.6vh;padding:.9vh 2.2vh;margin-top:1.2vh;}
  .av-banner{left:28vw;right:28vw;top:3vh;font-size:2.3vh;padding:1.8vh 2vh;z-index:4;}
  .av-vazio{margin:auto;}
  .av-disco{width:30vh;height:30vh;}
  .av-disco img{width:12vh;height:12vh;}
  .av-vazio b{font-size:3.4vh;}
  .av-vazio span{font-size:2.2vh;}
  .av-start button{font-size:3vh;padding:2vh 4vh;}
  .av-start small{font-size:1.9vh;}
}
