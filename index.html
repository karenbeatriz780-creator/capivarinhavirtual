<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E32B6D">
<title>Capivarinha Love — presentes digitais que emocionam</title>
<meta name="description" content="Transforme suas fotos e memórias em um presente digital que emociona de verdade. Pronto em 2 minutos, enviado por link.">
<meta property="og:title" content="Capivarinha Love — presentes que emocionam">
<meta property="og:description" content="Suas fotos e memórias viram um presente feito do seu jeito, pronto para enviar.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Grand+Hotel&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF; --paper:#FFF7F9; --tint:#FFF1F6; --line:#F1E4E8;
  --plum:#161113; --ink:#1E1418; --muted:#857D80; --muted-2:#A9A0A4;
  --rose:#E32B6D; --rose-deep:#B5124E; --rose-soft:#FCE4ED; --rose-1:#FF7FAB;
  --gold:#E8B44A; --gold-deep:#B8860B;
  --pad: clamp(1.15rem, 5vw, 2.5rem);
  --maxw: 74rem;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --shadow-sm:0 2px 10px rgba(22,17,19,.05);
  --shadow-md:0 10px 30px rgba(181,18,78,.10);
  --shadow-lg:0 24px 60px rgba(181,18,78,.16);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--white); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4,.display{font-family:'Fraunces',Georgia,serif;letter-spacing:-.02em;color:var(--plum);line-height:1.1;}
.script{font-family:'Grand Hotel',cursive;font-weight:400;letter-spacing:0;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:4px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.shell{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);}

/* ============ BOTÕES ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
  font-weight:700;font-size:.95rem;border-radius:100px;padding:1rem 1.6rem;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s;
  line-height:1;white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#F0417E,#D01A5C);color:#fff;box-shadow:0 10px 26px rgba(227,43,109,.32);}
.btn-primary:hover{box-shadow:0 14px 34px rgba(227,43,109,.42);transform:translateY(-2px);}
.btn-primary:disabled{background:var(--line);color:var(--muted-2);box-shadow:none;cursor:not-allowed;transform:none;}
.btn-ghost{background:#fff;color:var(--rose-deep);box-shadow:0 2px 12px rgba(22,17,19,.07);border:1.5px solid var(--rose-soft);}
.btn-ghost:hover{border-color:var(--rose);}
.btn-dark{background:var(--plum);color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:1.15rem 1.9rem;font-size:1rem;}
.btn svg{width:18px;height:18px;flex-shrink:0;}

/* ============ ANNOUNCEMENT + HEADER ============ */
.announce{
  background:linear-gradient(90deg,#E32B6D,#F0417E,#E32B6D);
  background-size:200% 100%;animation:slidebg 12s linear infinite;
  color:#fff;text-align:center;padding:.8rem var(--pad);font-size:.86rem;line-height:1.45;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
@keyframes slidebg{to{background-position:200% 0;}}
.announce b{font-weight:800;}
.announce svg{width:15px;height:15px;fill:#fff;flex-shrink:0;}
header.site{
  position:sticky;top:0;z-index:60;background:#FFFCFD;
  border-bottom:1px solid var(--line);
  transform:translateZ(0);will-change:transform;
}
.hd{display:flex;align-items:center;justify-content:space-between;padding-top:.85rem;padding-bottom:.85rem;}
.logo{display:flex;align-items:center;gap:.6rem;}
.logo img{width:44px;height:44px;object-fit:contain;}
.logo .wm{font-family:'Fraunces';font-weight:700;font-size:1.42rem;letter-spacing:-.03em;color:var(--plum);display:flex;align-items:center;gap:.1rem;}
.logo .wm i{font-style:normal;color:var(--rose);}
.logo .wm svg{width:14px;height:14px;fill:var(--rose);margin-left:.15rem;margin-top:-.5rem;}
.nav{display:flex;align-items:center;gap:1.6rem;}
.nav a{font-size:.9rem;font-weight:600;color:var(--ink);transition:color .15s;}
.nav a:hover{color:var(--rose);}
.burger{width:40px;height:40px;display:none;align-items:center;justify-content:center;color:var(--rose);}
.burger svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;}
@media(max-width:860px){
  .nav{position:absolute;top:calc(100% + .6rem);right:var(--pad);
    background:#fff;flex-direction:column;align-items:stretch;gap:0;
    padding:.5rem 1.05rem;border-radius:var(--r-lg);border:1px solid var(--line);
    box-shadow:var(--shadow-lg);width:max-content;min-width:12rem;
    max-width:min(17rem,calc(100vw - 2*var(--pad)));
    opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transform-origin:top right;
    transition:opacity .2s var(--ease),transform .2s var(--ease),visibility 0s linear .2s;z-index:59;}
  .nav.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);
    transition:opacity .2s var(--ease),transform .2s var(--ease);}
  .nav a{padding:.85rem .15rem;border-bottom:1px solid var(--line);font-size:.96rem;white-space:nowrap;}
  .nav a:last-child{border-bottom:none;}
  .burger{display:flex;position:relative;z-index:61;}
}

/* ============ HERO ============ */
.hero{position:relative;background:linear-gradient(180deg,#FFF6F9 0%,#FFFFFF 78%);overflow:hidden;}
.hero-blob{position:absolute;top:-10%;right:-16%;width:min(58vw,640px);aspect-ratio:1;
  background:radial-gradient(circle at 40% 40%,#FDD9E6,#FCE9F0 60%,transparent 72%);
  border-radius:48% 52% 44% 56%/56% 44% 56% 44%;animation:blob 18s ease-in-out infinite;pointer-events:none;}
@keyframes blob{0%,100%{border-radius:48% 52% 44% 56%/56% 44% 56% 44%;transform:rotate(0);}50%{border-radius:56% 44% 58% 42%/42% 58% 42% 58%;transform:rotate(8deg);}}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:2.5rem;align-items:center;padding-top:3.2rem;padding-bottom:2.6rem;position:relative;z-index:2;}
@media(max-width:860px){.hero-in{grid-template-columns:1fr;gap:1.4rem;padding-top:2rem;padding-bottom:1.6rem;}}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5rem;background:#fff;border:1.5px solid var(--rose-soft);
  color:var(--rose-deep);font-size:.79rem;font-weight:700;padding:.6rem 1.05rem;border-radius:100px;
  box-shadow:var(--shadow-sm);margin-bottom:1.4rem;
}
.eyebrow svg{width:15px;height:15px;stroke:var(--rose);fill:none;stroke-width:2;}
h1.hero-t{font-size:clamp(2.05rem,7.6vw,3.55rem);font-weight:700;line-height:1.12;padding-right:.12em;}
h1.hero-t .l2{display:block;position:relative;width:fit-content;max-width:96%;margin-top:.18em;}
h1.hero-t .script{color:var(--rose);font-size:1.02em;line-height:1.25;padding-right:.1em;}
.underline-sw{display:block;width:78%;height:12px;margin-top:-.3em;margin-left:8%;}
.underline-sw path{fill:none;stroke:var(--rose-1);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.1s var(--ease) .55s forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.heart-pop{display:inline-flex;vertical-align:.08em;width:26px;margin-left:.4rem;
  animation:hb 2.4s ease-in-out infinite;}
.heart-pop svg{width:100%;fill:none;stroke:var(--rose);stroke-width:2.2;}
@keyframes hb{0%,100%{transform:scale(1) rotate(-6deg);}50%{transform:scale(1.16) rotate(6deg);}}
@media(max-width:520px){.heart-pop{width:20px;margin-left:.3rem;}}
@media(max-width:600px){:root{--pad:1.65rem;} .hero-in{padding-top:1.7rem;}}
.hero-sub{font-size:clamp(.98rem,2.4vw,1.14rem);color:#5C5457;line-height:1.72;margin:1.7rem 4% 2.1rem 0;max-width:29rem;}
.hero-cta{display:flex;flex-wrap:wrap;gap:.9rem;}
.hero-cta .btn{flex:1 1 15rem;}
.hero-art{position:relative;display:flex;justify-content:center;}
.hero-art>img{width:min(100%,420px);filter:drop-shadow(0 26px 44px rgba(181,18,78,.22));animation:float 6s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-16px) rotate(1deg);}}
.hart{position:absolute;pointer-events:none;opacity:.85;}
.hart svg{fill:var(--rose-1);}
.hart.h1{top:6%;right:4%;width:30px;animation:float 5s ease-in-out infinite .3s;}
.hart.h2{bottom:16%;left:2%;width:22px;animation:float 6.5s ease-in-out infinite .9s;}
.hart.h3{top:44%;right:-1%;width:16px;animation:float 4.4s ease-in-out infinite 1.4s;}
@media(max-width:860px){.hero-art{order:-1;}.hero-art>img{width:min(70%,280px);}}

/* trust row */
.trust{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-md);overflow:hidden;margin:.6rem 0 0;}
.trust-i{display:flex;align-items:center;gap:.75rem;padding:1.1rem 1rem;}
.trust-i+.trust-i{border-left:1px solid var(--line);}
.trust-i svg{width:26px;height:26px;stroke:var(--rose);fill:none;stroke-width:1.8;flex-shrink:0;}
.trust-i b{display:block;font-size:.88rem;font-weight:800;color:var(--plum);line-height:1.25;}
.trust-i span{font-size:.79rem;color:var(--muted);}
@media(max-width:640px){
  .trust{grid-template-columns:1fr;}
  .trust-i+.trust-i{border-left:none;border-top:1px solid var(--line);}
  .trust-i{padding:.85rem 1rem;}
}

/* ============ SEÇÕES ============ */
.sec{padding:clamp(3.2rem,8vw,5.6rem) 0;}
.sec-tint{background:linear-gradient(180deg,#FFF7F9,#FFFFFF);}
.sec-plum{background:var(--plum);color:#fff;}
.sec-plum h2,.sec-plum h3{color:#fff;}
.sec-head{text-align:center;max-width:38rem;margin:0 auto clamp(2rem,5vw,3rem);}
.kicker{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rose);margin-bottom:.9rem;}
.sec-head h2{font-size:clamp(1.85rem,5vw,2.7rem);font-weight:600;}
.sec-head h2 em{font-family:'Grand Hotel',cursive;font-style:normal;color:var(--rose);font-size:1.15em;}
.sec-head p{margin-top:.95rem;color:var(--muted);font-size:clamp(.95rem,2.2vw,1.03rem);line-height:1.6;}
.sec-plum .sec-head p{color:#C9BCC1;}

/* preview tabs + telefone */
.tabs{display:flex;gap:.55rem;background:var(--tint);padding:.45rem;border-radius:100px;
  width:fit-content;max-width:100%;margin:0 auto 2rem;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{display:flex;align-items:center;gap:.5rem;padding:.72rem 1.15rem;border-radius:100px;
  font-size:.86rem;font-weight:700;color:var(--muted);white-space:nowrap;transition:all .2s var(--ease);}
.tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
.tab.on{background:var(--rose);color:#fff;box-shadow:0 6px 18px rgba(227,43,109,.3);}
.phone-stage{display:flex;justify-content:center;position:relative;padding:1rem 0 0;}
.phone{
  width:min(310px,80vw);aspect-ratio:9/18.4;background:#0B0709;border-radius:44px;
  padding:11px;box-shadow:0 30px 70px rgba(22,17,19,.3),0 0 0 2px #2A2226;position:relative;flex-shrink:0;
}
.phone::before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);
  width:78px;height:20px;background:#0B0709;border-radius:100px;z-index:6;}
.phone-scr{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#fff;position:relative;}
.phone-scr iframe{width:100%;height:100%;border:0;}

/* ============ COMO FUNCIONA ============ */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;}
@media(max-width:820px){.steps{grid-template-columns:1fr;}}
.step-c{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:1.8rem 1.5rem;
  position:relative;transition:transform .25s var(--ease),box-shadow .25s var(--ease);}
.step-c:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);}
.step-n{font-family:'Fraunces';font-size:2.6rem;font-weight:600;color:var(--rose-soft);line-height:1;margin-bottom:.5rem;}
.step-c h3{font-size:1.14rem;font-weight:600;margin-bottom:.5rem;}
.step-c p{font-size:.92rem;color:var(--muted);line-height:1.6;}

/* ============ PACOTES ============ */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(15.5rem,1fr));gap:1.15rem;align-items:stretch;}
.plan{
  background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:1.6rem 1.4rem 1.5rem;
  display:flex;flex-direction:column;position:relative;transition:all .25s var(--ease);
}
.plan:hover{border-color:var(--rose-1);transform:translateY(-4px);box-shadow:var(--shadow-md);}
.plan.feat{border-color:var(--rose);box-shadow:0 18px 44px rgba(227,43,109,.16);background:linear-gradient(180deg,#FFF7FA,#fff);}
.plan .rib{position:absolute;top:-.75rem;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;
  font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:.35rem .85rem;border-radius:100px;white-space:nowrap;}
.plan .ico{width:44px;height:44px;border-radius:13px;background:var(--rose-soft);display:flex;align-items:center;
  justify-content:center;font-size:1.35rem;margin-bottom:.9rem;}
.plan h3{font-size:1.16rem;font-weight:600;}
.plan .dur{font-size:.76rem;font-weight:700;color:var(--rose-deep);margin-top:.25rem;text-transform:uppercase;letter-spacing:.05em;}
.plan .pr{font-family:'Fraunces';font-size:2.3rem;font-weight:600;color:var(--plum);margin:.7rem 0 .1rem;line-height:1;}
.plan .pr sup{font-size:.95rem;font-weight:500;vertical-align:.85em;margin-right:.1em;}
.plan .pr small{display:block;font-family:'Inter';font-size:.75rem;font-weight:500;color:var(--muted);margin-top:.4rem;}
.plan ul{list-style:none;margin:1.1rem 0 1.4rem;display:flex;flex-direction:column;gap:.55rem;flex:1;}
.plan li{display:flex;gap:.55rem;font-size:.87rem;color:#4B4245;line-height:1.45;align-items:flex-start;}
.plan li svg{width:15px;height:15px;stroke:var(--rose);fill:none;stroke-width:3;flex-shrink:0;margin-top:.15rem;}
.plan li.off{color:var(--muted-2);}
.plan li.off svg{stroke:var(--muted-2);}

/* ============ DEPOIMENTOS ============ */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1.1rem;}
.rev{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:1.5rem 1.4rem;
  display:flex;flex-direction:column;box-shadow:var(--shadow-sm);}
.rev-top{display:flex;align-items:center;gap:.85rem;margin-bottom:.9rem;}
.rev-av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2.5px solid var(--rose-soft);flex-shrink:0;background:var(--rose-soft);}
.rev-av-ph{display:flex;align-items:center;justify-content:center;font-family:'Fraunces';font-weight:600;
  font-size:1.15rem;color:var(--rose-deep);}
.rev-nm{font-weight:800;font-size:.94rem;color:var(--plum);display:flex;align-items:center;gap:.35rem;}
.rev-nm svg{width:14px;height:14px;fill:var(--rose);flex-shrink:0;}
.rev-meta{font-size:.76rem;color:var(--muted);margin-top:.1rem;}
.stars{display:flex;gap:2px;margin-bottom:.7rem;}
.stars svg{width:15px;height:15px;fill:var(--gold);}
.rev p{font-size:.92rem;color:#4B4245;line-height:1.62;flex:1;}
.rev .del{margin-top:.9rem;align-self:flex-start;font-size:.74rem;font-weight:700;color:var(--muted-2);}
.rev .del:hover{color:var(--rose-deep);}
.rating-sum{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:1.6rem;flex-wrap:wrap;}
.rating-sum .big{font-family:'Fraunces';font-size:2.5rem;font-weight:600;color:var(--plum);line-height:1;}
.rating-sum .lbl{font-size:.85rem;color:var(--muted);}

/* ============ FAQ ============ */
.faq{max-width:44rem;margin:0 auto;}
.qa{border-bottom:1px solid var(--line);}
.qa summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 0;
  font-weight:700;font-size:1rem;color:var(--plum);cursor:pointer;list-style:none;}
.qa summary::-webkit-details-marker{display:none;}
.qa summary svg{width:20px;height:20px;stroke:var(--rose);stroke-width:2.2;fill:none;flex-shrink:0;transition:transform .25s var(--ease);}
.qa[open] summary svg{transform:rotate(45deg);}
.qa .a{padding:0 0 1.35rem;font-size:.93rem;color:var(--muted);line-height:1.68;max-width:38rem;}

/* ============ PRIVACIDADE ============ */
.privacy{display:flex;align-items:center;justify-content:center;gap:1rem;background:var(--tint);
  border:1px solid var(--rose-soft);border-radius:var(--r-lg);padding:1.15rem 1.4rem;text-align:center;
  flex-wrap:wrap;margin-top:2rem;}
.privacy svg{width:26px;height:26px;stroke:var(--rose);fill:none;stroke-width:1.8;}
.privacy b{display:block;color:var(--rose-deep);font-size:.94rem;font-weight:800;}
.privacy span{font-size:.83rem;color:var(--muted);}

/* ============ FOOTER ============ */
footer.site{background:var(--plum);color:#C9BCC1;padding:3.2rem 0 2rem;}
.ft{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2rem;}
@media(max-width:760px){.ft{grid-template-columns:1fr;gap:1.6rem;}}
.ft .logo .wm{color:#fff;}
.ft p{font-size:.88rem;line-height:1.65;margin-top:.9rem;max-width:22rem;}
.ft h4{color:#fff;font-family:'Inter';font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.9rem;}
.ft a{display:block;font-size:.88rem;padding:.32rem 0;transition:color .15s;}
.ft a:hover{color:var(--rose-1);}
.ft-bot{border-top:1px solid rgba(255,255,255,.1);margin-top:2.4rem;padding-top:1.4rem;
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:#8E8085;}

/* botão flutuante */
.fab{position:fixed;right:1.1rem;bottom:1.1rem;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#F0417E,#D01A5C);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 30px rgba(227,43,109,.42);z-index:55;transition:transform .2s var(--ease);}
.fab:hover{transform:scale(1.08);}
.fab svg{width:26px;height:26px;fill:#fff;}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--rose);
  animation:ring 2.4s ease-out infinite;}
@keyframes ring{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.55);opacity:0;}}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.rv.in{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .rv{opacity:1;transform:none;}
  html{scroll-behavior:auto;}
}
</style>
<style>

/* ================= WIZARD ================= */
.wz-top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:.8rem var(--pad);display:flex;align-items:center;gap:.85rem;}
.wz-back{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;border-radius:50%;}
.wz-back:hover{background:var(--tint);}
.wz-back svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;}
.wz-track{flex:1;height:5px;background:var(--line);border-radius:5px;overflow:hidden;}
.wz-fill{height:100%;background:linear-gradient(90deg,#F0417E,#D01A5C);border-radius:5px;transition:width .45s var(--ease);}
.wz-count{font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap;}
.wz-wrap{max-width:32rem;margin:0 auto;padding:1.7rem var(--pad) 8.5rem;min-height:60vh;}
.wz-bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:.85rem var(--pad) calc(.85rem + env(safe-area-inset-bottom));z-index:50;}
.wz-bottom-in{max-width:32rem;margin:0 auto;}
.wz-skip{display:block;text-align:center;font-size:.78rem;color:var(--muted);margin-top:.6rem;font-weight:600;}

.guide{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:1.5rem;}
.guide-m{position:relative;width:52px;flex-shrink:0;}
.guide-m img{width:100%;animation:nod 3s ease-in-out infinite;}
@keyframes nod{0%,100%{transform:rotate(-3deg) translateY(0);}50%{transform:rotate(3deg) translateY(-3px);}}
.guide-b{background:var(--paper);border:1px solid var(--rose-soft);border-radius:4px 15px 15px 15px;
  padding:.8rem 1rem;font-size:.9rem;font-weight:500;line-height:1.5;min-height:1.4em;flex:1;}
.guide-b .cur{display:inline-block;width:2px;height:.9em;background:var(--rose);vertical-align:-2px;animation:blink .85s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

.wz-t{font-size:1.55rem;font-weight:600;margin-bottom:.4rem;}
.wz-s{font-size:.89rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.5;}
.field{margin-bottom:1.05rem;}
.field label{display:block;font-size:.78rem;font-weight:800;color:var(--plum);margin-bottom:.42rem;}
.field .hint{font-size:.75rem;font-weight:500;color:var(--muted);margin-top:.35rem;}
.inp{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:.82rem .95rem;
  font-size:.94rem;background:#fff;outline:none;transition:border-color .18s,box-shadow .18s;}
.inp:focus{border-color:var(--rose);box-shadow:0 0 0 3.5px var(--rose-soft);}
.inp.erro{border-color:#D9534F;background:#FFF8F8;}
.inp.erro:focus{border-color:#D9534F;box-shadow:0 0 0 3.5px rgba(217,83,79,.14);}
.msg-erro{display:flex;align-items:center;gap:.4rem;color:#C0392B;font-size:.78rem;
  font-weight:700;margin-top:.4rem;animation:erroIn .25s var(--ease);}
.msg-erro .ic{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  border-radius:50%;background:#C0392B;color:#fff;font-size:.68rem;flex-shrink:0;font-weight:800;}
@keyframes erroIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
textarea.inp{resize:vertical;min-height:7rem;line-height:1.6;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
.dt{background:var(--rose-soft);border:1.5px solid var(--rose-soft);border-radius:var(--r-md);padding:.8rem 1rem;margin-bottom:.75rem;}
.dt label{display:block;font-size:.7rem;font-weight:800;color:var(--rose-deep);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;}
.dt input{width:100%;border:none;background:transparent;font-size:1.05rem;font-weight:700;color:var(--plum);
  outline:none;font-family:'Fraunces',serif;accent-color:var(--rose);}

.pick{display:flex;flex-direction:column;gap:.8rem;}
.pick-rica{gap:1.2rem;}
.pk{border:1.5px solid var(--line);border-radius:var(--r-md);padding:1.15rem 1.25rem;background:#fff;
  transition:all .2s var(--ease);text-align:left;width:100%;position:relative;}
.pk:hover{border-color:var(--rose-1);}
.pk.on{border-color:var(--rose);background:var(--rose-soft);}
.pk .tg{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--rose-deep);}
.pk h3{font-size:1.03rem;font-weight:600;margin:.28rem 0 .3rem;}
.pk .pp{font-family:'Fraunces';font-size:1.42rem;font-weight:600;color:var(--rose-deep);margin:.2rem 0;}
.pk .pp span{font-size:.72rem;font-weight:500;color:var(--muted);font-family:'Inter';}
.pk p{font-size:.83rem;color:var(--muted);line-height:1.45;}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-md);padding:1rem .4rem;text-align:center;transition:all .2s;}
.chip svg{width:22px;height:22px;margin-bottom:.45rem;stroke:var(--ink);fill:none;stroke-width:1.9;}
.chip .lb{font-size:.76rem;font-weight:700;}
.chip:hover{border-color:var(--rose-1);}
.chip.on{background:var(--rose);border-color:var(--rose);}
.chip.on svg{stroke:#fff;}
.chip.on .lb{color:#fff;}

.sug-h{display:flex;align-items:center;justify-content:space-between;margin:1.2rem 0 .7rem;}
.sug-h .lb{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.regen{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:800;color:var(--rose-deep);
  background:var(--rose-soft);padding:.45rem .85rem;border-radius:100px;}
.regen:hover{background:var(--rose);color:#fff;}
.regen svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;}
.sug-list{display:flex;flex-direction:column;gap:.5rem;}
.sug{display:flex;gap:.6rem;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;
  padding:.75rem .9rem;font-size:.87rem;line-height:1.5;text-align:left;background:#fff;
  animation:sugIn .35s var(--ease) backwards;transition:all .18s;}
.sug:hover{border-color:var(--rose);background:var(--tint);}
.sug.on{border-color:var(--rose);background:var(--rose-soft);}
.sug svg{width:13px;height:13px;fill:var(--rose);flex-shrink:0;margin-top:.28rem;}
@keyframes sugIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}

/* fotos */
.ph-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;}
.ph{position:relative;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:var(--r-md);
  background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.35rem;color:var(--muted-2);overflow:hidden;transition:border-color .2s;}
.ph:hover{border-color:var(--rose-1);}
.ph.full{border-style:solid;border-color:var(--rose-soft);}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ph .n{position:absolute;top:.4rem;left:.4rem;width:22px;height:22px;border-radius:50%;background:rgba(22,17,19,.62);
  color:#fff;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2;}
.ph .rm{position:absolute;top:.4rem;right:.4rem;width:24px;height:24px;border-radius:50%;background:rgba(22,17,19,.66);
  color:#fff;display:flex;align-items:center;justify-content:center;z-index:3;font-size:.9rem;line-height:1;}
.ph svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}
.ph .lb{font-size:.72rem;font-weight:600;}
.ph-meta{margin-top:.45rem;display:flex;flex-direction:column;gap:.35rem;}
.ph-meta input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:.5rem .65rem;font-size:.79rem;outline:none;}
.ph-datalb{font-size:.7rem;font-weight:800;color:var(--muted);margin-top:.1rem;}
.ph-datalb span{font-weight:500;color:var(--muted-2);}
.ph-meta input:focus{border-color:var(--rose);}
.ph-dt{position:relative;display:block;}
.ph-dt span{display:block;border:1.5px dashed var(--line);border-radius:9px;padding:.5rem .65rem;
  font-size:.79rem;color:var(--muted-2);font-weight:600;background:#fff;}
.ph-dt.full span{border-style:solid;border-color:var(--rose-soft);color:var(--rose-deep);}
.ph-dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;padding:0;}
.ph-item{display:flex;flex-direction:column;}
.upload-all{margin-top:.9rem;}

/* extras toggles */
.ex-list{display:flex;flex-direction:column;gap:.65rem;}
.ex{display:flex;align-items:center;gap:.8rem;border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:.9rem 1rem;transition:all .18s;text-align:left;width:100%;}
.ex.on{border-color:var(--rose);background:var(--rose-soft);}
.ex .ic{width:36px;height:36px;border-radius:10px;background:var(--plum);color:#fff;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;font-size:1.05rem;}
.ex.on .ic{background:var(--rose);}
.ex .tx{flex:1;min-width:0;}
.ex .tx h4{font-size:.88rem;font-weight:800;color:var(--plum);}
.ex .tx p{font-size:.76rem;color:var(--muted);margin-top:.12rem;line-height:1.35;}
.ex .tgl{width:40px;height:23px;border-radius:100px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s;}
.ex.on .tgl{background:var(--rose);}
.ex .tgl::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:left .2s var(--ease);}
.ex.on .tgl::after{left:19px;}
.cfg{background:var(--paper);border:1px solid var(--rose-soft);border-radius:var(--r-md);padding:1rem;margin-top:.6rem;}
.cfg .lb{font-size:.73rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--rose-deep);margin-bottom:.5rem;}
.cfg .lb+.lb{margin-top:.95rem;}
.row-inp{display:flex;gap:.5rem;align-items:center;margin-bottom:.45rem;}
.row-inp .inp{padding:.6rem .75rem;font-size:.85rem;}
.row-x{width:30px;height:30px;border-radius:8px;background:var(--rose-soft);color:var(--rose-deep);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem;line-height:1;}
.add-row{font-size:.79rem;font-weight:800;color:var(--rose-deep);display:inline-flex;align-items:center;gap:.35rem;margin-top:.3rem;}

/* checkout */
.sum{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:1.05rem 1.15rem;margin-bottom:1.2rem;}
.sum-r{display:flex;justify-content:space-between;gap:1rem;font-size:.86rem;padding:.35rem 0;color:#4B4245;}
.sum-r.tot{border-top:1px solid var(--line);margin-top:.45rem;padding-top:.75rem;font-weight:800;color:var(--plum);font-size:1rem;}
.pay-tabs{display:flex;gap:.55rem;margin-bottom:1rem;}
.pay-tab{flex:1;text-align:center;padding:.78rem;border:1.5px solid var(--line);border-radius:11px;font-weight:700;font-size:.86rem;transition:all .18s;}
.pay-tab.on{border-color:var(--rose);background:var(--rose-soft);color:var(--rose-deep);}
.qrbox{text-align:center;padding:1.5rem 1rem;background:var(--paper);border-radius:var(--r-md);border:1px solid var(--line);}
.qrbox .qr{width:180px;height:180px;margin:0 auto 1rem;background:#fff;padding:9px;border-radius:12px;box-shadow:var(--shadow-sm);}
.qrbox .qr svg{width:100%;height:100%;display:block;}
.pix-code{display:flex;gap:.5rem;margin-top:.9rem;}
.pix-code input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:.6rem .7rem;font-size:.74rem;
  font-family:ui-monospace,monospace;background:#fff;overflow:hidden;text-overflow:ellipsis;}
.demo-note{background:#FFF8E6;border:1px solid #F5E2B0;border-radius:12px;padding:.85rem 1rem;
  font-size:.8rem;color:#7A5B12;line-height:1.5;margin-top:1rem;display:flex;gap:.55rem;}
.demo-note svg{width:17px;height:17px;stroke:#B8860B;fill:none;stroke-width:2;flex-shrink:0;margin-top:.1rem;}
.demo-note.info{background:#EEF6FF;border-color:#C7DEFA;color:#2A5B8C;}
.demo-note.info svg{stroke:#3B7CC4;}
.demo-note.info b{color:#1D4E7A;}
.demo-note.error{background:#FDECEC;border-color:#F3B9B9;color:#8C2A2A;margin-top:1rem;}
.demo-note.error svg{stroke:#C0392B;}
.demo-note.error b{color:#8C2A2A;}

/* sucesso / meus presentes */
.done{text-align:center;padding:1rem 0 0;}
.done-ic{width:76px;height:76px;border-radius:50%;background:var(--rose-soft);display:flex;align-items:center;
  justify-content:center;margin:0 auto 1.2rem;animation:pop .55s var(--ease);}
.done-ic svg{width:38px;height:38px;stroke:var(--rose);fill:none;stroke-width:2.6;}
@keyframes pop{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.link-box{display:flex;gap:.5rem;margin:1.2rem 0 .6rem;}
.link-box input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:11px;padding:.75rem .85rem;
  font-size:.82rem;background:var(--paper);}
.share-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.6rem;margin-top:1rem;}
.share-b{display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.8rem .5rem;border-radius:12px;
  border:1.5px solid var(--line);font-size:.83rem;font-weight:700;background:#fff;transition:all .18s;}
.share-b:hover{border-color:var(--rose);color:var(--rose-deep);}
.share-b svg{width:16px;height:16px;}
.gift-list{display:flex;flex-direction:column;gap:.85rem;}
.gcard{border:1.5px solid var(--line);border-radius:var(--r-md);padding:1.1rem 1.15rem;background:#fff;}
.gcard-top{display:flex;align-items:center;gap:.8rem;}
.gcard-th{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--rose-soft);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
.gcard h4{font-size:.97rem;font-weight:700;}
.gcard .mt{font-size:.76rem;color:var(--muted);margin-top:.15rem;}
.gcard .acts{display:flex;gap:.45rem;margin-top:.9rem;flex-wrap:wrap;}
.gcard .acts button{font-size:.78rem;font-weight:700;padding:.5rem .85rem;border-radius:100px;border:1.5px solid var(--line);background:#fff;}
.gcard .acts button:hover{border-color:var(--rose);color:var(--rose-deep);}
.pillbadge{font-size:.66rem;font-weight:800;padding:.22rem .55rem;border-radius:100px;text-transform:uppercase;letter-spacing:.05em;}
.pb-live{background:#E6F7EE;color:#0D7A44;}
.pb-exp{background:#FCE8E8;color:#B23030;}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);}
.empty img{width:110px;margin:0 auto 1.2rem;opacity:.85;}

.kit{margin-top:2.2rem;text-align:left;border-top:1px solid var(--line);padding-top:1.6rem;}
.kit-topo{display:flex;gap:.7rem;align-items:flex-start;margin-bottom:1.5rem;
  background:linear-gradient(160deg,#FFF6FA,#FFEDF4);border:1.5px solid var(--rose-soft);
  border-radius:var(--r-lg);padding:1.05rem 1.1rem;}
.kit-topo svg{width:22px;height:22px;stroke:var(--rose-deep);fill:none;stroke-width:2;flex-shrink:0;margin-top:.1rem;}
.kit-topo b{display:block;font-size:.95rem;color:var(--rose-deep);}
.kit-topo span{display:block;font-size:.82rem;color:var(--muted);line-height:1.45;margin-top:.15rem;}
.mv-previa{border:1.5px solid var(--line);border-radius:var(--r-md);padding:.7rem;
  background:var(--paper);display:flex;justify-content:center;}
.mv-previa canvas{width:100%;max-width:15rem;height:auto;border-radius:6px;
  box-shadow:0 6px 18px rgba(120,40,70,.16);}

/* extras pagos — cartões com prévia */
.ex-sec{margin-bottom:2.1rem;}
.ex-sec-h{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;}
.ex-sec-h h3{font-size:1.06rem;font-weight:700;}
.ex-preco-tag{font-size:.74rem;font-weight:800;color:var(--rose-deep);
  background:var(--rose-soft);padding:.28rem .7rem;border-radius:100px;white-space:nowrap;}
.ex-sec p{font-size:.85rem;color:var(--muted);line-height:1.5;margin:.35rem 0 .9rem;}
.ex-carrossel{display:flex;gap:.75rem;overflow-x:auto;padding:.2rem .1rem .7rem;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.ex-carrossel::-webkit-scrollbar{height:5px;}
.ex-carrossel::-webkit-scrollbar-thumb{background:var(--rose-soft);border-radius:5px;}
.ex-card{flex:0 0 auto;width:9.6rem;scroll-snap-align:start;display:flex;flex-direction:column;gap:.45rem;}
.ex-card-art{position:relative;border-radius:12px;overflow:hidden;background:#fff;
  box-shadow:0 5px 18px rgba(120,40,70,.16);border:1px solid var(--line);}
.ex-card-art canvas{width:100%;height:auto;display:block;}
.ex-selo{position:absolute;top:.4rem;left:.4rem;font-size:.6rem;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;padding:.24rem .5rem;border-radius:100px;
  background:#2BB673;color:#fff;}
.ex-selo.previa{background:rgba(22,17,19,.62);}
.ex-card-nome{font-size:.83rem;font-weight:800;color:var(--plum);text-align:center;line-height:1.2;}
.ex-btn{padding:.6rem .5rem;font-size:.82rem;border-radius:100px;}
.ex-card.comprado .ex-card-art{border-color:#2BB673;}
.mv-tira{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;}
.mv-tira button{flex:0 0 auto;width:64px;height:64px;border-radius:11px;overflow:hidden;
  border:2px solid var(--line);background:#fff;}
.mv-tira button:hover{border-color:var(--rose);}
.mv-tira img{width:100%;height:100%;object-fit:cover;}

/* toast */
.toast{position:fixed;left:50%;bottom:5.6rem;transform:translate(-50%,20px);background:var(--plum);color:#fff;
  padding:.8rem 1.3rem;border-radius:100px;font-size:.85rem;font-weight:600;z-index:200;opacity:0;
  pointer-events:none;transition:all .3s var(--ease);box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ================= APRESENTAÇÃO (O PRESENTE) ================= */
#gift{--gbg:#120A0F;}
.g-scope{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--gbg);
  color:#fff;z-index:100;-webkit-overflow-scrolling:touch;}
.g-scope h1,.g-scope h2,.g-scope h3{color:#fff;}

/* --- PORTÃO / ENVELOPE --- */
.gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.4rem;text-align:center;z-index:120;overflow:hidden;
  background:radial-gradient(ellipse at 50% 22%,#3A1424 0%,#170A11 62%,#0B0508 100%);}
.gate.hide{animation:gateOut .85s var(--ease) forwards;}
@keyframes gateOut{to{opacity:0;transform:scale(1.14);visibility:hidden;}}
.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.sp{position:absolute;border-radius:50%;background:#FFD9E6;opacity:0;animation:spk linear infinite;}
@keyframes spk{0%{opacity:0;transform:translateY(0) scale(.4);}18%{opacity:.9;}100%{opacity:0;transform:translateY(-115vh) scale(1.1);}}
.hflt{position:absolute;bottom:-8%;opacity:0;animation:hfloat linear infinite;pointer-events:none;}
.hflt svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 0 6px currentColor);}
@keyframes hfloat{0%{opacity:0;transform:translateY(0) translateX(0) rotate(-8deg) scale(.6);}
  12%{opacity:.85;}50%{transform:translateY(-58vh) translateX(14px) rotate(8deg) scale(1);}
  88%{opacity:.7;}100%{opacity:0;transform:translateY(-108vh) translateX(-10px) rotate(-6deg) scale(.8);}}
.gate-m{width:64px;margin-bottom:1rem;opacity:0;animation:fadeUp .7s var(--ease) .1s forwards;}
.gate-eb{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#FF9EC2;font-weight:800;
  margin-bottom:.9rem;opacity:0;animation:fadeUp .7s var(--ease) .25s forwards;}
.gate-t{font-family:'Fraunces';font-style:italic;font-weight:600;font-size:clamp(1.6rem,7.4vw,2.5rem);
  line-height:1.2;max-width:20rem;margin-bottom:.7rem;opacity:0;animation:fadeUp .8s var(--ease) .4s forwards;}
.gate-t b{font-style:normal;color:#FF9EC2;font-weight:600;}
.gate-s{font-size:.9rem;color:#C6A9B6;margin-bottom:2rem;opacity:0;animation:fadeUp .8s var(--ease) .55s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

.env{width:min(240px,66vw);aspect-ratio:1.5;position:relative;margin-bottom:2.1rem;cursor:pointer;
  opacity:0;animation:fadeUp .8s var(--ease) .7s forwards, envFloat 3.4s ease-in-out 1.6s infinite;
  transform-style:preserve-3d;}
@keyframes envFloat{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-11px) rotate(1.5deg);}}
.env-body{position:absolute;inset:0;background:linear-gradient(160deg,#FFF3F7,#FBDCE7);border-radius:9px;
  box-shadow:0 22px 48px rgba(0,0,0,.5),inset 0 -2px 0 rgba(181,18,78,.12);overflow:hidden;}
.env-body::after{content:"";position:absolute;bottom:0;left:0;right:0;height:64%;
  background:linear-gradient(180deg,#FCE4ED,#F6C8DA);clip-path:polygon(0 34%,50% 0,100% 34%,100% 100%,0 100%);}
.env-flap{position:absolute;top:0;left:0;right:0;height:62%;background:linear-gradient(180deg,#FBD4E3,#F3B9CF);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .95s var(--ease);
  z-index:4;box-shadow:0 3px 9px rgba(181,18,78,.13);}
.env.open .env-flap{transform:rotateX(178deg);}
.env-seal{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#F5548C,#B5124E);display:flex;align-items:center;justify-content:center;
  z-index:6;box-shadow:0 5px 14px rgba(0,0,0,.36);transition:all .5s var(--ease);}
.env-seal svg{width:24px;height:24px;fill:#fff;}
.env.open .env-seal{opacity:0;transform:translate(-50%,-50%) scale(.4);}
.env-letter{position:absolute;left:7%;right:7%;top:12%;height:78%;background:#FFFDFB;border-radius:5px;
  z-index:3;transform:translateY(14%);transition:transform 1s var(--ease) .35s;
  box-shadow:0 5px 16px rgba(0,0,0,.2);padding:1rem;}
.env.open .env-letter{transform:translateY(-64%) scale(1.04);}
.env-letter i{display:block;height:5px;background:var(--rose-soft);border-radius:4px;margin-bottom:.5rem;}
.env-letter i:nth-child(1){width:64%;} .env-letter i:nth-child(2){width:92%;}
.env-letter i:nth-child(3){width:80%;} .env-letter i:nth-child(4){width:44%;background:#F8D0DF;}

.gate-btn{background:linear-gradient(135deg,#F0417E,#D01A5C);color:#fff;font-weight:800;font-size:1rem;
  padding:1.1rem 2.4rem;border-radius:100px;box-shadow:0 14px 34px rgba(227,43,109,.45);
  opacity:0;animation:fadeUp .8s var(--ease) .85s forwards;position:relative;overflow:hidden;}
.gate-btn::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);animation:shine 2.8s ease-in-out 1.5s infinite;}
@keyframes shine{0%{left:-60%;}55%,100%{left:130%;}}

/* --- INTRO CINEMÁTICA --- */
.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem;text-align:center;z-index:118;
  background:radial-gradient(ellipse at 50% 42%,#3A1424 0%,#150912 66%,#0A0508 100%);}
.intro-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem;opacity:0;pointer-events:none;transition:opacity .6s var(--ease);}
.intro-slide.on{opacity:1;pointer-events:auto;}
.is-eb{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#FF9EC2;font-weight:800;margin-bottom:1.1rem;}
.is-big{font-family:'Fraunces';font-weight:600;font-size:clamp(3.6rem,22vw,8rem);line-height:.94;
  background:linear-gradient(90deg,#FF7FAB,#FFD9E6,#E32B6D,#FFB3CF,#FF7FAB);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:isBigGlow 3.2s linear infinite, isBigPop .7s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(0 0 18px rgba(255,127,171,.45));}
@keyframes isBigGlow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
@keyframes isBigPop{0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
.is-lbl{font-size:1rem;color:#D9BEC9;margin-top:.7rem;font-weight:600;}
.is-txt{font-family:'Fraunces';font-style:italic;font-size:clamp(1.5rem,6.4vw,2.3rem);line-height:1.3;
  max-width:20rem;font-weight:500;}
.is-names{font-family:'Grand Hotel',cursive;font-size:clamp(2.6rem,12vw,4.4rem);color:#FF9EC2;line-height:1.15;}
.is-sub{font-size:.92rem;color:#C6A9B6;margin-top:1.1rem;line-height:1.6;max-width:22rem;}
.is-foto-wrap{width:min(230px,60vw);aspect-ratio:.8;background:#fff;padding:9px 9px 26px;
  box-shadow:0 22px 54px rgba(0,0,0,.55);transform:scale(.85) rotate(-3deg);opacity:0;
  animation:isFotoIn .85s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes isFotoIn{to{transform:scale(1) rotate(-2deg);opacity:1;}}
.is-foto-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.is-foto-cap{font-family:'Fraunces';font-style:italic;text-align:center;margin-top:.9rem;color:#fff;font-size:1rem;}
.is-foto-dt{font-size:.74rem;text-align:center;color:#C6A9B6;margin-top:.2rem;}
.wordwave span{display:inline-block;opacity:0;animation:wwIn .6s var(--ease) forwards;}
@keyframes wwIn{from{opacity:0;transform:translateY(22px) rotate(5deg);}to{opacity:1;transform:none;}}
.intro-dots{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);display:flex;gap:.4rem;}
.intro-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.24);transition:all .3s;}
.intro-dots i.on{background:var(--rose);width:20px;border-radius:100px;}
.tap-hint{position:absolute;bottom:4.2rem;left:50%;transform:translateX(-50%);font-size:.76rem;color:#8E7280;
  letter-spacing:.08em;animation:pulseo 2s ease-in-out infinite;white-space:nowrap;}
@keyframes pulseo{0%,100%{opacity:.45;}50%{opacity:1;}}
.skip-intro{position:absolute;top:1.2rem;right:1.2rem;font-size:.76rem;font-weight:700;color:#8E7280;
  padding:.5rem .9rem;border-radius:100px;border:1px solid rgba(255,255,255,.14);z-index:5;}

/* --- CORPO DO PRESENTE --- */
.g-body{padding-bottom:4rem;}
.g-hero{position:relative;padding:3.4rem 1.4rem 2.6rem;text-align:center;overflow:hidden;
  background-color:#0D0206;background-image:radial-gradient(ellipse at 50% 0%,#3A1424,transparent 70%);}
.g-hero-cover{width:min(190px,52vw);aspect-ratio:1;border-radius:50%;margin:0 auto 1.5rem;overflow:hidden;
  padding:4px;background:linear-gradient(45deg,#FEDA75,#FA7E1E,#E32B6D,#C13584,#833AB4);
  box-shadow:0 22px 52px rgba(227,43,109,.45);}
.g-hero-cover img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #1A0810;display:block;}
.g-hero-cover.tocavel{position:relative;cursor:pointer;}
.g-hero-ping{position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:var(--rose);border:2px solid #1A0810;box-shadow:0 0 0 0 rgba(227,43,109,.6);
  animation:pfPing 2.2s ease-out infinite;}
@keyframes pfPing{0%{box-shadow:0 0 0 0 rgba(227,43,109,.55);}70%{box-shadow:0 0 0 12px rgba(227,43,109,0);}100%{box-shadow:0 0 0 0 rgba(227,43,109,0);}}
.g-hero-dica{font-size:.68rem;color:#C6A9B6;margin-top:.7rem;opacity:.8;}
.perfil-modal{position:fixed;inset:0;z-index:150;background:rgba(10,4,7,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:1.4rem;
  opacity:0;pointer-events:none;transition:opacity .3s ease;}
.perfil-modal.on{opacity:1;pointer-events:auto;}
.perfil-card{background:#FBF4E8;border-radius:22px;padding:2rem 1.6rem 1.6rem;max-width:22rem;width:100%;
  text-align:center;position:relative;transform:scale(.92) translateY(10px);transition:transform .35s cubic-bezier(.2,.8,.2,1);}
.perfil-modal.on .perfil-card{transform:scale(1) translateY(0);}
.perfil-x{position:absolute;top:.7rem;right:.9rem;background:none;border:none;font-size:1.6rem;
  line-height:1;color:#B99BA8;cursor:pointer;}
.perfil-foto{width:88px;height:88px;border-radius:50%;overflow:hidden;margin:0 auto .9rem;
  border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.2);}
.perfil-foto img{width:100%;height:100%;object-fit:cover;display:block;}
.perfil-nomes{font-family:'Grand Hotel',cursive;font-size:1.7rem;color:var(--rose-deep);}
.perfil-desde{font-size:.78rem;color:#8a5468;margin-top:.3rem;}
.perfil-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1.2rem;}
.pf-c{background:linear-gradient(135deg,var(--rose-deep),var(--rose));border-radius:12px;padding:.6rem .3rem;}
.pf-c b{display:block;color:#fff;font-size:1.2rem;font-family:'Fraunces';}
.pf-c span{color:rgba(255,255,255,.85);font-size:.62rem;letter-spacing:.05em;}
.perfil-cidade{margin-top:1rem;font-size:.76rem;color:#8a5468;display:inline-flex;align-items:center;gap:.3rem;}
.perfil-fotos{margin-top:.4rem;font-size:.72rem;color:#B99BA8;}
.g-names{font-family:'Grand Hotel',cursive;font-size:clamp(2.2rem,10vw,3.4rem);color:#FF9EC2;line-height:1.2;}
.g-title{font-family:'Fraunces';font-style:italic;font-size:clamp(1.2rem,5vw,1.7rem);font-weight:500;
  margin-top:.7rem;color:#fff;max-width:24rem;margin-left:auto;margin-right:auto;line-height:1.35;}
.g-since{font-size:.83rem;color:#B99BA8;margin-top:.8rem;}
.g-place{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:#C6A9B6;
  background:rgba(255,255,255,.07);padding:.42rem .9rem;border-radius:100px;margin-top:.9rem;}
.g-place svg{width:13px;height:13px;stroke:#FF9EC2;fill:none;stroke-width:2;}

.g-sec-dark{
  background-color:#0D0206;background-image:radial-gradient(ellipse at 50% 0%,#3A1424,transparent 60%);
  max-width:none;
}
.g-sec-dark .g-sec-h .k{color:var(--rose-1);}
.g-sec-dark .g-sec-h h2{color:#fff;}
.g-sec-dark .g-sec-h p{color:#C6A9B6;}

.g-sec{padding:2.6rem 1.4rem;max-width:36rem;margin:0 auto;}
.g-sec-h{text-align:center;margin-bottom:1.7rem;}
.g-sec-h .k{font-size:.68rem;letter-spacing:.19em;text-transform:uppercase;color:var(--rose);font-weight:800;}
.g-sec-h h2{font-family:'Fraunces';font-size:clamp(1.4rem,5.4vw,1.95rem);font-weight:600;margin-top:.5rem;}
.g-sec-h p{font-size:.87rem;color:#B99BA8;margin-top:.5rem;line-height:1.55;}

/* contador ao vivo */
.ctr{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;}
.ctr-c{border-radius:15px;padding:.95rem .2rem;text-align:center;position:relative;overflow:hidden;}
.ctr-c:nth-child(1){background:linear-gradient(160deg,#F0417E,#B5124E);}
.ctr-c:nth-child(2){background:linear-gradient(160deg,#FF7FAB,#E32B6D);}
.ctr-c:nth-child(3){background:linear-gradient(160deg,#D89B4A,#E32B6D);}
.ctr-c:nth-child(4){background:linear-gradient(160deg,#B5124E,#65102F);}
.ctr-c:nth-child(5){background:linear-gradient(160deg,#E8894A,#B5124E);}
.ctr-c:nth-child(6){background:linear-gradient(160deg,#8E1A6B,#3F0A2C);}
.ctr-c .n{font-family:'Fraunces';font-size:clamp(1.3rem,6vw,1.75rem);font-weight:600;line-height:1;}
.ctr-c .l{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.85);margin-top:.32rem;}
.ctr-live{text-align:center;font-size:.83rem;color:#FF9EC2;font-weight:700;margin-top:1.1rem;}
.ctr-live b{font-family:'Fraunces';font-size:1.15rem;}

/* linha do tempo — polaroids alternando dos dois lados do fio */
.tl{position:relative;padding:0;}
.tl::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,rgba(227,43,109,.15),var(--rose) 12%,var(--rose) 88%,rgba(227,43,109,.15));}
.tl-i{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:center;
  margin-bottom:2.3rem;opacity:0;transform:translateY(26px);transition:all .75s var(--ease);}
.tl-i.in{opacity:1;transform:none;}
.tl-i::before{content:"♥";display:flex;align-items:center;justify-content:center;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:17px;height:17px;border-radius:50%;background:var(--rose);border:3px solid var(--gbg);
  box-shadow:0 0 0 4px rgba(227,43,109,.22);z-index:3;color:#fff;font-size:9px;line-height:1;}
.tl-i:nth-child(odd) .tl-card{grid-column:1;}
.tl-i:nth-child(odd) .tl-txt{grid-column:2;text-align:left;}
.tl-i:nth-child(even) .tl-card{grid-column:2;}
.tl-i:nth-child(even) .tl-txt{grid-column:1;grid-row:1;text-align:right;}

/* o cartãozinho polaroid */
.tl-card{background:#FFFDF9;padding:.55rem .55rem 0;border-radius:3px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);transform:rotate(-2.2deg);
  transition:transform .4s var(--ease);}
.tl-i:nth-child(even) .tl-card{transform:rotate(2.2deg);}
.tl-i:hover .tl-card{transform:rotate(0) scale(1.03);}
.tl-ph{width:100%;aspect-ratio:1;overflow:hidden;background:#EDE3E6;}
.tl-ph img{width:100%;height:100%;object-fit:cover;display:block;}
.tl-hand{font-family:'Grand Hotel',cursive;font-size:1rem;color:#4A3A40;line-height:1.25;
  text-align:center;padding:.5rem .3rem .7rem;min-height:2.4em;
  display:flex;align-items:center;justify-content:center;}
.tl-d{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--rose);margin-bottom:.45rem;}
.tl-c{font-size:.93rem;color:#E6D6DD;line-height:1.6;}
@media(max-width:600px){
  .tl{padding-left:0;}
  .tl::before{left:50%;transform:translateX(-50%);}
  .tl-i{grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.9rem;align-items:start;}
  .tl-i::before{left:50%;top:.5rem;transform:translate(-50%,0);width:13px;height:13px;border-width:2.5px;font-size:7px;}
  .tl-i:nth-child(odd) .tl-card{grid-column:1;padding-right:.2rem;}
  .tl-i:nth-child(odd) .tl-txt{grid-column:2;grid-row:1;text-align:left;padding-left:.7rem;}
  .tl-i:nth-child(even) .tl-card{grid-column:2;padding-left:.2rem;}
  .tl-i:nth-child(even) .tl-txt{grid-column:1;grid-row:1;text-align:right;padding-right:.7rem;}
  .tl-card{max-width:100%;}
  .tl-hand{font-size:.8rem;min-height:2em;padding:.35rem .2rem .5rem;}
  .tl-d{margin-bottom:.15rem;font-size:.66rem;}
  .tl-c{font-size:.76rem;color:#B99BA8;}
}

/* stories */
.st-open{width:100%;border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:4/5;
  background:#251720;box-shadow:var(--shadow-lg);}
.st-open img{width:100%;height:100%;object-fit:cover;opacity:.65;}
.st-open .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.7rem;background:linear-gradient(0deg,rgba(11,5,8,.82),rgba(11,5,8,.24));}
.st-open .ov b{font-family:'Fraunces';font-size:1.2rem;font-weight:600;}
.st-open .ov span{font-size:.83rem;color:#C6A9B6;}
.st-open .pl{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.4);}
.st-open .pl svg{width:24px;height:24px;fill:#fff;margin-left:3px;}
.stories{position:fixed;inset:0;z-index:150;background:#000;display:flex;flex-direction:column;}
.st-bars{position:absolute;top:0;left:0;right:0;display:flex;gap:4px;padding:.85rem .8rem;z-index:8;
  padding-top:calc(.85rem + env(safe-area-inset-top));}
.st-bar{flex:1;height:3px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden;}
.st-bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;}
.st-bar.done i{width:100%;}
.st-bar.now i{animation:stfill linear forwards;}
@keyframes stfill{from{width:0;}to{width:100%;}}
.st-close{position:absolute;top:calc(2.3rem + env(safe-area-inset-top));right:1rem;z-index:9;width:38px;height:38px;
  border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;line-height:1;}
.st-track{flex:1;position:relative;overflow:hidden;}
.st-slide{position:absolute;inset:0;opacity:0;transition:opacity .4s ease;pointer-events:none;}
.st-slide.on{opacity:1;pointer-events:auto;}
.st-slide img{width:100%;height:100%;object-fit:cover;animation:kb 6.5s linear forwards;}
@keyframes kb{from{transform:scale(1.02);}to{transform:scale(1.16);}}
.st-cap{position:absolute;left:0;right:0;bottom:0;padding:5rem 1.4rem calc(2.2rem + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);}
.st-cap .d{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;background:var(--rose);padding:.3rem .7rem;border-radius:100px;margin-bottom:.7rem;}
.st-cap h3{font-family:'Fraunces';font-size:1.35rem;font-weight:600;line-height:1.25;}
.st-cap p{font-size:.9rem;color:#D9C7CE;margin-top:.45rem;line-height:1.55;}
.st-nav{position:absolute;inset:0;display:flex;z-index:6;}
.st-nav b{flex:1;}
.st-hearts{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden;}

/* carta */
.letter-wrap{perspective:1400px;}
.letter{background:linear-gradient(170deg,#FFFCF8,#FDF2E9);border-radius:var(--r-md);padding:2.2rem 1.7rem 1.9rem;
  color:#3B2C31;position:relative;box-shadow:0 26px 64px rgba(0,0,0,.44);overflow:hidden;
  transform-origin:top center;}
.letter.seal-in{animation:letterIn 1.1s var(--ease);}
@keyframes letterIn{0%{transform:rotateX(-88deg) scale(.85);opacity:0;}100%{transform:none;opacity:1;}}
.letter::before{content:"";position:absolute;inset:9px;border:1px solid rgba(227,43,109,.18);border-radius:11px;pointer-events:none;}
.letter-orn{text-align:center;color:var(--rose);margin-bottom:1.2rem;}
.letter-orn svg{width:34px;height:34px;fill:currentColor;}
.letter-to{font-family:'Grand Hotel',cursive;font-size:1.75rem;color:var(--rose-deep);text-align:center;margin-bottom:1.3rem;line-height:1.2;padding-right:60px;}
.letter-tx{font-family:'Fraunces';font-size:1.02rem;line-height:1.85;white-space:pre-wrap;text-align:left;min-height:3em;}
.letter-tx .tw{opacity:0;animation:twIn .5s ease forwards;}
@keyframes twIn{to{opacity:1;}}
.letter-sig{margin-top:1.7rem;text-align:right;padding-right:52px;}
.letter-sig .lb{font-size:.72rem;color:#9A8A90;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
.letter-sig .nm{font-family:'Grand Hotel',cursive;font-size:2rem;color:var(--rose-deep);line-height:1.1;margin-top:.15rem;}
.letter-shine{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.62) 50%,transparent 62%);
  transform:translateX(-100%);animation:lshine 3.6s ease-in-out 1s infinite;}
@keyframes lshine{0%{transform:translateX(-100%);}55%,100%{transform:translateX(100%);}}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.petal{position:absolute;top:-8%;opacity:0;animation:fall linear infinite;}
.petal svg{fill:var(--rose-1);opacity:.5;}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0);}12%{opacity:.75;}100%{opacity:0;transform:translateY(112vh) rotate(420deg);}}

/* player de música */
.mplayer{background:linear-gradient(160deg,#2A1620,#1A0D14);border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-lg);padding:1.3rem;display:flex;gap:1rem;align-items:center;}
.mp-art{width:66px;height:66px;border-radius:13px;object-fit:cover;flex-shrink:0;background:var(--rose-deep);
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.mp-art.spin{animation:spin 8s linear infinite;border-radius:50%;}
@keyframes spin{to{transform:rotate(360deg);}}
.mp-in{flex:1;min-width:0;}
.mp-in .t{font-weight:800;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mp-in .a{font-size:.8rem;color:#B99BA8;margin-top:.1rem;}
.mp-bar{height:4px;background:rgba(255,255,255,.14);border-radius:4px;margin-top:.7rem;overflow:hidden;cursor:pointer;}
.mp-bar i{display:block;height:100%;width:0;background:var(--rose);border-radius:4px;}
.mp-btn{width:46px;height:46px;border-radius:50%;background:var(--rose);color:#fff;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 20px rgba(227,43,109,.4);}
.mp-btn svg{width:19px;height:19px;fill:#fff;}
.mp-time{display:flex;justify-content:space-between;font-size:.68rem;color:#8E7280;margin-top:.35rem;font-variant-numeric:tabular-nums;}

/* avaliação */
.rate-cta{background:linear-gradient(160deg,#2A1620,#1A0D14);border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-lg);padding:1.7rem 1.4rem;text-align:center;}
.rate-stars{display:flex;justify-content:center;gap:.4rem;margin:1rem 0 1.2rem;}
.rate-stars button{width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.rate-stars button:hover{transform:scale(1.18);}
.rate-stars svg{width:32px;height:32px;fill:rgba(255,255,255,.2);transition:fill .15s;}
.rate-stars button.on svg{fill:var(--gold);}
.g-foot{text-align:center;padding:2.4rem 1.4rem 3rem;border-top:1px solid rgba(255,255,255,.08);margin-top:1.5rem;}
.g-foot img{width:52px;margin:0 auto .8rem;opacity:.75;}
.g-foot p{font-size:.8rem;color:#8E7280;line-height:1.6;}
.g-foot a{color:var(--rose-1);font-weight:700;}
.expired{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  text-align:center;padding:2rem;gap:1rem;}
.expired img{width:110px;opacity:.6;}

/* ================= JOGOS ================= */
.game-card{background:linear-gradient(165deg,#2A1620,#160B12);border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-xl);padding:1.5rem 1.2rem 1.7rem;}

/* --- ROLETA CASSINO --- */
.roleta-stage{position:relative;display:flex;flex-direction:column;align-items:center;}
.wheel-box{position:relative;width:min(320px,86vw);aspect-ratio:1;margin:.5rem auto 1.4rem;flex-shrink:0;}
.wheel-rim{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#F6D57A,#B8860B,#FFE9A8,#B8860B,#F6D57A,#8C6209,#FFE9A8,#B8860B,#F6D57A);
  box-shadow:0 0 0 3px #7A5307,0 16px 44px rgba(0,0,0,.6),inset 0 0 22px rgba(0,0,0,.4);}
.bulbs{position:absolute;inset:0;pointer-events:none;}
.bulb{position:absolute;width:9px;height:9px;border-radius:50%;background:#FFF3C4;left:50%;top:50%;
  box-shadow:0 0 7px 2px rgba(255,225,140,.85);animation:bulbBlink 1.1s ease-in-out infinite;}
@keyframes bulbBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
.wheel-svg{position:absolute;top:3%;right:5.6%;bottom:8.2%;left:5.6%;border-radius:50%;overflow:visible;
  transition:transform 5.4s cubic-bezier(.14,.85,.16,1);filter:drop-shadow(0 6px 16px rgba(0,0,0,.45));}
.wheel-svg text{font-family:'Inter',sans-serif;font-weight:800;fill:#fff;
  paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:2.6px;stroke-linejoin:round;}
.wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:19%;height:19%;
  border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFF6DA,#E8B44A 62%,#B8860B);
  display:flex;align-items:center;justify-content:center;z-index:5;
  box-shadow:0 5px 16px rgba(0,0,0,.5),inset 0 -2px 6px rgba(0,0,0,.25);}
.wheel-hub svg{width:46%;height:46%;fill:var(--rose-deep);display:block;transform:translateY(6%);}
.wheel-ptr{position:absolute;top:-3.5%;left:50%;transform:translateX(-50%);z-index:6;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.65));width:11%;}
.wheel-ptr svg{width:100%;display:block;}
.wheel-box.spinning .bulb{animation-duration:.24s;}
.spin-btn{background:linear-gradient(135deg,#F6D57A,#E8B44A 40%,#B8860B);color:#3A2405;font-weight:900;
  font-size:1rem;letter-spacing:.04em;padding:1.05rem 2.2rem;border-radius:100px;text-transform:uppercase;
  box-shadow:0 10px 26px rgba(184,134,11,.45),inset 0 -3px 0 rgba(0,0,0,.16);}
.spin-btn:disabled{filter:grayscale(.7);opacity:.6;}
.prize{margin-top:1.3rem;width:100%;background:linear-gradient(160deg,#3A2405,#241603);
  border:1.5px solid var(--gold);border-radius:var(--r-lg);padding:1.4rem 1.2rem;text-align:center;
  animation:prizeIn .65s var(--ease);position:relative;overflow:hidden;}
@keyframes prizeIn{0%{opacity:0;transform:scale(.82) translateY(14px);}70%{transform:scale(1.03);}100%{opacity:1;transform:none;}}
.prize .k{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;}
.prize .v{font-family:'Fraunces';font-size:clamp(1.5rem,7vw,2.1rem);font-weight:600;color:#FFF3C4;margin:.55rem 0 .3rem;line-height:1.2;}
.prize .d{font-size:.83rem;color:#D9BE86;line-height:1.55;}
.prize .code{display:inline-block;font-family:ui-monospace,monospace;font-size:.82rem;letter-spacing:.18em;
  background:rgba(255,255,255,.09);padding:.45rem .9rem;border-radius:8px;margin-top:.9rem;color:#FFF3C4;}
.prize-acts{display:flex;gap:.55rem;margin-top:1.1rem;flex-wrap:wrap;justify-content:center;}
.prize-acts button{font-size:.82rem;font-weight:800;padding:.72rem 1.15rem;border-radius:100px;}
.claim{background:var(--gold);color:#3A2405;}
.claim.done{background:rgba(255,255,255,.12);color:#D9BE86;}
.shareb{background:#25D366;color:#06301A;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:170;overflow:hidden;}
.cf{position:absolute;width:9px;height:14px;opacity:0;animation:cfall linear forwards;}
@keyframes cfall{0%{opacity:1;transform:translateY(-6vh) rotate(0);}100%{opacity:0;transform:translateY(104vh) rotate(720deg);}}

/* --- CAÇA-PALAVRAS --- */
.ws-wrap{display:flex;flex-direction:column;gap:1rem;}
.ws-grid{display:grid;gap:2px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;
  touch-action:none;user-select:none;-webkit-user-select:none;aspect-ratio:1;}
.ws-c{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);
  border-radius:5px;font-weight:800;color:#E6D6DD;font-size:clamp(.62rem,3vw,.92rem);
  transition:background .12s,color .12s,transform .12s;text-transform:uppercase;}
.ws-c.sel{background:var(--rose);color:#fff;transform:scale(1.07);}
.ws-c.found{background:rgba(232,180,74,.28);color:var(--gold);}
.ws-words{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;}
.ws-w{font-size:.78rem;font-weight:800;padding:.42rem .8rem;border-radius:100px;
  background:rgba(255,255,255,.08);color:#D9C7CE;letter-spacing:.04em;transition:all .25s;}
.ws-w.ok{background:rgba(232,180,74,.2);color:var(--gold);text-decoration:line-through;}
.ws-status{text-align:center;font-size:.85rem;color:#B99BA8;}

/* --- QUEBRA-CABEÇA --- */
.pz-wrap{display:flex;flex-direction:column;gap:.9rem;}
.pz-board{display:grid;gap:3px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;
  position:relative;touch-action:none;}
.pz-cell{position:relative;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden;
  transition:background .15s;}
.pz-cell.hot{background:rgba(227,43,109,.34);box-shadow:inset 0 0 0 2px var(--rose);}
.pz-cell .ghost{position:absolute;inset:0;opacity:.11;background-size:cover;}
.pz-tray{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;background:rgba(255,255,255,.05);
  border:1px dashed rgba(255,255,255,.14);border-radius:14px;padding:.7rem;min-height:5.4rem;touch-action:none;}
.pz-p{border-radius:5px;background-size:cover;cursor:grab;touch-action:none;
  box-shadow:0 3px 9px rgba(0,0,0,.4);transition:transform .16s var(--ease),box-shadow .16s;}
.pz-p:active{cursor:grabbing;}
.pz-p.drag{position:fixed;z-index:180;pointer-events:none;transform:scale(1.13) rotate(2deg);
  box-shadow:0 14px 34px rgba(0,0,0,.6);}
.pz-p.placed{box-shadow:none;border-radius:0;}
.pz-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(11,5,8,.78);backdrop-filter:blur(3px);border-radius:14px;gap:.6rem;animation:fadeUp .6s var(--ease);}
.pz-done b{font-family:'Fraunces';font-size:1.4rem;}
.pz-meta{display:flex;justify-content:space-between;font-size:.8rem;color:#B99BA8;font-weight:700;}

/* --- QUIZ / PERGUNTAS --- */
.qz{display:flex;flex-direction:column;gap:1rem;}
.qz-q{font-family:'Fraunces';font-size:1.15rem;font-weight:600;line-height:1.4;text-align:center;}
.qz-opts{display:flex;flex-direction:column;gap:.55rem;}
.qz-o{border:1.5px solid rgba(255,255,255,.14);border-radius:13px;padding:.85rem 1rem;font-size:.9rem;
  font-weight:600;text-align:left;background:rgba(255,255,255,.04);transition:all .18s;color:#E6D6DD;}
.qz-o:hover{border-color:var(--rose);}
.qz-o.right{border-color:#2BB673;background:rgba(43,182,115,.15);color:#7FE0B0;}
.qz-o.wrong{border-color:#D9534F;background:rgba(217,83,79,.13);color:#F0A6A4;}
.qz-prog{display:flex;gap:4px;justify-content:center;margin-bottom:.3rem;}
.qz-prog i{width:26px;height:4px;border-radius:4px;background:rgba(255,255,255,.16);}
.qz-prog i.on{background:var(--rose);}
.qz-prog i.ok{background:#2BB673;}
.qz-res{text-align:center;padding:1rem 0;}
.qz-res .sc{font-family:'Fraunces';font-size:3rem;font-weight:600;color:var(--rose-1);line-height:1;}

/* --- PALAVRA SECRETA --- */
.sw{text-align:center;}
.sw-boxes{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:1.2rem 0;}
.sw-b{width:2.35rem;height:2.85rem;border-radius:9px;background:rgba(255,255,255,.06);
  border-bottom:2.5px solid var(--rose);display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces';font-size:1.35rem;font-weight:600;text-transform:uppercase;}
.sw-b.rev{background:var(--rose);animation:pop .4s var(--ease);}
.sw-gap{width:1rem;}
.sw-inp{width:100%;max-width:17rem;margin:0 auto;text-align:center;border:1.5px solid rgba(255,255,255,.16);
  border-radius:12px;padding:.85rem;background:rgba(255,255,255,.05);color:#fff;font-weight:700;
  letter-spacing:.06em;outline:none;}
.sw-inp:focus{border-color:var(--rose);}
.sw-inp::placeholder{color:#7A6570;}
.sw-msg{font-size:.87rem;margin-top:.9rem;min-height:1.3em;font-weight:700;}
.sw-msg.ok{color:#7FE0B0;} .sw-msg.no{color:#F0A6A4;}
.sw-hint{font-size:.78rem;color:#8E7280;margin-top:.6rem;}

/* ================= KIT DE IMPRESSÃO (extras) ================= */
.ex-hero{background:linear-gradient(160deg,#FFF3F8,#fff);border:1.5px solid var(--rose-soft);
  border-radius:var(--r-lg);padding:1.3rem 1.2rem;margin-top:1.5rem;}
.ex-hero .tg{display:inline-flex;align-items:center;gap:.35rem;font-size:.66rem;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--rose-deep);background:#fff;
  border:1px solid var(--rose-soft);padding:.3rem .7rem;border-radius:100px;margin-bottom:.7rem;}
.ex-hero h3{font-size:1.1rem;font-weight:600;margin-bottom:.4rem;}
.ex-hero p{font-size:.87rem;color:var(--muted);line-height:1.55;}

.kit-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem;}
.kit-c{border:1.5px solid var(--line);border-radius:var(--r-md);padding:.9rem .8rem;background:#fff;
  text-align:left;transition:all .18s var(--ease);}
.kit-c:hover{border-color:var(--rose-1);}
.kit-c.on{border-color:var(--rose);background:var(--rose-soft);}
.kit-c .ic{font-size:1.5rem;margin-bottom:.35rem;}
.kit-c h4{font-size:.87rem;font-weight:800;color:var(--plum);}
.kit-c p{font-size:.74rem;color:var(--muted);margin-top:.15rem;line-height:1.35;}
.kit-c .pr{font-family:'Fraunces';font-size:1.05rem;font-weight:600;color:var(--rose-deep);margin-top:.4rem;}
.kit-c .lk{font-size:.7rem;font-weight:800;color:#0D7A44;margin-top:.4rem;}

.mold-tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;margin:1rem 0 .8rem;scrollbar-width:none;}
.mold-tabs::-webkit-scrollbar{display:none;}
.mold-t{flex-shrink:0;padding:.55rem .95rem;border-radius:100px;border:1.5px solid var(--line);
  background:#fff;font-size:.78rem;font-weight:700;white-space:nowrap;transition:all .18s;}
.mold-t.on{border-color:var(--rose);background:var(--rose);color:#fff;}
.mold-prev{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
  padding:.9rem;display:flex;justify-content:center;}
.mold-prev canvas{max-width:100%;height:auto;border-radius:6px;box-shadow:0 10px 26px rgba(22,17,19,.16);}
.mold-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem;margin-top:.9rem;}
.mold-slot{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  color:var(--muted-2);overflow:hidden;position:relative;}
.mold-slot.full{border-style:solid;border-color:var(--rose-soft);}
.mold-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.mold-slot .n{position:absolute;top:.25rem;left:.25rem;width:18px;height:18px;border-radius:50%;
  background:rgba(22,17,19,.6);color:#fff;font-size:.6rem;font-weight:800;display:flex;
  align-items:center;justify-content:center;z-index:2;}
.mold-slot svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;}
.mold-slot .lb{font-size:.62rem;font-weight:700;}
.locked{position:relative;}
.locked::after{content:"";position:absolute;inset:0;backdrop-filter:blur(7px);
  background:rgba(255,247,249,.45);border-radius:6px;}
.lock-tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
  background:var(--plum);color:#fff;font-size:.75rem;font-weight:800;padding:.6rem 1.1rem;
  border-radius:100px;display:flex;align-items:center;gap:.4rem;white-space:nowrap;}
.lock-tag svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;}

/* ---------- PRÉVIA NO WIZARD ---------- */
.wz-acoes{display:flex;gap:.6rem;}
.wz-acoes .btn{flex:1;}
.wz-prev{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;flex:0 0 auto!important;
  padding-left:1.1rem;padding-right:1.1rem;}
.wz-prev svg{width:16px;height:16px;}
.prev-bar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;align-items:center;
  justify-content:space-between;gap:.8rem;padding:.85rem 1.1rem;background:rgba(13,2,6,.94);
  backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12);}
.prev-bar span{display:inline-flex;align-items:center;gap:.45rem;color:#fff;font-size:.8rem;font-weight:600;}
.prev-bar svg{width:15px;height:15px;stroke:var(--rose-1);}
.prev-bar button{border:none;cursor:pointer;background:var(--rose);color:#fff;font-weight:700;
  padding:.65rem 1.2rem;border-radius:100px;font-size:.82rem;white-space:nowrap;}
.pk-dur .pp{font-size:1.5rem;font-weight:800;color:var(--rose);margin:.4rem 0 .3rem;}
.prev-vazio{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:2rem;color:#B99BA8;font-size:.95rem;line-height:1.6;max-width:20rem;margin:0 auto;}
.prev-etapa{padding-top:2.5rem;}
.prev-full{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;
  background:var(--rose-soft);color:var(--rose-deep);border:1px dashed var(--rose);border-radius:100px;
  padding:.8rem 1rem;font-size:.84rem;font-weight:700;margin:1.1rem 0 1.5rem;cursor:pointer;}
.prev-full svg{width:15px;height:15px;stroke:var(--rose-deep);flex:none;}

/* ---------- CONVITE CRIATIVO ---------- */
.cv-scope{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;z-index:5;}
.cv-body{max-width:32rem;margin:0 auto;padding:2.4rem 1.3rem 3rem;}
.cv-anim{animation:cvIn .7s var(--ease) both;animation-delay:var(--cvd,0s);}
@keyframes cvIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.cv-hero{text-align:center;}
.cv-ilus{width:150px;margin:0 auto 1.1rem;filter:drop-shadow(0 14px 26px rgba(0,0,0,.35));}
.cv-nome{font-family:'Fraunces';font-weight:800;font-size:clamp(2rem,10vw,2.8rem);line-height:1;}
.cv-idade{font-family:'Fraunces';font-style:italic;font-size:1.2rem;margin-top:.4rem;opacity:.92;}
.cv-conv{font-size:.9rem;line-height:1.6;max-width:22rem;margin:1rem auto 0;opacity:.92;}
.cv-quando{display:flex;gap:.7rem;justify-content:center;margin-top:1.6rem;flex-wrap:wrap;}
.cv-qi{background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:16px;padding:.8rem 1.3rem;text-align:center;min-width:8rem;}
.cv-ql{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;}
.cv-qd{font-family:'Fraunces';font-weight:700;font-size:1.02rem;margin-top:.2rem;}
.cv-btns{display:flex;flex-direction:column;gap:.7rem;margin-top:1.8rem;}
.cv-btn{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.1rem;border-radius:100px;
  font-weight:700;font-size:.88rem;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.22);}
.cv-bic{width:20px;height:20px;flex:none;display:inline-flex;}
.cv-bic svg{width:100%;height:100%;}
.cv-presentes{margin-top:2.2rem;background:rgba(255,255,255,.94);border-radius:22px;padding:1.5rem 1.3rem;}
.cv-presentes h2{font-family:'Fraunces';font-size:1.15rem;color:#2A1620;text-align:center;margin-bottom:1rem;}
.cv-pres-i{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-bottom:1px solid #F1E4E8;color:#3B2C31;font-size:.88rem;}
.cv-pres-i:last-child{border-bottom:none;}
.cv-pres-ic{font-size:1.2rem;flex:none;}

.cv-aranha{background:radial-gradient(ellipse at 50% 0%,#1E3A8A,#050A1A 75%);color:#fff;}
.cv-aranha .cv-btn{background:#E32B6D;color:#fff;}
.cv-aranha .cv-bic svg{fill:#fff;stroke:#fff;}

.cv-savana{background:linear-gradient(180deg,#FBAE4B,#7A3B12 85%);color:#fff;}
.cv-savana .cv-btn{background:#8B4A1E;color:#fff;}
.cv-savana .cv-bic svg{fill:#fff;stroke:#fff;}

.cv-fashion{background:radial-gradient(ellipse at 50% 0%,#FF9FCB,#7A1F52 85%);color:#fff;}
.cv-fashion .cv-btn{background:#fff;color:#B5124E;}
.cv-fashion .cv-bic svg{fill:#B5124E;stroke:#B5124E;}

.pk-tema{overflow:hidden;position:relative;}
.tema-ic{font-size:1.8rem;display:block;margin-bottom:.4rem;}
.tema-aranha.on{border-color:#2C4EA0;background:#EEF2FF;}
.tema-savana.on{border-color:#C97A2E;background:#FFF4E6;}
.tema-fashion.on{border-color:#E85CA0;background:#FFEEF6;}

.pres-i{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;}
.pres-ic{font-size:1.3rem;flex:none;}
.pres-txt{flex:1;}
.pres-emojis{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
.pres-emo{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:1.2rem;cursor:pointer;}

.cv-pdf-btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.3rem;padding:.55rem 1.1rem;
  border-radius:100px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);
  color:inherit;font-size:.76rem;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);}
.cv-pdf-btn svg{width:14px;height:14px;}

@media print{
  .no-print, .prev-bar, .wz-scope, header, .hsparks, .sparks{display:none!important;}
  body, .cv-scope{background:#fff!important;overflow:visible!important;position:static!important;height:auto!important;}
  .cv-scope, .cv-scope *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
  .cv-scope .rv{opacity:1!important;transform:none!important;}
  .cv-body{max-width:100%;padding:.6cm;}
  .cv-btn{box-shadow:none!important;}
  @page{margin:0.6cm;}
}

/* ---------- CARDS DE PACOTE EM BLOCO ---------- */
.planb{position:relative;border-radius:30px;padding:2rem 1.6rem 1.8rem;overflow:hidden;
  display:flex;flex-direction:column;min-height:430px;}
.pb-rib{position:absolute;top:1rem;left:50%;transform:translateX(-50%);background:#1E3A20;color:#fff;
  font-size:.66rem;font-weight:800;letter-spacing:.12em;padding:.5rem 1.1rem;border-radius:100px;
  white-space:nowrap;z-index:3;}
.planb .pb-rib{background:rgba(0,0,0,.55);}
.pb-top{position:relative;z-index:2;}
.pb-t{font-size:clamp(1.6rem,6vw,2.15rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:1.4rem;}
.pb-pr{font-size:.9rem;font-weight:700;margin-top:.5rem;opacity:.85;}
.pb-pr span{font-weight:500;opacity:.7;}

var MEM = {};
var Store = {
  ok:(function(){ try{ var k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })(),
  get:function(k){ try{ return this.ok ? localStorage.getItem(k) : (MEM[k]||null); }catch(e){ return MEM[k]||null; } },
  set:function(k,v){ try{ if(this.ok) localStorage.setItem(k,v); else MEM[k]=v; return true; }
                     catch(e){ MEM[k]=v; return false; } },
  del:function(k){ try{ if(this.ok) localStorage.removeItem(k); }catch(e){} delete MEM[k]; }
};
function jget(k,d){ try{ var v=Store.get(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function jset(k,v){ return Store.set(k,JSON.stringify(v)); }

  var all=presentes(); all[p.id]=p;
  var ok=jset('cl_presentes',all);
  if(!ok){
    var idsAntigoPrimeiro=Object.keys(all).sort(function(a,b){ return (all[a].criadoEm||0)-(all[b].criadoEm||0); });
    while(!ok && idsAntigoPrimeiro.length>1){
      var maisAntigo=idsAntigoPrimeiro.shift();
      delete all[maisAntigo];
      ok=jset('cl_presentes',all);
    }
  }
  if(!ok) toast("Espaço cheio no navegador. Apague um presente antigo em “Meus presentes”.");
  return ok;
}

function comprimir(file, maxLado, q){

  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('leitura')); };
    fr.onload=function(e){
      var img=new Image();
      img.onerror=function(){ rej(new Error('imagem')); };
      img.onload=function(){
        var w=img.width,h=img.height,r=Math.min(1,maxLado/Math.max(w,h));
        var cw=Math.round(w*r), ch=Math.round(h*r);

        var cx=cv.getContext('2d');

    };

  });
