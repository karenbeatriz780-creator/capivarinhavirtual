<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clipe pra Manuela ♥ · Capivarinha Love</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:#120a10}
body{font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.cl{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 22px max(14px,env(safe-area-inset-bottom));overflow:hidden}
.bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.5) brightness(.6);transform:scale(1.2) translateZ(0)}
.bg2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,10,16,.15),rgba(18,10,16,.45) 50%,rgba(18,10,16,.92))}
.cl>*:not(.bg):not(.bg2):not(.hz){position:relative;z-index:2}
.hz{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hz i{position:absolute;bottom:-40px;font-style:normal;color:#FF6FAE;text-shadow:0 0 14px rgba(255,79,154,.8);animation:sobe linear forwards}
@keyframes sobe{to{transform:translate(var(--dx),-115vh) rotate(var(--r));opacity:0}}
.top{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;letter-spacing:.16em;font-weight:700;text-transform:uppercase}
.top .c{text-align:center}.top small{display:block;font-size:13.5px;letter-spacing:0;text-transform:none;font-weight:700;margin-top:3px}
.top .ex{font-size:9.5px;letter-spacing:.12em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:5px 8px;border-radius:999px}
.top .vt{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12)}
.capaw{margin:18px auto 0;width:100%;position:relative}
.capa{width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);background:#2a1622;touch-action:pan-y;cursor:grab}
.capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease;will-change:opacity;pointer-events:none;-webkit-user-drag:none}
.capa img.on{opacity:1}
.capa .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;z-index:2}.capa .dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.5);transition:width .4s}.capa .dots i.on{background:#fff;width:18px}
.glow{position:absolute;inset:-14px;border-radius:22px;background:radial-gradient(closest-side,rgba(255,79,154,.55),transparent);filter:blur(18px);opacity:.0;transition:opacity .15s;z-index:-1}
.info{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:12px}
.info h1{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.1}.info p{font-size:14.5px;opacity:.75;margin-top:4px;font-weight:500}
.cor{animation:bate 1.2s ease-in-out infinite}@keyframes bate{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.eq{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:12px}.eq i{flex:1;border-radius:2px;background:linear-gradient(180deg,#FF8CC0,#FF3E9E);height:100%;transform-origin:50% 100%;transform:scaleY(.12);will-change:transform}
.bar{margin-top:10px}.bar .t{height:4px;border-radius:2px;background:rgba(255,255,255,.25);position:relative;cursor:pointer}.bar .f{position:absolute;left:0;top:0;bottom:0;width:100%!important;border-radius:2px;background:#fff;transform-origin:0 50%;will-change:transform}
.bar .k{position:absolute;top:-4px;left:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;will-change:transform}
.bar .tm{display:flex;justify-content:space-between;font-size:11.5px;opacity:.7;margin-top:7px;font-weight:500}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.play{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ded{margin-top:14px;border-radius:16px;padding:14px 16px;background:linear-gradient(160deg,rgba(226,52,126,.92),rgba(155,29,99,.92));flex:1;min-height:70px;overflow:hidden;display:flex;flex-direction:column}
.ded h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:8px}
.ded p{font-family:Lora,serif;font-style:italic;font-size:18px;line-height:1.45;overflow:hidden;flex:1;min-height:0}
.ded p .cur{display:inline-block;width:2px;height:1em;background:#fff;margin-left:2px;vertical-align:-2px;animation:pisca .8s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.acoes{margin-top:12px;display:flex;gap:10px}
.acoes button{flex:1;font-weight:700;font-size:14px;padding:13px 10px;border-radius:999px;background:#fff;color:#9B1D63}
.acoes button.s{background:rgba(255,255,255,.14);color:#fff;flex:.6}
.marca{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;opacity:.6;margin-top:10px}.marca img{height:18px}
/* tela de entrada */
.ent{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:rgba(14,6,12,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .6s}
.ent.fora{opacity:0;pointer-events:none}
.ent .k{font-size:11px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;opacity:.8}
.ent h2{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:10px 0 6px}
.ent h2 em{font-style:normal;background:linear-gradient(90deg,#FF8CC0,#FF3E9E,#C77DFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.ent p{font-size:15px;opacity:.85;max-width:300px;line-height:1.45}
.ent .pb{margin-top:30px;width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#FF4F9A,#C2187A);display:grid;place-items:center;position:relative;box-shadow:0 0 0 0 rgba(255,79,154,.6);animation:pulso 1.6s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,79,154,.65)}70%{box-shadow:0 0 0 34px rgba(255,79,154,0)}100%{box-shadow:0 0 0 0 rgba(255,79,154,0)}}
.ent .pb svg{margin-left:8px}
.ent small{display:block;margin-top:16px;font-size:13px;opacity:.75;font-weight:700}
.ent .mini{display:flex;gap:6px;margin-top:22px}.ent .mini img{width:44px;height:44px;border-radius:10px;object-fit:cover;border:2px solid rgba(255,255,255,.7)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#fff;color:#5B2148;font-weight:700;font-size:13.5px;padding:12px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:.3s;z-index:30;width:max-content;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-height:700px){.capaw{width:78%}.ded p{font-size:16px}}
</style></head><body>
<div class="cl" id="cl">
 <div class="bg" id="bg"></div><div class="bg2"></div><div class="hz" id="hz"></div>
 <div class="top"><button class="vt" id="voltar" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="c">Tocando pra você<small>Manuela ♥</small></div><span class="ex">Exemplo</span></div>
 <div class="capaw"><div class="glow" id="glow"></div><div class="capa" id="capa"><div class="dots" id="dots"></div></div></div>
 <div class="info"><div><h1>Música pra Manuela</h1><p>Rafael · sertanejo romântico</p></div>
  <svg class="cor" width="32" height="32" viewBox="0 0 24 24" fill="#FF4F9A"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg></div>
 <div class="eq" id="eq"></div>
 <div class="bar"><div class="t" id="trk"><div class="f" id="fill" style="transform:scaleX(0)"></div><div class="k" id="knob"></div></div><div class="tm"><span id="cur">0:00</span><span id="dur">-1:35</span></div></div>
 <div class="ctl">
  <button aria-label="aleatório" style="opacity:.75"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
  <button aria-label="foto anterior" id="prev"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="play" id="play" aria-label="tocar"><svg id="pi" width="28" height="28" viewBox="0 0 24 24" fill="#120a10"><path d="M8 5v14l11-7z"/></svg></button>
  <button aria-label="próxima foto" id="next"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  <button aria-label="repetir"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF4F9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
 </div>
 <div class="ded"><h3>💌 Dedicatória</h3><p id="ded"></p></div>
 <div class="acoes"><button id="bx">⬇ Baixar vídeo pro Status</button><button class="s" id="env">↗ Enviar</button></div>
 <div class="marca"><img src="/clipe-ex/m.png" alt="">feito com amor na Capivarinha Love</div>
</div>
<div class="ent" id="ent">
 <div class="k">🎁 Exemplo de presente</div>
 <h2>Um clipe com a <em>música</em> e as <em>fotos</em> de vocês</h2>
 <p>Imagine a Manuela abrindo isso no celular…</p>
 <button class="pb" id="go" aria-label="Tocar"><svg width="44" height="44" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button>
 <small>Toque para dar o play ♥</small>
 <div class="mini" id="mini"></div>
</div>
<div class="toast" id="toast"></div>
<audio id="au" src="/clipe-ex/musica.mp3" preload="auto"></audio>
<script>
var FOTOS=[1,2,3,4,5,6,7,8].map(function(n){return '/clipe-ex/'+n+'.webp'});
var DED='Manuela, cada foto aqui é um pedacinho da nossa história. Do pôr do sol na porteira até aquele abraço que eu não queria soltar. Obrigado por fazer da minha vida a minha música preferida. Te amo! ♥ — Rafael';
var $=function(i){return document.getElementById(i)},au=$('au'),capa=$('capa'),fi=-1,TROCA=6.5;
FOTOS.forEach(function(f,i){var im=new Image();im.src=f;im.alt='';capa.insertBefore(im,$('dots'));$('dots').insertAdjacentHTML('beforeend','<i></i>');if(i<4)$('mini').insertAdjacentHTML('beforeend','<img src="'+f+'" alt="">')});
var ims=capa.querySelectorAll('img'),dts=$('dots').querySelectorAll('i');
function foto(i){i=(i%ims.length+ims.length)%ims.length;if(i===fi)return;for(var k=0;k<ims.length;k++){var m=ims[k];m.classList.toggle('on',k===i);dts[k].classList.toggle('on',k===i)}$('bg').style.backgroundImage='url('+FOTOS[i]+')';fi=i}
var desl=0;$('next').onclick=function(){desl++;foto(fi+1)};$('prev').onclick=function(){desl--;foto(fi-1)};
var eqH='';for(var i=0;i<28;i++)eqH+='<i></i>';$('eq').innerHTML=eqH;var bars=$('eq').querySelectorAll('i');
var mm=function(s){s=Math.max(0,s||0);return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2)};
var an=null,buf=null;
function ligaAnalise(){try{var C=window.AudioContext||window.webkitAudioContext;var ctx=new C();var src=ctx.createMediaElementSource(au);an=ctx.createAnalyser();an.fftSize=64;src.connect(an);an.connect(ctx.destination);buf=new Uint8Array(an.frequencyBinCount);if(ctx.state==='suspended')ctx.resume()}catch(e){an=null}}
var ultHz=0,ultSeg='',ultN=-1,eqParado=0;
/* deslizar a foto pro lado (ou tocar na direita/esquerda) troca a foto, sem travar */
(function(){var x0=null,y0=0,t0=0;capa.addEventListener('touchstart',function(e){var p=e.touches[0];x0=p.clientX;y0=p.clientY;t0=Date.now()},{passive:true});capa.addEventListener('touchend',function(e){if(x0==null)return;var p=e.changedTouches[0],dx=p.clientX-x0,dy=p.clientY-y0;x0=null;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){dx<0?$('next').onclick():$('prev').onclick()}},{passive:true});capa.addEventListener('click',function(e){var r=capa.getBoundingClientRect();(e.clientX-r.left)>r.width/2?$('next').onclick():$('prev').onclick()})})();
function coracao(){var h=document.createElement('i');h.textContent=Math.random()<.7?'♥':'♪';h.style.left=(10+Math.random()*80)+'%';h.style.fontSize=(14+Math.random()*22)+'px';h.style.setProperty('--dx',(Math.random()*80-40)+'px');h.style.setProperty('--r',(Math.random()*60-30)+'deg');h.style.animationDuration=(5+Math.random()*4)+'s';$('hz').appendChild(h);setTimeout(function(){h.remove()},9500)}
function loop(){var t=au.currentTime,d=au.duration||183.9;
 var pr=Math.max(0,Math.min(1,(t/d*100)/100));$('fill').style.transform='scaleX('+pr.toFixed(4)+')';$('knob').style.transform='translateX('+($('trk').clientWidth*pr).toFixed(1)+'px)';
 var sg=Math.floor(t)+'|'+Math.floor(d);if(sg!==ultSeg){ultSeg=sg;$('cur').textContent=mm(t);$('dur').textContent='-'+mm(d-t)}
 foto(Math.floor(t/TROCA)+desl);
 var n=Math.min(DED.length,Math.floor(Math.max(0,t-1.5)*14));if(n!==ultN){ultN=n;$('ded').innerHTML=DED.slice(0,n).replace(/&/g,'&amp;').replace(/</g,'&lt;')+(n<DED.length?'<span class="cur"></span>':'');$('ded').scrollTop=$('ded').scrollHeight}
 var grave=0;
 if(!au.paused)eqParado=0;
 if(an&&!au.paused){an.getByteFrequencyData(buf);for(var k=0;k<bars.length;k++){var v=buf[Math.min(buf.length-1,Math.floor(k*buf.length/bars.length*.8))]/255;bars[k].style.transform='scaleY('+(.1+v*.9).toFixed(2)+')'}grave=(buf[1]+buf[2]+buf[3])/765}
 else if(!au.paused){for(var k=0;k<bars.length;k++)bars[k].style.transform='scaleY('+(.15+.7*Math.abs(Math.sin(t*4+k*.7)*Math.cos(t*1.3+k*.3))).toFixed(2)+')';grave=.5+.5*Math.sin(t*7)}
 else if(!eqParado){eqParado=1;for(var k=0;k<bars.length;k++)bars[k].style.transform='scaleY(.12)'}
 var g=Math.max(0,grave-.45)*1.8;$('glow').style.opacity=Math.min(1,g*1.4).toFixed(2);
 if(!au.paused&&performance.now()-ultHz>(grave>.7?350:900)){ultHz=performance.now();coracao()}
 requestAnimationFrame(loop)}
function icone(){$('pi').innerHTML=au.paused?'<path d="M8 5v14l11-7z"/>':'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'}
au.onplay=au.onpause=icone;
function tocar(){if(!an)ligaAnalise();au.play().catch(function(){})}
$('play').onclick=function(){au.paused?tocar():au.pause()};
$('go').onclick=function(){$('ent').classList.add('fora');tocar()};
$('trk').onclick=function(e){var r=this.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*(au.duration||95);desl=0};
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2600)}
$('bx').onclick=function(){toast('No seu clipe, este botão baixa o vídeo pra postar no Status e no Reels 🎬')};
$('env').onclick=function(){toast('No seu clipe, você manda o link direto no WhatsApp de quem você ama 💌')};
$('voltar').onclick=function(){au.pause();if(window.parent!==window){window.parent.postMessage('fecharExemplo','*');return}if(history.length>1)history.back();else location.href='/'};
foto(0);requestAnimationFrame(loop);
</script></body></html>
