[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/efi-cert.p12"]
  # o desenho das páginas do PDF do livro usa um módulo nativo: não pode ser empacotado
  external_node_modules = ["@napi-rs/canvas"]

# 🙌 Bonzinho Music (louvor personalizado) — página separada, mesmo sistema: /bonzinho
[[redirects]]
  from = "/bonzinho"
  to = "/bonzinho/index.html"
  status = 200

[[redirects]]
  from = "/bonzinho/"
  to = "/bonzinho/index.html"
  status = 200

# 🇺🇸 site em inglês (EUA): /us
[[redirects]]
  from = "/us"
  to = "/us/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/us/"
  to = "/us/index.html"
  status = 200
  force = true

# página do curso (link do Instagram): /aprenda abre o e-book, com ou sem barra no final
[[redirects]]
  from = "/aprenda"
  to = "/aprenda/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/aprenda/"
  to = "/aprenda/index.html"
  status = 200
  force = true

# link curto da mensagem de "música pronta" no WhatsApp → página das músicas do pedido
[[redirects]]
  from = "/m/:id"
  to = "/#/p/:id/c"
  status = 302

[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/og?id=:splat"
  status = 200

# imagens do site (mascote, depoimentos, medidor): não mudam → guarda no celular por 1 ano
[[headers]]
  for = "/a/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# áudios de exemplo e trilhas: guarda por 7 dias
[[headers]]
  for = "/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/clipe-ex/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 20/11: exemplos (vídeo da retrospectiva, capa) e scripts com ?v= ficam guardados no celular → abrem na hora da 2ª vez
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/exemplo-retrospectiva-poster.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/livro.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/quadro.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
