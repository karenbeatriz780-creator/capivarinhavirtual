/* ---------- wizard ---------- */
var PASSOS=['para','nome','ocasiao','estilo','clima','voz','historia','letra','musica','checkout'];
var passo=0;
function wizard(n){
  if(n!=null) passo=n;
  var k=PASSOS[passo], pct=Math.round((passo+1)/PASSOS.length*100), h='';
  if(k==='para'){
    h='<h2>Who is this song for?</h2><p class="hint">Pick one — we\'ll write it just for them.</p><div class="grid">'+
      PARA.map(function(p){ return '<button class="opt'+(S.para===p[0]?' on':'')+'" data-para="'+p[0]+'"><span class="e">'+p[1]+'</span>'+(p[4]||(DUPLO[p[0]]?p[2]+' / '+p[3]:p[2]))+'</button>'; }).join('')+'</div>';
    if(S.para==='outro') h+='<div class="sub-t">Who are they to you?</div><input class="inp" id="fOutro" maxlength="100" placeholder="e.g. my teacher, my coworker" value="'+esc(S.paraOutro)+'">';
    if(DUPLO[S.para]){ var p=PARA.filter(function(x){ return x[0]===S.para; })[0];
      h+='<div class="sub-t">It\'s for my…</div><div class="grid"><button class="opt'+(S.paraGen==='ela'?' on':'')+'" data-pgen="ela">'+p[2]+'</button><button class="opt'+(S.paraGen==='ele'?' on':'')+'" data-pgen="ele">'+p[3]+'</button></div>'; }
    if(S.para==='outro') h+='<div class="sub-t">They are…</div><div class="row3"><button class="opt'+(S.paraGen==='ela'?' on':'')+'" data-pgen="ela">Female</button><button class="opt'+(S.paraGen==='ele'?' on':'')+'" data-pgen="ele">Male</button><button class="opt'+(S.paraGen==='neutro'?' on':'')+'" data-pgen="neutro">Either</button></div>';
    if(S.para) h+='<div class="sub-t">And you are…</div><div class="row3">'+DE.map(function(d){ return '<button class="opt'+(S.de===d[0]?' on':'')+'" data-de="'+d[0]+'" style="font-size:.85rem">'+d[1]+'</button>'; }).join('')+'</div>';
  }
  if(k==='nome') h='<h2>What\'s their name?</h2><p class="hint">We\'ll sing it in the song. Add more names separated by commas.</p><input class="inp" id="fNome" maxlength="120" placeholder="e.g. Emily" value="'+esc(S.nome)+'" autocomplete="off">';
  if(k==='ocasiao') h='<h2>What\'s the occasion?</h2><p class="hint">&nbsp;</p><div class="grid">'+OCAS.map(function(o){ return '<button class="opt'+(S.ocasiao===o[0]?' on':'')+'" data-oc="'+esc(o[0])+'"><span class="e">'+o[1]+'</span>'+esc(o[0])+'</button>'; }).join('')+'</div>';
  if(k==='estilo') h='<h2>Pick a music style</h2><p class="hint">The most popular styles in the U.S. are at the top.</p><div class="grid">'+GEN.map(function(g){ return '<button class="opt'+(S.estilo===g[0]?' on':'')+'" data-gen="'+g[0]+'"><span class="e">'+g[1]+'</span><span>'+g[2]+(g[3]?'<small class="top">🔥 Top hit</small>':'')+'</span></button>'; }).join('')+'</div>';
  if(k==='clima') h='<h2>What\'s the mood?</h2><p class="hint">&nbsp;</p><div class="grid">'+CLIMA.map(function(c){ return '<button class="opt'+(S.clima===c[0]?' on':'')+'" data-cl="'+c[0]+'"><span class="e">'+c[1]+'</span>'+c[2]+'</button>'; }).join('')+'</div>';
  if(k==='voz') h='<h2>Who should sing it?</h2><p class="hint">&nbsp;</p><div class="row3">'+VOZ.map(function(v){ return '<button class="opt'+(S.voz===v[0]?' on':'')+'" data-voz="'+v[0]+'" style="flex-direction:column;justify-content:center"><span class="e">'+v[1]+'</span>'+v[2]+'</button>'; }).join('')+'</div>';
  if(k==='historia') h='<h2>Tell us your story</h2><p class="hint">How you met, inside jokes, places, what you love about them. The more details, the more special the song.</p>'+
    '<textarea class="inp" id="fHist" maxlength="2000" placeholder="We met at a coffee shop in 2019. She always laughs at my terrible jokes. Our first trip was to the beach…">'+esc(S.historia)+'</textarea><div class="cnt" id="cnt"></div>'+

  if(k==='checkout') acao='';

function erro(t){ var e=el('err'); if(e) e.textContent=t||''; }
function ok(k){
  if(k==='para'){ if(!S.para) return 'Choose who the song is for.'; if(S.para==='outro'&&S.paraOutro.trim().length<3) return 'Tell us who they are to you.'; if((DUPLO[S.para]||S.para==='outro')&&!S.paraGen) return 'Choose one option.'; if(!S.de) return 'Tell us if you\'re a woman or a man (it helps the lyrics).'; }
  if(k==='nome'&&S.nome.trim().length<2) return 'Type their name.';
  if(k==='ocasiao'&&!S.ocasiao) return 'Choose the occasion.';
  if(k==='estilo'&&!S.estilo) return 'Choose a style.';
  if(k==='clima'&&!S.clima) return 'Choose a mood.';
  if(k==='voz'&&!S.voz) return 'Choose a voice.';
  if(k==='historia'&&S.historia.trim().length<50) return 'Tell us a bit more — at least 50 characters.';
  return '';
}
function avancar(){ var k=PASSOS[passo], m=ok(k); if(m){ erro(m); return; } salvar(); if(k==='historia'){ S.letra=''; S.taskId=''; S.url=''; S.url2=''; S.pedido=''; salvar(); } wizard(passo+1); window.scrollTo(0,0); if(PASSOS[passo]==='letra'&&!S.letra) gerarLetra(); }
var _autoT=null;
function auto(){ salvar(); var k=PASSOS[passo]; clearTimeout(_autoT); _autoT=setTimeout(function(){ if(PASSOS[passo]===k) avancar(); },250); }
function ligar(k){
  function on(sel,fn){ document.querySelectorAll(sel).forEach(function(b){ b.onclick=function(){ fn(b); }; }); }
  on('[data-para]',function(b){ if(S.para!==b.dataset.para){ S.paraGen=''; } S.para=b.dataset.para; if(S.para==='familia') S.paraGen='neutro'; salvar(); wizard(); if(S.para&&S.de&&(S.paraGen||!DUPLO[S.para])&&S.para!=='outro') auto(); });
  on('[data-pgen]',function(b){ S.paraGen=b.dataset.pgen; salvar(); wizard(); if(S.de&&S.para!=='outro') auto(); });
  on('[data-de]',function(b){ S.de=b.dataset.de; if(!S.voz) S.voz=S.de==='mulher'?'feminina':'masculina'; salvar(); wizard(); if(!ok('para')&&S.para!=='outro') auto(); });
  on('[data-oc]',function(b){ S.ocasiao=b.dataset.oc; wizard(); auto(); });
  on('[data-gen]',function(b){ S.estilo=b.dataset.gen; wizard(); auto(); });
  on('[data-cl]',function(b){ S.clima=b.dataset.cl; wizard(); auto(); });
  on('[data-voz]',function(b){ S.voz=b.dataset.voz; wizard(); auto(); });
  var fo=el('fOutro'), fn=el('fNome'), fh=el('fHist'), ff=el('fFrase');
  if(fo) fo.oninput=function(){ S.paraOutro=fo.value; salvar(); };
  if(fn){ fn.oninput=function(){ S.nome=fn.value; salvar(); }; fn.onkeydown=function(e){ if(e.key==='Enter') avancar(); }; setTimeout(function(){ try{ fn.focus(); }catch(e){} },150); }
  if(fh){ var c=function(){ var n=S.historia.trim().length, ce=el('cnt'); if(!ce) return; ce.textContent=n>=50?'✓ '+n+' characters':'At least 50 characters ('+(50-n)+' to go)'; ce.className='cnt'+(n>=50?' ok':''); }; fh.oninput=function(){ S.historia=fh.value; salvar(); c(); }; c(); }
  if(ff) ff.oninput=function(){ S.frase=ff.value; salvar(); };
  if(k==='letra') ligarLetra();
  if(k==='musica') ligarMusica();
  if(k==='checkout') ligarCheckout();
}
function dados(){
  var rel=S.para==='familia'?'familia':S.para;
  var ocas=S.ocasiao==='Christmas'?'Christmas':S.ocasiao;
  return {idioma:'en', estilo:S.estilo, estiloOutro:'', texto:S.historia.trim(), clima:S.clima, relacao:rel, ocasiao:ocas,
    nomesLetra:S.nome.trim(), frase:S.frase.trim(), voz:S.voz, de:S.de, paraGen:S.paraGen, paraOutro:S.paraOutro};

function gerarLetra(ajuste){
  _letraBusy=true; if(PASSOS[passo]==='letra'){ wizard(); girarMsgs(MSG_LET,1800); }
  var body=Object.assign(dados(), ajuste||{}, {id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)});
  var fim=function(l){ _letraBusy=false; if(l){ S.letra=l; salvar(); } else toast('Couldn\'t write the lyrics right now. Please try again.'); if(PASSOS[passo]==='letra') wizard(); };
  api('letra-rapida',body).then(function(d){
    if(d&&d.letra) return fim(d.letra);
    var id2='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,9), t0=Date.now();

    (function ver(){ if(Date.now()-t0>120000) return fim(null);
      fetch('/.netlify/functions/gerar-letra-status?id='+id2,{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(s){ if(s&&s.pronto&&s.letra) return fim(s.letra); if(s&&s.pronto&&s.erro) return fim(null); setTimeout(ver,2000); }).catch(function(){ setTimeout(ver,2500); });
    })();

function htmlMusica(){

function limitar(){ var a=[].slice.call(document.querySelectorAll('audio')); a.forEach(function(x){ x.addEventListener('play',function(){ a.forEach(function(o){ if(o!==x) o.pause(); }); }); if(x.dataset.lim) x.addEventListener('timeupdate',function(){ if(x.currentTime>=60){ x.pause(); x.currentTime=0; toast('Unlock to hear the full song 🎶'); } }); }); }
function ligarMusica(){
  limitar();
  if(el('bUnlock')) el('bUnlock').onclick=function(){
    if(S.dobroDe){ var b=el('bUnlock'); b.disabled=true; b.textContent='Saving…';
      api('us-pedido',{dobroDe:S.dobroDe,taskId:S.taskId,email:S.email,nome:S.meuNome,paraNome:S.nome,estilo:S.estilo,clima:S.clima,relacao:S.para,ocasiao:S.ocasiao,voz:S.voz,letra:S.letra}).then(function(d){
        if(d&&d.id){ S.pedido=d.id; S.dobroDe=''; salvar(); location.hash='#/song/'+d.id; return; }
        if(d&&d.jaUsado){ S.dobroDe=''; salvar(); location.hash='#/song/'+d.jaUsado; return; }
        b.disabled=false; b.textContent='Save my 2 new songs ✓'; toast((d&&d.erro)||'Something went wrong. Try again.'); });
      return; }
    track('InitiateCheckout',{value:PRECO,currency:'USD'}); wizard(PASSOS.indexOf('checkout')); window.scrollTo(0,0); };
  if(el('bRefazer')) el('bRefazer').onclick=function(){ S.taskId=''; S.url=''; S.url2=''; S.pedido=''; salvar(); wizard(); gerarMusica(); };

var MSG_MUS=['Composing the melody…','Writing the arrangement…','Recording the vocals…','Singing their name…','Mixing the instruments…','Adding the final touches…'];
var MSG_LET=['Reading your story…','Finding the perfect words…','Adding their name…','Writing the chorus…','Polishing the lyrics…'];

function girarMsgs(lista,ms){ clearInterval(_msgT); var i=0; _msgT=setInterval(function(){ var m=el('mkMsg'); if(!m){ clearInterval(_msgT); return; } i=(i+1)%lista.length; m.style.opacity=0; setTimeout(function(){ m.textContent=lista[i]; m.style.opacity=1; },250); },ms); }
function progresso(){ clearInterval(_progT); var t0=Date.now(); girarMsgs(MSG_MUS,6000); _progT=setInterval(function(){ var p=el('pg'), c=el('pgPct'); if(!p){ clearInterval(_progT); return; } var t=(Date.now()-t0)/1000, x=Math.min(97,97*(1-Math.exp(-t/20))); p.style.width=x+'%'; if(c) c.textContent=Math.floor(x)+'%'; },300); }
function gerarMusica(){

  api('gerar-musica',Object.assign(dados(),{letraAprovada:S.letra})).then(function(d){
    if(!d||!d.taskId){ _musBusy=false; toast((d&&d.erro)||'Couldn\'t start your song. Please try again.'); wizard(PASSOS.indexOf('letra')); return; }

function acompanhar(tid){

    if(S.taskId!==tid) return;
    fetch('/.netlify/functions/gerar-musica-status?taskId='+encodeURIComponent(tid),{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      if(d&&d.pronto&&d.url){ _musBusy=false; S.url=d.url; S.url2=d.url2||''; salvar(); track('AddToCart',{value:PRECO,currency:'USD'}); if(PASSOS[passo]==='musica') wizard(); return; }
      if(d&&d.falhou){ _musBusy=false; S.taskId=''; salvar(); toast('Something went wrong making your song. Please try again.'); if(PASSOS[passo]==='musica') wizard(PASSOS.indexOf('letra')); return; }
      if(++n>200){ _musBusy=false; toast('Your song is taking longer than usual. Please try again.'); return; }
      setTimeout(ver,3000);
    }).catch(function(){ setTimeout(ver,4000); });
  })();
}

/* ---------- checkout ---------- */
var _cfg=null, _stJs=null, _ck=null;
function cfg(){ if(_cfg) return Promise.resolve(_cfg); return fetch('/.netlify/functions/pagamento-cfg').then(function(r){ return r.json(); }).then(function(d){ _cfg=d||{}; return _cfg; }); }
function stripeJs(){ if(window.Stripe) return Promise.resolve(); if(_stJs) return _stJs; _stJs=new Promise(function(ok,no){ var s=document.createElement('script'); s.src='https://js.stripe.com/v3/'; s.onload=ok; s.onerror=function(){ _stJs=null; no(new Error('js')); }; document.head.appendChild(s); }); return _stJs; }
function htmlCheckout(){
  return '<h2>Unlock your song</h2><p class="hint">Where should we send your song?</p>'+
    '<div class="box">'+
      (S.bonusDe?'<div class="tot"><span>Your referral reward</span><b>FREE 🎁</b></div>':'<div class="tot"><span>Total</span><b>'+money(PRECO)+' USD</b></div>')+
      '<ul class="incl"><li><b>4 full songs</b>: these 2 + 2 more with new lyrics &amp; style</li><li>Download MP3 + share link</li><li>Lyrics included · yours forever</li></ul>'+
      '<div class="sub-t">Your email</div><input class="inp" id="fEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" value="'+esc(S.email)+'">'+
      '<div class="sub-t">Your first name <span style="color:var(--mut);font-weight:500">(optional)</span></div><input class="inp" id="fMeu" maxlength="60" autocomplete="given-name" placeholder="e.g. Michael" value="'+esc(S.meuNome)+'">'+
      '<button class="btn btn-p" id="bPagar" style="margin-top:16px">'+(S.bonusDe?'Get my free song 🎁':'Continue to payment')+'</button>'+
      (S.bonusDe?'':payLogos())+
      '<div id="stBox" hidden><div class="stmsg">Opening secure checkout…</div></div>'+
    '</div>';
}
function ligarCheckout(){
  var e=el('fEmail'), m=el('fMeu');
  e.oninput=function(){ S.email=e.value.trim(); salvar(); }; m.oninput=function(){ S.meuNome=m.value.trim(); salvar(); };
  el('bPagar').onclick=function(){
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email)){ erro('Please enter a valid email so we can send your song.'); e.focus(); return; }
    erro(''); var b=el('bPagar'); b.disabled=true; b.textContent='Opening checkout…';
    var pedidoP = S.pedido ? Promise.resolve({id:S.pedido}) : api('us-pedido',{ref:LS.get('us_ref')||'',bonusDe:S.bonusDe||'',taskId:S.taskId,email:S.email,nome:S.meuNome,paraNome:S.nome,estilo:S.estilo,clima:S.clima,relacao:S.para,ocasiao:S.ocasiao,voz:S.voz,letra:S.letra});
    pedidoP.then(function(p){
      if(!p||!p.id) throw new Error((p&&p.erro)||'Couldn\'t create your order.');
      S.pedido=p.id; salvar();
      if(p.gratis){ S.bonusDe=''; salvar(); location.hash='#/song/'+p.id; return [null,{pago:true}]; }
      return Promise.all([cfg(), api('stripe-pagar',{acao:'sessao',id:p.id})]);
    }).then(function(r){
      var c=r[0], d=r[1];
      if(d&&d.pago){ if(location.hash!=='#/song/'+S.pedido) location.hash='#/song/'+S.pedido; return; }
      if(!d||!d.clientSecret) throw new Error('Card payment is unavailable right now. Please try again in a moment.');
      var sessao=d.sessao;
      return stripeJs().then(function(){
        try{ if(_ck){ _ck.destroy(); _ck=null; } }catch(x){}
        return Stripe(d.pk||c.pk).initEmbeddedCheckout({fetchClientSecret:function(){ return Promise.resolve(d.clientSecret); }, onComplete:function(){ confirmar(sessao,0); }});
      }).then(function(ck){ _ck=ck; var bx=el('stBox'); bx.hidden=false; bx.innerHTML=''; ck.mount('#stBox'); b.style.display='none'; try{ bx.scrollIntoView({behavior:'smooth',block:'start'}); }catch(x){} });
    }).catch(function(x){ b.disabled=false; b.textContent='Continue to payment'; erro(x&&x.message&&x.message!=='js'?x.message:'Couldn\'t open the checkout. Please try again.'); });
  };
}
function confirmar(sessao,n){
  api('stripe-pagar',{acao:'confirmar',id:S.pedido,sessao:sessao}).then(function(d){
    if(d&&d.pago){ try{ fbq('track','Purchase',{value:PRECO,currency:'USD',content_name:'musica_us'},{eventID:'compra_'+S.pedido}); }catch(e){} location.hash='#/song/'+S.pedido; return; }
    if(n<10) setTimeout(function(){ confirmar(sessao,n+1); },2500); else location.hash='#/song/'+S.pedido;
  }).catch(function(){ if(n<10) setTimeout(function(){ confirmar(sessao,n+1); },2500); });
}

/* ---------- song page (after payment) ---------- */
function telaSong(id){
  el('app').innerHTML=topo()+'<div class="w wz"><div class="load"><div class="spin"></div><div>Loading your song…</div></div></div>';
  var n=0;
  (function ver(){
    fetch('/.netlify/functions/presente?id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      if(d&&d.pago&&d.presente) return mostrar(d.presente);
      if(d&&d.encontrado===false){ el('app').innerHTML=topo()+'<div class="w wz"><h2>Song not found</h2><p class="hint">Check the link in your email.</p><a class="btn btn-p" href="#/">Go to home</a></div>'; return; }
      if(++n<30){ if(n===3) el('app').querySelector('.load div:last-child').textContent='Confirming your payment…'; setTimeout(ver,2500); return; }
      el('app').innerHTML=topo()+'<div class="w wz"><h2>Payment not confirmed yet</h2><p class="hint">If you completed the payment, this page will unlock in a moment. Otherwise, go back and finish checkout.</p><a class="btn btn-p" href="#/song/'+esc(id)+'">Check again</a></div>';
    }).catch(function(){ setTimeout(ver,3000); });
  })();
}
function mostrar(g){
  var para=g.musicaParaNome||'', link=location.origin+'/us/#/song/'+g.id;
  el('app').innerHTML=topo()+'<div class="w wz">'+
    '<div class="ok-h"><div>🎉</div><h2>Your song'+(para?' for '+esc(para):'')+' is ready!</h2><p class="hint">Full length. Find it anytime in <b>🎁 My songs</b> with your email.</p></div>'+
    player('Version 1',g.musicaPreviewUrl,false)+'<div class="dl" style="margin:-4px 0 12px"><a href="/.netlify/functions/baixar-musica?id='+encodeURIComponent(g.id)+'&v=1">⬇ Download MP3</a></div>'+
    (g.musicaPreviewUrl2?player('Version 2',g.musicaPreviewUrl2,false)+'<div class="dl" style="margin:-4px 0 12px"><a href="/.netlify/functions/baixar-musica?id='+encodeURIComponent(g.id)+'&v=2">⬇ Download MP3</a></div>':'')+
    (g.quatro&&!g.dobroUsado?'<div class="box" style="border-color:rgba(245,196,81,.5);margin-bottom:14px"><div class="sub-t" style="margin-top:0">🎶 You have 2 more songs included!</div><p class="note" style="margin:0 0 10px">Create songs 3 and 4 with new lyrics and a different style — already paid.</p><button class="btn btn-p" id="bDobro">Create my other 2 songs</button></div>':'')+
    (g.dobroUsado?'<a class="btn btn-g" style="margin-bottom:12px" href="#/song/'+esc(g.dobroUsado)+'">🎶 Listen to songs 3 &amp; 4 →</a>':'')+
    (g.dobroDe?'<a class="btn btn-g" style="margin-bottom:12px" href="#/song/'+esc(g.dobroDe)+'">🎵 Listen to songs 1 &amp; 2 →</a>':'')+
    '<button class="btn btn-p" id="bShare">💌 Send it to '+(para?esc(para.split(',')[0]):'them')+'</button>'+
    (g.musicaLetra?'<div class="box"><div class="sub-t" style="margin-top:0">Lyrics</div><pre class="lt">'+esc(g.musicaLetra)+'</pre></div>':'')+
    '<div class="box ref" id="refBox"><div class="sub-t" style="margin-top:0">🎁 Share &amp; earn a free song</div><p class="note" style="margin:0 0 10px">Every friend who buys a song with your link gives you <b>1 free song</b> (2 versions).</p>'+
      '<div class="reflink">'+esc(location.origin+'/us/#/r/'+g.id)+'</div><div class="mini"><button id="bRef">📤 Share my link</button></div><div id="refSt" class="note"></div></div>'+
    '<div class="mini" style="margin-top:16px"><button id="bOutra">🎶 Create another song</button></div>'+
    (LS.get('cl_admin_key')?'<div class="mini"><button id="bEx1">⭐ Use version 1 as example</button><button id="bEx2">⭐ Use version 2</button></div>':'')+
  '</div><footer>Keep this link to listen anytime:<br>'+esc(link)+'</footer>';
  limitar();
  el('bShare').onclick=function(){ var txt='I made a song just for you 💗'; if(navigator.share){ navigator.share({title:'A song for you',text:txt,url:link}).catch(function(){}); } else { try{ navigator.clipboard.writeText(txt+' '+link); toast('Link copied! Paste it in a message.'); }catch(e){ prompt('Copy this link:',link); } } };
  if(el('bDobro')) el('bDobro').onclick=function(){ var keep={para:g.musicaPara||S.para,paraGen:S.paraGen,de:S.de,nome:g.musicaParaNome||S.nome,ocasiao:g.musicaOcasiao||S.ocasiao,voz:g.musicaVoz||S.voz,historia:S.historia,email:g.email||S.email,meuNome:g.meuNome||S.meuNome};
    S=novo(); Object.keys(keep).forEach(function(k){ S[k]=keep[k]||''; }); S.dobroDe=g.id; S.estilo=''; salvar();
    toast('Pick a different style for songs 3 and 4 🎶'); passo=S.historia&&S.para&&S.nome?PASSOS.indexOf('estilo'):0; location.hash='#/create'; };
  el('bOutra').onclick=function(){ var em=S.email, mn=S.meuNome; S=novo(); S.email=em; S.meuNome=mn; salvar(); location.hash='#/create'; };
  var rl=location.origin+'/us/#/r/'+g.id;
  el('bRef').onclick=function(){ var t='I made a personalized song for someone I love 💗 Make one too — you hear it free before paying:'; if(navigator.share){ navigator.share({title:'Personalized songs',text:t,url:rl}).catch(function(){}); } else { try{ navigator.clipboard.writeText(t+' '+rl); toast('Link copied!'); }catch(e){ prompt('Copy your link:',rl); } } };
  fetch('/.netlify/functions/us-extra?acao=ref&id='+encodeURIComponent(g.id),{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    var st=el('refSt'); if(!st||!d) return;
    if(d.disponiveis>0){ st.innerHTML='<b style="color:var(--gold)">You have '+d.disponiveis+' free song'+(d.disponiveis>1?'s':'')+'!</b>'; var b=document.createElement('button'); b.className='btn btn-p'; b.style.marginTop='10px'; b.textContent='🎁 Create my free song'; b.onclick=function(){ var em=S.email||g.email||'', mn=S.meuNome; S=novo(); S.email=em; S.meuNome=mn; S.bonusDe=g.id; salvar(); location.hash='#/create'; }; st.appendChild(b); }
    else if(d.confirmadas>0) st.textContent=d.confirmadas+' friend(s) bought with your link.';
  }).catch(function(){});
  [1,2].forEach(function(v){ var b=el('bEx'+v); if(b) b.onclick=function(){ var t=prompt('Example title (shown on the site):','Song for '+(para||'someone special')); if(t===null) return; var sub=prompt('Small line under it (style · occasion):',(g.musicaEstilo||'')+(g.musicaOcasiao?' · '+g.musicaOcasiao:'')); fetch('/.netlify/functions/us-extra',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':LS.get('cl_admin_key')},body:JSON.stringify({acao:'exemplo-add',id:g.id,v:v,titulo:t,sub:sub||''})}).then(function(r){ return r.json(); }).then(function(d){ toast(d&&d.ok?'Added to examples ✓':((d&&d.erro)||'Error')); }); }; });
}
/* ---------- my songs (by email) ---------- */
function telaMeus(){
  el('app').innerHTML=topo()+'<div class="w wz"><h2>My songs 🎁</h2><p class="hint">Type the email you used to buy and we\'ll show your songs.</p>'+
    '<input class="inp" id="mEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" value="'+esc(S.email||'')+'">'+
    '<button class="btn btn-p" id="mVer" style="margin-top:12px">Show my songs</button><div class="err" id="err"></div><div id="mLista" style="margin-top:14px"></div></div>';
  function ver(){ var em=(el('mEmail').value||'').trim(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ erro('Please enter a valid email.'); return; } erro(''); var b=el('mVer'); b.disabled=true;
    fetch('/.netlify/functions/us-extra?acao=meus&email='+encodeURIComponent(em),{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){ b.disabled=false;
      var it=(d&&d.itens)||[]; el('mLista').innerHTML=it.length?it.map(function(x){ return '<a class="opt" style="margin-bottom:8px;text-decoration:none" href="#/song/'+esc(x.id)+'"><span class="e">🎵</span><span>Song'+(x.para?' for '+esc(x.para):'')+'<small>'+new Date(x.em).toLocaleDateString('en-US')+'</small></span></a>'; }).join(''):'<p class="hint">No songs found for this email yet.</p>';
    }).catch(function(){ b.disabled=false; erro('Connection problem. Try again.'); }); }
  el('mVer').onclick=ver; el('mEmail').onkeydown=function(e){ if(e.key==='Enter') ver(); };
}

/* ---------- router ---------- */
function rota(){
  try{ if(_ck){ _ck.destroy(); _ck=null; } }catch(e){}
  var h=location.hash.replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  if(h[0]==='create'){ if(passo>=PASSOS.indexOf('letra') && !S.letra) passo=PASSOS.indexOf('historia'); wizard(); if(PASSOS[passo]==='letra'&&!S.letra&&!_letraBusy) gerarLetra(); return; }
  if(h[0]==='song'&&h[1]){ telaSong(h[1]); return; }
  if(h[0]==='my'){ telaMeus(); return; }
  if(h[0]==='r'&&h[1]){ LS.set('us_ref',h[1]); location.replace('#/'); return; }
  home();
}
window.addEventListener('hashchange',rota);
/* resume where the person left off */
(function(){ if(S.url) passo=PASSOS.indexOf('musica'); else if(S.letra) passo=PASSOS.indexOf('letra'); })();
rota();
</script>
