<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Teste — cantar com a minha voz</title>
<style>body{font-family:system-ui,sans-serif;background:#fff5f8;color:#3a0a1e;margin:0;padding:1.2rem;max-width:520px;margin:auto}h1{font-size:1.3rem;color:#c2185b}
.card{background:#fff;border-radius:18px;padding:1.1rem;margin:1rem 0;box-shadow:0 4px 16px rgba(194,24,91,.12);text-align:center}
button{width:100%;padding:1rem;border:0;border-radius:14px;font-size:1.05rem;font-weight:800;background:#c2185b;color:#fff;margin-top:.7rem}button:disabled{opacity:.5}
.cont{font-size:4.5rem;font-weight:900;color:#c2185b;height:5.2rem;line-height:5.2rem}
.kara{font-size:1.45rem;font-weight:800;line-height:1.5;min-height:4.4rem;padding:.4rem}.kara span{transition:color .2s}.kara span.on{color:#c2185b}
.rot{font-size:.85rem;font-weight:700;color:#8a5a6a;text-transform:uppercase;letter-spacing:.05em}.st{font-size:.92rem;margin-top:.6rem;min-height:1.2rem}
.rec{display:inline-block;width:.7rem;height:.7rem;background:#e53935;border-radius:50%;margin-right:.3rem;animation:p 1s infinite}@keyframes p{50%{opacity:.2}}
audio{width:100%;margin-top:.6rem}textarea{width:100%;box-sizing:border-box;min-height:110px;border-radius:10px;padding:.6rem;font-size:.95rem;text-align:left}</style></head><body>
<h1>🎤 Teste: música com a minha voz</h1>
<div class="card" id="cv">
  <div class="rot" id="rot">Cante junto · uns 40 segundos no total</div>
  <div class="cont" id="cont">🎤</div>
  <div class="kara" id="kara">Lugar silencioso, celular a um palmo da boca. Cante com a sua voz normal as frases que aparecerem.</div>
  <button id="bv">▶ Começar</button>
  <div class="st" id="sv"></div>
</div>
<div class="card" id="cm" style="display:none"><b>Gerar uma música com a sua voz</b><textarea id="letra">[Verso]
Gusthavo canta essa canção
Com a voz que vem do coração
[Refrão]
Capivarinha Love, minha emoção
Cada nota é uma declaração</textarea><button id="bm">🎶 Gerar música na minha voz</button><div class="st" id="sm"></div><div id="aud"></div></div>
<script>
// Frase fixa (nossa) = amostra da voz. Depois a Kie manda a frase de verificação, que aparece igual karaokê.
var LINHAS1=['Essa música é pra você','Com todo amor do meu coração','Cada dia ao seu lado é uma canção','Lá lá lá, lá lá lá, minha emoção','Vou cantar pra sempre essa paixão'];
var SEG1=28;
// amostra longa (~28 s): as linhas vão aparecendo uma a uma, como karaokê, numa gravação só
function cantarLongo(linhas,seg){var por=seg/linhas.length,atual=-1;
 return contagem().then(function(){return new Promise(function(ok,erro){var rec=new MediaRecorder(stream),pd=[];rec.ondataavailable=function(e){if(e.data.size)pd.push(e.data)};
  rec.onstop=function(){new Blob(pd).arrayBuffer().then(function(ab){return new (window.AudioContext||window.webkitAudioContext)().decodeAudioData(ab)}).then(function(b){ok({wav:wav(b),dur:b.duration})}).catch(erro)};
  rec.start();var t0=Date.now(),iv=setInterval(function(){var el=(Date.now()-t0)/1000,i=Math.min(linhas.length-1,Math.floor(el/por));
   if(i!==atual){atual=i;karaoke(linhas[i]);$('rot').textContent='Frase '+(i+1)+' de '+linhas.length+' · '+Math.max(0,Math.ceil(seg-el))+'s';}
   var f=(el-i*por)/(por*0.85),sp=$('kara').querySelectorAll('span');sp.forEach(function(s,j){s.className=(j<f*sp.length)?'on':''});
   $('rot').textContent='Linha '+(i+1)+' de '+linhas.length+' · '+Math.max(0,Math.ceil(seg-el))+'s';
   if(el>=seg){clearInterval(iv);rec.stop()}},120)})})}
var $=function(i){return document.getElementById(i)},F='/.netlify/functions/voz',task=null,stream=null;
function wav(buf){var ch=buf.getChannelData(0),sr=buf.sampleRate,alvo=24000,k=sr/alvo,n=Math.floor(ch.length/k),dv=new DataView(new ArrayBuffer(44+n*2));
 function w(o,s){for(var i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))}
 w(0,'RIFF');dv.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,alvo,true);dv.setUint32(28,alvo*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*2,true);
 for(var i=0;i<n;i++){var v=Math.max(-1,Math.min(1,ch[Math.floor(i*k)]));dv.setInt16(44+i*2,v<0?v*32768:v*32767,true)}return dv.buffer}
function b64(ab){var s='',u=new Uint8Array(ab);for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function espera(ms){return new Promise(function(ok){setTimeout(ok,ms)})}
function contagem(){var n=[3,2,1],i=0;return new Promise(function(ok){(function t(){if(i<n.length){$('cont').textContent=n[i++];setTimeout(t,800)}else{$('cont').innerHTML='<span class="rec"></span>Cante!';ok()}})()})}
function karaoke(frase){var ws=frase.split(/\s+/);$('kara').innerHTML=ws.map(function(w){return '<span>'+w.replace(/</g,'')+'</span>'}).join(' ');return ws.length}
// grava cantando a frase: contagem 3-2-1, destaca palavra por palavra, para sozinho e devolve o WAV
function cantar(frase){var nw=karaoke(frase),seg=Math.max(5,Math.min(14,nw*0.65+2));
 return contagem().then(function(){return new Promise(function(ok,erro){var rec=new MediaRecorder(stream),pd=[];rec.ondataavailable=function(e){if(e.data.size)pd.push(e.data)};
  rec.onstop=function(){new Blob(pd).arrayBuffer().then(function(ab){return new (window.AudioContext||window.webkitAudioContext)().decodeAudioData(ab)}).then(function(b){ok({wav:wav(b),dur:b.duration})}).catch(erro)};
  rec.start();var sp=$('kara').querySelectorAll('span'),t0=Date.now(),iv=setInterval(function(){var f=(Date.now()-t0)/((seg-1.2)*1000);sp.forEach(function(s,i){s.className=(i<f*sp.length)?'on':''});if(Date.now()-t0>=seg*1000){clearInterval(iv);rec.stop()}},120)})})}
function subir(w){return fetch(F,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'subir',b64:b64(w)})}).then(function(r){return r.json()}).then(function(d){if(!d.url)throw new Error(d.erro||'falhou ao enviar');return d.url})}
function post(o){return fetch(F,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){return r.json()}).then(function(d){if(d.erro)throw new Error(d.erro);return d})}
function esperarKie(cond,ms,tent){return new Promise(function(ok,erro){var n=0;(function v(){fetch(F+'?t='+encodeURIComponent(task)).then(function(r){return r.json()}).then(function(d){if(cond(d))return ok(d);if(d.estado==='fail')return erro(new Error(d.erro||'falhou'));if(++n>tent)return erro(new Error('demorou demais'));setTimeout(v,ms)}).catch(function(){setTimeout(v,ms)})})()})}
$('bv').onclick=function(){$('bv').disabled=true;$('sv').textContent='';
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}}).then(function(s){stream=s;return cantarLongo(LINHAS1,SEG1)})
 .then(function(r){$('cont').textContent='⏳';$('kara').textContent='Ouvindo sua voz…';return subir(r.wav).then(function(url){return post({acao:'frase',url:url,dur:r.dur})})})
 .then(function(d){task=d.taskId;return esperarKie(function(x){return !!x.frase},2500,60)})
 .then(function(d){$('rot').textContent='Última frase (verificação)';$('kara').textContent=d.frase;$('cont').textContent='👀';return espera(2500).then(function(){return cantar(d.frase)})})
 .then(function(r){$('cont').textContent='⏳';$('kara').textContent='Criando a sua voz… (até 1 minuto)';return subir(r.wav).then(function(url){return post({acao:'criar',taskId:task,url:url})})})
 .then(function(){return esperarKie(function(x){return x.estado==='success'},4000,60)})
 .then(function(){if(stream)stream.getTracks().forEach(function(t){t.stop()});$('cont').textContent='✅';$('rot').textContent='Pronto';$('kara').textContent='Sua voz foi criada!';$('cm').style.display='block'})
 .catch(function(e){if(stream)stream.getTracks().forEach(function(t){t.stop()});$('cont').textContent='😕';$('kara').textContent='Não deu certo dessa vez.';$('sv').textContent='❌ '+e.message;$('bv').textContent='↻ Tentar de novo';$('bv').disabled=false})};
$('bm').onclick=function(){$('bm').disabled=true;$('sm').textContent='Gerando…';
 fetch('/.netlify/functions/gerar-musica',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({estilo:'sertanejo',texto:'Teste da música cantada com a voz do próprio cliente, para conferir a qualidade em português.',letraAprovada:$('letra').value,vozId:task,origem:'painel',relacao:'namorada',ocasiao:'Surpresa'})})
 .then(function(r){return r.json()}).then(function(d){if(!d.taskId)throw new Error(d.erro||'não começou');var n=0;(function v(){fetch('/.netlify/functions/gerar-musica-status?taskId='+encodeURIComponent(d.taskId)).then(function(r){return r.json()}).then(function(x){
  if(x.url){$('sm').textContent='✅ Pronta!';$('aud').innerHTML='<audio controls src="'+x.url+'"></audio>'+(x.url2?'<audio controls src="'+x.url2+'"></audio>':'');$('bm').disabled=false;return}
  if(x.erro||x.status==='failed'){$('sm').textContent='❌ '+(x.erro||x.message||'falhou');$('bm').disabled=false;return}
  $('sm').textContent='Gerando… '+(++n*5)+'s';setTimeout(v,5000)}).catch(function(){setTimeout(v,5000)})})()}).catch(function(e){$('sm').textContent='❌ '+e.message;$('bm').disabled=false})};
</script></body></html>
